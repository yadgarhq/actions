# Shared hooks, so each repository stops copying a near-identical local config
# (D59, D62). A repository references these instead of redefining them:
#
#   - repo: https://github.com/yadgarhq/actions
#     rev: v1
#     hooks:
#       - id: cargo-fmt
#       - id: cargo-clippy
#       - id: gitleaks
#
# Two kinds of hook here. `language: system` calls a tool the developer already
# has; `language: node` (and friends) let pre-commit install the tool itself, with
# the VERSION PINNED HERE rather than in every repository.
#
# That second kind is the point. A tool referenced directly by each repository is
# a version each repository pins separately, and nothing stops one sitting on
# prettier 3.9.6 while another sits on 3.8.0 with both configs looking correct.
# Pinning here makes the drift impossible rather than merely visible.
- id: cargo-fmt
  name: cargo fmt
  language: system
  entry: cargo fmt --check
  pass_filenames: false
  files: \.rs$

- id: cargo-clippy
  name: cargo clippy
  language: system
  entry: cargo clippy --all-targets --all-features -- -D warnings
  pass_filenames: false
  files: \.(rs|toml)$

# D24 requires a permissive stack stay viable and O10 requires the audit be
# re-run before adding a dependency — an instruction that otherwise depends on
# being remembered.
- id: cargo-deny
  name: cargo deny (licences, advisories, sources)
  language: system
  entry: cargo deny check
  pass_filenames: false
  files: (Cargo\.(toml|lock)|deny\.toml)$

# Force-pushing does not scrub GitHub history — PR refs pin every commit and are
# never collected — so a credential that lands in a repository means deleting and
# recreating it. Prevention is the only cheap point on that timeline.
- id: gitleaks
  name: Detect secrets and credentials
  language: system
  entry: gitleaks git --pre-commit --staged --verbose
  pass_filenames: false

# Prettier for markdown, JSON and YAML. cargo fmt covers Rust and buf format
# covers proto; this is everything else.
#
# `proseWrap: preserve` belongs in each repository's .prettierrc and is
# load-bearing: without it prettier reflows prose, and every future diff to a
# hand-wrapped document becomes unreadable. Measured before adopting — with it,
# 332 of 2276 lines change on the largest document here and NONE of them is
# prose.
- id: prettier
  name: prettier
  language: node
  # The version lives here, once, for every repository.
  additional_dependencies: ["prettier@3.9.6"]
  entry: prettier --write --ignore-unknown
  types_or: [markdown, json, yaml]
# WHEN TO WRAP A TOOL HERE, refined after getting it wrong once: the test is not
# whether upstream maintains its own hooks, it is HOW MANY REPOSITORIES USE THE
# TOOL. A directly referenced hook is a version pinned separately in every
# repository that references it, and that is where drift comes from.
#
#   many repositories  -> wrap here, so one version exists
#   exactly one        -> reference upstream directly, drift is impossible
#
# So prettier and hadolint are wrapped (every repository, and ~61 respectively),
# while buf is NOT: only `proto` carries a .proto contract, so bufbuild's own
# maintained hooks are referenced there and there is nothing to drift against.
# Wrapping buf would add a version to maintain and buy nothing.

# Containerfiles (podman's native name; pre-commit's identify tags them as
# dockerfile, so this hook matches them unchanged — verified empirically).
# hadolint publishes its own hooks, but it is wrapped here anyway
# — see the note below on when that is right.
- id: hadolint
  name: hadolint
  language: system
  types: [dockerfile]
  entry: hadolint

# A Helm chart is a Go template that HAPPENS to look like YAML, so check-yaml and
# prettier cannot read it and every chart repo excludes chart/templates from them.
# This hook is what makes that exclusion honest rather than a hole.
#
# It lives HERE, as a hook, rather than only as a CI job — because a check that
# runs in CI and not locally is the same "two definitions of clean" that the SKIP
# list was deleted for. The CI precommit job runs every hook with no SKIP list, so
# putting it here runs it in both places from one definition.
#
# `helm template` as well as `helm lint`: lint checks the chart's structure,
# rendering catches a template that parses and then produces invalid Kubernetes
# YAML. They fail on different things.
- id: helm-lint
  name: helm lint and render
  language: system
  entry: bash -c 'helm lint chart && helm template ci-render chart > /dev/null'
  pass_filenames: false
  files: ^chart/

# D59 deferred this hook because the thing it checks did not exist yet. It does
# now: yadgar-telemetry's observe::Call.
#
# A handler either opens a Call or it does not — a grep, not a judgement. What it
# deliberately does NOT check is whether the outcome, class or row count are
# right; a hook cannot know that, and pretending to would be the "two definitions
# of clean" failure this project keeps refusing.
#
# The failure it prevents is silent: a module that quietly stops emitting looks
# exactly like a module nobody called, which is the reading that would break D15.
# `language: script`, NOT python. `language: python` makes pre-commit try to pip
# install THIS repository, which has no pyproject.toml and is not a package —
# the error is "Directory '.' is not installable", raised in the CONSUMING repo
# where nothing explains it. Same shape as the earlier language: node failure.
#
# script runs the file directly; it carries a shebang and the executable bit.
- id: observe-coverage
  name: every RPC handler is instrumented
  language: script
  entry: hooks/observe_coverage.py
  files: \.rs$
