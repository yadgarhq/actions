# Shared hooks, so each repository stops copying a near-identical local config
# (D59, D62). A repository references these instead of redefining them:
#
#   - repo: https://github.com/yadgarhq/actions
#     rev: v1.5.0   # an IMMUTABLE tag — never `v1`
#     hooks:
#       - id: cargo-fmt
#       - id: cargo-clippy
#       - id: gitleaks
#
# THE EXAMPLE ABOVE PINS AN EXACT VERSION, and that is the point rather than
# pedantry. pre-commit caches a rev at first install and NEVER re-resolves it —
# "mutable references are never updated after first install and are not
# supported" — so a repository pinning `v1` freezes at whatever `v1` meant on that
# machine's first run, and two developers sit on different hook versions with
# byte-identical config.
#
# This example used to say `v1`, two lines above the comment explaining why that
# fails. A moving `v1` tag also exists in this repository, frozen at v1.5.0's
# commit. It CANNOT move: the `release-tags` ruleset on `refs/tags/v*` carries
# `deletion`, `non_fast_forward` AND `update` with no bypass actors, so a
# force-update is refused like a deletion. An earlier revision of this paragraph
# said the ruleset permitted a force-update and called that the wrong way round;
# the ruleset was corrected on 2026-08-31 and this sentence was not. The hazard
# is now the opposite one: a repository pinning `v1` freezes on v1.5.0 content
# with a config that reads as current, and never receives anything published
# after it.
#
# Two kinds of hook here. `language: system` calls a tool the developer already
# has; `language: node` (and friends) let pre-commit install the tool itself, with
# the VERSION PINNED HERE rather than in every repository.
#
# That second kind is the point. A tool referenced directly by each repository is
# a version each repository pins separately, and nothing stops one sitting on
# prettier 3.9.6 while another sits on 3.8.0 with both configs looking correct.
# Pinning here makes the drift impossible rather than merely visible.
- id: cargo-fmt
  name: cargo fmt
  language: system
  entry: cargo fmt --check
  pass_filenames: false
  files: \.rs$

- id: cargo-clippy
  name: cargo clippy
  language: system
  entry: cargo clippy --all-targets --all-features -- -D warnings
  pass_filenames: false
  files: \.(rs|toml)$

# D24 requires a permissive stack stay viable and O10 requires the audit be
# re-run before adding a dependency — an instruction that otherwise depends on
# being remembered.
# MECHANICAL CEILINGS on file and function size, so complexity is a decision
# someone makes rather than something that accumulates. Adopted early on purpose:
# a repository that crosses a limit on its first day changes one file, while one
# that crosses it after a year needs a refactor nobody scheduled — and adopting a
# limit already breached means starting with an exemption list, which is how a
# limit stops meaning anything.
#
# `language: script`, NOT `language: python`. A python-language hook pip-installs
# this repository, and the failure surfaces in the consuming repo as an install
# error rather than a hook error — learned in v1.4.0 and fixed in v1.4.1.
- id: complexity
  name: file and function size ceilings
  language: script
  entry: hooks/complexity.py
  files: \.rs$

# Clippy's complexity lints, which measure what a line count cannot: nesting and
# branching. A 300-line function of flat match arms is fine; a 40-line one with
# five levels of nesting is not. The two hooks are complementary, and neither
# replaces reading the code.
- id: cargo-clippy-complexity
  name: cognitive complexity
  language: system
  entry: cargo clippy --all-targets --all-features -- -W clippy::cognitive_complexity -W clippy::too_many_arguments -D warnings
  pass_filenames: false
  files: \.(rs|toml)$

- id: cargo-deny
  name: cargo deny (licences, advisories, sources)
  language: system
  entry: cargo deny check
  pass_filenames: false
  files: (Cargo\.(toml|lock)|deny\.toml)$

# Force-pushing does not scrub GitHub history — PR refs pin every commit and are
# never collected — so a credential that lands in a repository means deleting and
# recreating it. Prevention is the only cheap point on that timeline.
- id: gitleaks
  name: Detect secrets and credentials
  language: system
  entry: gitleaks git --pre-commit --staged --verbose
  pass_filenames: false

# Prettier for markdown, JSON and YAML. cargo fmt covers Rust and buf format
# covers proto; this is everything else.
#
# `proseWrap: preserve` belongs in each repository's .prettierrc and is
# load-bearing: without it prettier reflows prose, and every future diff to a
# hand-wrapped document becomes unreadable. Measured before adopting — with it,
# 332 of 2276 lines change on the largest document here and NONE of them is
# prose.
- id: prettier
  name: prettier
  language: node
  # The version lives here, once, for every repository.
  additional_dependencies: ["prettier@3.9.6"]
  entry: prettier --write --ignore-unknown
  types_or: [markdown, json, yaml]
# WHEN TO WRAP A TOOL HERE, refined after getting it wrong once: the test is not
# whether upstream maintains its own hooks, it is HOW MANY REPOSITORIES USE THE
# TOOL. A directly referenced hook is a version pinned separately in every
# repository that references it, and that is where drift comes from.
#
#   many repositories  -> wrap here, so one version exists
#   exactly one        -> reference upstream directly, drift is impossible
#
# So prettier, hadolint and actionlint are wrapped (every repository, ~61, and
# every repository respectively), while buf is NOT: only `proto` carries a .proto
# contract, so bufbuild's own maintained hooks are referenced there and there is
# nothing to drift against. Wrapping buf would add a version to maintain and buy
# nothing.

# Containerfiles (podman's native name; pre-commit's identify tags them as
# dockerfile, so this hook matches them unchanged — verified empirically).
# hadolint publishes its own hooks, but it is wrapped here anyway
# — see the note below on when that is right.
- id: hadolint
  name: hadolint
  language: system
  types: [dockerfile]
  entry: hadolint

# EVERY repository here has workflows, and until this entry existed none of them
# was linted. The hook was declared in yadgarhq/actions' own local config alone,
# while the shared `precommit` job installed actionlint unconditionally in all
# sixteen — so fifteen repositories paid for a binary that nothing then ran.
# Publishing it is what makes that install mean something (ledger 620).
#
# NO SKIP ON THE ENTRY, and that is a deliberate reversal of the local hook this
# one replaces. That hook wrapped actionlint in `if command -v actionlint; then
# ... else echo ...; fi`, so an absent binary printed a note and exited 0. The
# argument for the skip was that a contributor without the binary should still be
# able to commit, and it was a reasonable argument for a hook covering ONE
# repository whose CI enforcement had been checked line by line.
#
# PUBLICATION CHANGES THAT ARGUMENT rather than refuting it. A named check that
# sixteen repositories reference has to mean one thing, and "Passed, having
# checked nothing" is the defect being closed here, not a convenience to carry
# forward. Every other system hook in this file — cargo-fmt, cargo-clippy,
# cargo-deny, gitleaks, hadolint, helm-lint — is a bare entry that fails with
# "Executable `X` not found" when the tool is absent. THIS ONE IS A SCRIPT, for
# the reason the paragraph below gives, and it prints that same sentence
# verbatim for an absent actionlint — so the missing-binary direction reads
# exactly as it did while this entry was bare.
#
# actionlint publishes its own hooks. It is wrapped here anyway, for the reason
# the note above gives: sixteen repositories use it, so a direct reference would
# be sixteen separately pinned versions.
# ONE UNENFORCED DEPENDENCY, now enforced. actionlint pipes every `run:` block
# to shellcheck and SILENTLY DISABLES that whole rule class when the binary is
# absent — measured: a workflow whose only defect is SC2086 exits 0 and prints
# nothing, and the skip is visible only under `-verbose` as
# `Rule "shellcheck" was disabled`. No flag makes it fatal; an explicit
# `-shellcheck=/nonexistent/shellcheck` is ignored just as quietly.
#
# WHERE THE GAP IS, checked rather than assumed. CI is covered: `ubuntu-latest`
# is Ubuntu 24.04, whose runner image ships shellcheck 0.9.0-1 as an apt
# package. The developer's machine is the uncovered side, and there
# `actionlint...Passed` meant either "the workflows are clean" or "the workflows
# are clean apart from a rule class nobody ran".
#
# So this entry refuses when that rule class would be skipped. It is the same
# decision the paragraphs above record about actionlint's own absence, one level
# down: a named check that sixteen repositories reference has to mean one thing.
# The script asks actionlint for a FINDING rather than probing $PATH: it feeds a
# stub whose only defect is SC2086 and requires SC2086 back. Probing $PATH is
# wrong because nixpkgs wraps actionlint with shellcheck on an internal PATH, so
# the probe would fail for the developers who do have the tool. Matching
# actionlint's own skip message was the first attempt and is fail-OPEN — any
# rewording of it silently restores "Passed, having checked nothing". Requiring
# the finding fails CLOSED instead. See hooks/actionlint.sh.
#
# `pyflakes` HAS THE IDENTICAL DEFECT and is deliberately not guarded here. The
# polarity is inverted: the runner image ships shellcheck but no pyflakes, while
# the nixpkgs wrapper supplies both, so python `run:` blocks are checked locally
# and skipped in CI. Exposure is zero today — no `shell: python` exists anywhere
# in the estate — so this is a note for whoever adds the first one, not a guard.
#
# SHELLCHECK IS NOT ADDED TO THE SHARED `precommit` JOB, deliberately. That job
# installs what the runner lacks, and the runner does not lack this. The image
# ships 0.9.0 while a nixpkgs developer carries 0.11.0, so CI is the LOOSER
# checker today and a local run catches strictly more. Pinning CI to the newer
# one inverts that and manufactures the developer-green/CI-red loop these hooks
# exist to shorten; pinning it to 0.9.0 is deliberately stale. If a future
# runner image drops the package, this entry fails loudly in CI rather than
# quietly narrowing — which is the whole point of the refusal.
- id: actionlint
  name: actionlint
  language: script
  entry: hooks/actionlint.sh
  pass_filenames: false
  files: ^\.github/workflows/.*\.ya?ml$

# A Helm chart is a Go template that HAPPENS to look like YAML, so check-yaml and
# prettier cannot read it and every chart repo excludes chart/templates from them.
# This hook is what makes that exclusion honest rather than a hole.
#
# It lives HERE, as a hook, rather than only as a CI job — because a check that
# runs in CI and not locally is the same "two definitions of clean" that the SKIP
# list was deleted for. The CI precommit job runs every hook with no SKIP list, so
# putting it here runs it in both places from one definition.
#
# `helm template` as well as `helm lint`: lint checks the chart's structure,
# rendering catches a template that parses and then produces invalid Kubernetes
# YAML. They fail on different things.
#
# `--strict`, BECAUSE WITHOUT IT THIS HOOK REPORTS A DEFECT AND PASSES IT. helm
# grades findings, and an invalid Kubernetes object name is graded `[WARNING]`
# rather than `[ERROR]`: a chart rendering `metadata.name: Iam_Bad` prints the
# full `metadata.name: Invalid value` complaint, then "0 chart(s) failed", then
# exits 0. `helm template` does not catch it either, because the template is
# perfectly valid Go and the YAML it produces is perfectly valid YAML — it is
# only invalid to the API server. So the chart passed here and failed at Argo
# sync, which is the far end of the loop this hook exists to shorten.
#
# `--strict` promotes warnings to failures, and that is the whole change: the
# same run now exits 1. `[INFO]` findings are NOT promoted, which is why the
# estate's seven charts stay green — every one of them reports
# `[INFO] icon is recommended` and nothing above it.
- id: helm-lint
  name: helm lint and render
  language: system
  entry: bash -c 'helm lint --strict chart && helm template ci-render chart > /dev/null'
  pass_filenames: false
  files: ^chart/

# D59 deferred this hook because the thing it checks did not exist yet. It does
# now: yadgar-telemetry's observe::Call.
#
# A handler either opens a Call or it does not — a grep, not a judgement. What it
# deliberately does NOT check is whether the outcome, class or row count are
# right; a hook cannot know that, and pretending to would be the "two definitions
# of clean" failure this project keeps refusing.
#
# The failure it prevents is silent: a module that quietly stops emitting looks
# exactly like a module nobody called, which is the reading that would break D15.
#
# BOTH TRANSPORTS. gRPC handlers come from the tonic server trait, which hands
# over a closed named set. HTTP has no such trait, so for a while this hook found
# ZERO handlers in `gateway` and checked nothing in the one service that can
# measure what D67 exists for — bytes and words returned TO THE CALLER. On the
# HTTP side the unit is finer than the function: a router registration says which
# functions to read, and each bounded-label arm of a method dispatch inside one is
# a handler. A catch-all arm is not, because its label would be the caller's own
# string and D67 forbids a caller minting a Prometheus series.
#
# THE UNIT OF ANALYSIS IS THE CRATE, NOT THE FILE (ledger 824). File-local
# resolution COLLIDED with the `complexity` ceiling above: a repository forced to
# split a large file then failed this check, and no split satisfied both. Measured
# twice on 2026-09-10 — `iam`, whose handlers had to delegate to `_inner` methods
# in sibling modules because a trait impl cannot span files, and `gateway`, whose
# `.route(...)` registrations stayed in `src/http.rs` when six handler bodies
# moved out. Both shipped a workaround; the next repository to cross the ceiling
# would have met the same wall. So a callee, a route handler and a label constant
# are resolved across every module of the crate the file belongs to.
#
# IT REFUSES TO GUESS, which is what keeps that a fix rather than a loosening. A
# name the crate defines in two modules is not followed at all unless the call
# site names its module: passing a handler on the strength of an unrelated
# function's `Call::start` would be a green that means nothing. Test sources are
# out of the INDEX for the same reason, inline `#[cfg(test)]` blocks included.
#
# An omission that is deliberate is written above the arm or the function, with a
# reason: `// observe-coverage: exempt — why`. In the code, so it is in the diff.
# Both transports accept it now; the gRPC side used to have no way to say it.
# `language: script`, NOT python. `language: python` makes pre-commit try to pip
# install THIS repository, which has no pyproject.toml and is not a package —
# the error is "Directory '.' is not installable", raised in the CONSUMING repo
# where nothing explains it. Same shape as the earlier language: node failure.
#
# script runs the file directly; it carries a shebang and the executable bit.
- id: observe-coverage
  name: every handler is instrumented
  language: script
  entry: hooks/observe_coverage.py
  files: \.rs$

# LEDGER 658. A mechanical ceiling on the size of a `run:` block, published so a
# repository that grows one can inherit the check rather than rediscover the
# failure. actionlint pipes every `run:` block to shellcheck and does not drain
# the pipe while it writes; above 8192 bytes the write never returns, actionlint
# hangs, and the job burns its whole timeout. The numbers are in the script.
#
# PUBLISHED BUT ADOPTED NOWHERE TODAY, and the measurement says so rather than a
# preference. Measured across all eighteen repositories 2026-09-06, the largest
# `run:` block outside this one is 303 bytes in `estate/smoke.yaml`; every other
# consumer is at zero, because a consumer's workflow is a caller. This
# repository's own `ci-pr.yaml` is at 7795 bytes against the 8000 limit. So the
# entry exists for the repository that first writes a real `run:` block, and
# adding the id to a consumer that has nothing to measure would be ceremony.
#
# `language: script`, NOT python — the reason the `complexity` entry above
# records: a python-language hook pip-installs this repository, and the failure
# surfaces in the consuming repo as an install error rather than a hook error.
# The script is stdlib-only and carries a shebang and the executable bit.
- id: run-block-size
  name: a run block must stay small enough to lint
  language: script
  entry: hooks/run_block_size.py
  files: ^\.github/workflows/.*\.ya?ml$

# LEDGER 648. The ADR-0569 gate, published. It was a 131-line shell script
# copied byte-identically into five repositories — gateway, iam, iam-db, task
# and task-db — each declaring it `repo: local`. Measured 2026-09-06: md5
# identical in all five. A copy is not a shared gate. The other SEVEN Rust
# repositories in the estate never had it, so the rule ADR-0574 says must be
# closed as a CLASS was in force in five repositories and absent in seven, and
# no repository created after those five would have inherited it.
#
# The sweep that publishing made possible found what the copies could not: real
# violations in `project-db`, `store` and `estate`, none of which carried the
# gate. That is the argument for publication in one line — five copies checked
# the five repositories that already passed.
#
# `always_run` with `pass_filenames: false`, because the subject is the whole
# source tree rather than the file somebody touched: a compiled-in default added
# to a file the commit does not name is exactly the case a filtered hook misses.
# The script asserts it actually searched something and prints the count, so a
# run that globs nothing refuses rather than passes.
#
# `language: script`, for the reason `observe-coverage` and `complexity` record:
# `language: python` makes pre-commit try to pip install this repository, which
# is not a package, and the error is raised in the CONSUMING repo where nothing
# explains it. Under `language: script` pre-commit runs the file from its own
# clone while the working directory stays the consumer's root, which is what
# lets the script's `src/`, `tests/` and `crates/*/src` walk see the consumer.
- id: no-compiled-in-defaults
  name: ADR-0569 — no compiled-in configuration default
  language: script
  entry: hooks/no_compiled_in_defaults.sh
  always_run: true
  pass_filenames: false

# LEDGER 720. The EKU wall — a cert-manager leaf names `server auth` XOR
# `client auth` — published so the rule stops being one repository's local hook.
#
# It replaces `yadgarhq/deploy`'s `repo: local` `scripts/check-certificate-usages.py`,
# and the reason is not tidiness. That hook was scoped `files: ^infra/.*\.yaml$`
# and to `issuerRef.name == "yadgar-internal-ca"`, and both scopings fail OPEN.
# Measured by running it on 2026-09-06: a Certificate naming BOTH directions
# under the internal CA passes when committed at the repository root, and passes
# inside `infra/` when the issuer is renamed. `--all-files` does not save it —
# `files:` filters that list too.
#
# ADOPTED IN `deploy` ALONE TODAY, and that is a measurement rather than a
# preference: `deploy` is the only repository in the estate that declares a
# `kind: Certificate` at all (all eighteen swept, 2026-09-06). Publication makes
# the check AVAILABLE rather than switching it on — ADR-0577 — so this entry
# exists for the repository that declares the next leaf, the same way
# `run-block-size` above waits for the first real `run:` block.
#
# `always_run` WITH `pass_filenames: false`, because the subject is every
# Certificate in the tree and not the file somebody touched. That is what closes
# the `files:` hole above, and it is the reason `no-compiled-in-defaults` below
# makes the same choice.
#
# THE SCRIPT ASSERTS IT INSPECTED SOMETHING and prints the count, twice over: a
# floor on the Certificates found, and a second floor on the ones the wall
# actually judged. The second exists because an issuer rename could once turn
# every leaf into an exemption, and a gate reporting success having judged
# nothing is the defect this estate has now measured four times in a week.
#
# `language: script`, NOT python — the reason `complexity`, `observe-coverage`
# and `no-compiled-in-defaults` all record: a python-language hook pip-installs
# this repository, which is not a package, and the error is raised in the
# CONSUMING repo where nothing explains it. That makes the script stdlib-only,
# so it carries a hand-written YAML scan; `scripts/tests/test_certificate_usages.py`
# asserts that scan extracts the same tuples as PyYAML over a corpus carrying
# both traps the real files contain.
- id: certificate-usages
  name: a leaf names exactly one direction (server auth XOR client auth)
  language: script
  entry: hooks/certificate_usages.py
  always_run: true
  pass_filenames: false

# LEDGER 726. THE OTHER DIRECTION OF THE WATCH SET. ADR-0523 makes a process
# exit when the material it read at boot is replaced underneath it, and every
# service's `tests/assembly.rs` asserts `rotate::watch_set` against a LITERAL
# path list. That test kills a member DELETED from the set and is blind to its
# opposite: a file newly read at boot with no watch-set member leaves the
# literal list matching, because the watch set did not change. The assembly test
# asserts the watch set against itself, never against what boot reads.
#
# THE CLASS IS ALREADY REALISED. `yadgarhq/iam` reads `encryption.key` and
# `blind-index.key` at boot and neither is in `iam::rotate::watch_set`. Every
# rotation test in that repository is green.
#
# NOT A SECOND LIST, and the direction of the default is the whole difference.
# A test naming the files boot reads fails exactly where the watch set does — an
# author who forgets the member forgets the list entry. Here an UNMARKED READ IS
# THE VIOLATION: forgetting is red, and the author cannot reach a passing state
# without saying at the read site which material carries the file, or that it is
# not carried and why. The marker is written in the same edit that adds the read.
#
# WHERE THE TWO SIDES COME FROM (ADR-0599). Side A is the call expression in the
# consumer's own `src/`; side B is `src/rotate.rs` — its `impl Material for T`
# blocks and the `watch_set` signature. A `WATCHED` marker must NAME one of them,
# so it cannot be satisfied by inventing a name at the read site, and neither
# side is computed from the other.
#
# `git grep ADR-0523-UNWATCHED` answers "which boot reads are unwatched, and
# why" in one command — the property `ADR-0569-EXCEPTION` is built for, applied
# to a rule that otherwise depends on being remembered.
#
# `always_run` WITH `pass_filenames: false`: the subject is every read in the
# tree, not the file somebody touched, and a `files:` filter would let a read
# added outside the touched set go unjudged. `certificate_usages.py` records the
# same choice after measuring the hole a `files:` scoping left open.
#
# `language: script`, NOT python, for the reason four hooks above already carry:
# `language: python` makes pre-commit pip-install this repository, which is not a
# package, and the failure surfaces in the CONSUMING repository where nothing
# explains it. Stdlib only, so the Rust scan is hand-written — and
# `scripts/tests/test_boot_reads_watched.py` asserts it against the two traps the
# real corpus carries: braces inside format strings moving a `#[cfg(test)]`
# module's end, and `yadgar-lifecycle`'s own `rotate::File::read`, which opens
# nothing and which every service's `src/rotate.rs` calls.
#
# ADOPTION IS PER REPOSITORY AND IS NOT AUTOMATIC. A consumer switching this on
# marks every read in its `src/` first; the gate refuses a repository with no
# `src/rotate.rs`, because there would be nothing for a marker to name. It sees
# only the CONSUMER's tree, so a read inside `yadgar-dial`, `yadgar-store` or
# `yadgar-lifecycle` is judged when that repository adopts the hook, not by the
# service that calls into it.
- id: boot-reads-watched
  name: ADR-0523 — a boot read is watched, or declared unwatched
  language: script
  entry: hooks/boot_reads_watched.py
  always_run: true
  pass_filenames: false

# LEDGER 837. The operator's words are the specification: "i need a hard check in
# the validation that prevents tests skips. agents usually do this to force a
# green test. no test bending is allowed", applied to all repositories.
#
# THIS IS THE MARKER LAYER, AND IT IS THE WEAKER OF THE TWO. It refuses a source
# marker or a narrowed invocation that removes a test from the run: `#[ignore]`
# with nothing running it, a cfg no build satisfies, an environment guard as a
# test's first statement, the pytest and unittest skip families, `addopts` and
# `collect_ignore` narrowing collection, a `--skip`/`-k`/`--deselect` filter on an
# invocation, and a test command whose exit code is suppressed. The STRONGER
# layer is the execution audit the same file carries under `--audit-cargo`, wired
# into `ci-pr.yaml`'s `test` job, which reads what actually ran. Neither replaces
# the other, and the reason is structural rather than a matter of thoroughness: a
# marker scan cannot see a test binary that stopped being built, and an audit
# cannot see a marker in a repository whose ignored suite is executed by a
# different workflow.
#
# THE EXEMPTION IS A FACT, NEVER A REASON STRING, and that is the whole design.
# The estate's two legitimate `#[ignore]` sites — `store/tests/engine_tls.rs` and
# `estate/crates/front/tests/`, thirteen tests between them — are legitimate
# BECAUSE SOMETHING RUNS THEM, so that is what the gate asks: does a workflow in
# this repository run this target with `--ignored`, or does the source name
# `YADGAR_TEST_TLS_DSN` in a repository that calls `ci-pr.yaml`, whose private-CA
# step selects a suite on exactly that name and refuses unless it measured
# something? Both predicates die in the same edit that stops the execution.
# Ledger 701 and ledger 729 are the precedent: key on the fact, never on a marker
# or on a consequence of it. There is no in-code exemption comment at all, so
# nothing here can reattach to unrelated code the way `observe-coverage`'s
# exemption walk does once its target is edited away (ledger 838).
#
# `always_run` WITH `pass_filenames: false`. An `#[ignore]`'s verdict depends on
# the WORKFLOWS beside it, not on the file somebody touched, so a hook filtered to
# the changed file would accept an ignored test the moment the step running it was
# deleted in a different commit. The `files:`-only trap is the same one the
# `pytest-scripts` and `no-compiled-in-defaults` entries record.
#
# `language: script`, NOT python — the reason five hooks above already carry:
# `language: python` makes pre-commit pip-install this repository, which is not a
# package, and the failure surfaces in the consuming repository where nothing
# explains it. Stdlib only.
#
# ADOPTION IS PER REPOSITORY AND IS NOT AUTOMATIC (ADR-0577, ADR-0607), and
# ADR-0584 forbids adopting a gate in a repository it hard-fails. That is the
# durable rule, and it carries no count on purpose.
#
# LEDGER 847 — THIS FILE MAY STATE FACTS ABOUT THE GATE, NEVER STANDING STATUS
# ABOUT REPOSITORIES IT DOES NOT CONTAIN. Two numbers sat in this block and only
# one rotted. "Thirteen `#[ignore]` tests between `store` and `estate`" is a
# property of the exemption logic above, re-measured as 3 + 10 on 2026-09-11 and
# still true. "Seventeen pass, and `docs` and `estate` each carry one real
# finding" was a claim about two OTHER repositories' current state, and it was
# false within a day of being written — `yadgarhq/docs` 0350052f and
# `yadgarhq/estate` 18471e34 both landed on 2026-09-10, hours after this file
# shipped. A reader was left believing two repositories were still blocked.
#
# WHAT REPLACES IT IS HISTORY PLUS A COMMAND, because the count cannot be
# derived. Answering "how many repositories pass today" needs `origin/main` of
# nineteen repositories, which is a network read no pre-commit hook and no
# offline test may perform, so nothing in this repository can assert it and a
# typed number will rot again. Re-measure instead:
#
#   git clone --depth 1 git@github.com:yadgarhq/<repo>.git <tree>
#   python3 hooks/no_test_skips.py --root <tree>
#
# Run that way across all nineteen unarchived repositories on 2026-09-11:
# NINETEEN PASS, zero findings, across 292 Rust files, 1546 test items and 13
# `#[ignore]` attributes. Read that as a dated observation, not as this file's
# standing claim about anybody's tree.
- id: no-test-skips
  name: ledger 837 — no test silently stops running
  language: script
  entry: hooks/no_test_skips.py
  always_run: true
  pass_filenames: false

# LEDGER 511, STAGE 5, SPLIT IN TWO BY LEDGER 911. `docs/plans/chart-hardening.md`
# asked whether ledger 511 is one shared chart decision or N local fixes. It priced
# a shared chart library — a new repository, a publish pipeline, a `dependencies:`
# stanza and a version bump per chart per change, against roughly twelve duplicated
# lines in six charts — and refused it: "a shared pre-commit gate, NOT a shared chart
# library". This is that gate. The library's worst cost was not the machinery but a
# THIRD clock on a delivery path that already lands a chart from the module repo at
# HEAD and an image by digest from `argocd/versions/`.
#
# FOUR FIELDS, ACROSS TWO HOOKS. `terminationGracePeriodSeconds`, a dedicated
# ServiceAccount with no API token, `topologySpreadConstraints`, and an ingress
# NetworkPolicy template. The same plan DECLINED `livenessProbe`, `startupProbe`,
# `preStop`, `strategy`, `minReadySeconds` and `affinity`, each on its own argument,
# so the field set is closed: a gate that checked one of the six would enforce a
# decision the plan refused. What ADR-0685 changed is not the field set but WHERE the
# four are asserted from — `chart-baseline` carries the first three and
# `chart-network-policy` the fourth, and a repository adopts each separately.
#
# WHY THE SPLIT (ADR-0685). Three of the four are properties of the chart's own pod
# spec. The fourth is a question about where a module's ingress policy LIVES, and for
# `yadgarhq/gateway` it legitimately does not live in the chart: that module's ingress
# source is the Envoy Gateway data plane in `envoy-gateway-system`, selected by
# `gateway.envoyproxy.io/*` labels, and a module chart validated against one ingress
# implementation is D80's first bullet. The policy therefore ships in
# `yadgarhq/deploy` as `infra/network-policies/gateway-ingress.yaml`. ADR-0584 forbids
# adopting a gate in a repository it hard-fails, so before the split `gateway` could
# adopt NONE of this gate: one correct assertion was costing it the other three.
# ADR-0685's rule — "where a module's policy legitimately lives outside its chart,
# that module does not forfeit the remaining assertions of a gate that also checks for
# the policy. Such a gate is SPLIT along the boundary of where its subjects live, and
# each part is adopted per repository."
#
# NO EXEMPTION, AND THAT IS THE POINT. Keying one on an in-tree fact was considered
# and ADR-0685 rejects it by name: `kind: HTTPRoute` discriminates `gateway` from the
# other six today, but it encodes "ships an HTTPRoute" while the reason is "is
# edge-facing", so the next edge-facing module inherits the exemption with nothing
# red. No exemption is keyed on a fact that merely correlates with the reason. The
# split leaves nothing to exempt, which is why there is no marker, no allowlist and no
# reason string here — `no_test_skips.py` above states the rule both follow.
#
# ONE SCRIPT, TWO `entry:` LINES, and deliberately not two files. The chart walk, the
# three floors and the success line are one mechanism; the `pytest-scripts` entry in
# this repository's own config already passes arguments to a script hook. Two files
# would be two copies of the three floors — ADR-0569's gate lived as five
# md5-identical `repo: local` copies, and the argument for publishing this one at all
# is that a copied gate is drift waiting to happen. `--part` is REQUIRED with no
# default: a default would let a bare invocation mean one half without saying so,
# which is the inference ADR-0685 forbids.
#
# PARTIAL COVERAGE IS PRINTED, NOT INFERRED. ADR-0685: "a module can be partially
# covered, and partial coverage must be legible in the success line rather than
# inferred from which hooks a repository happens to reference." So each half prints,
# on the pass as well as on the failure, what it examined, what it did NOT, which hook
# covers the rest, and that it cannot see whether this repository references that
# hook. A green `chart-baseline` meant four fields before the split and three after
# it; without that sentence the line changes meaning in silence. `verbose: true` is
# on both entries for the same reason — pre-commit shows a passing hook's output only
# when asked, and a legibility line nobody sees is not one.
#
# THE RULE, NEVER THE LITERAL. All seven module charts ship
# `terminationGracePeriodSeconds: 35` and the plan still recommends 30 — the plan is
# stale on this point and ADR-0601 is not. The gate asserts
# `grace >= DRAIN_BUDGET + EXIT_MARGIN + the preStop sleep` = 25 + 5 + 5, which
# derives 35 rather than copying it, and ADR-0602 names the only direction that
# breaks the bound: a chart going UNDER. Pinning 35 would redden the first chart
# that legitimately lengthens its sleep; a flat `>= 30` would pass a 32s grace
# behind a 5s sleep, leaving 27s for a 25s drain plus a 5s exit.
#
# THE SLEEP TERM IS FOUND BY POSITION (ledger 911). It used to be an unqualified
# `seconds:` anywhere in the deployment template, and `SleepAction` is equally valid
# under `postStart`. Measured on `yadgarhq/iam`'s chart at `origin/main` with a
# `postStart` sleep of 20 beside its own 5s `preStop`, v1.21.1 reports
# "`terminationGracePeriodSeconds: 35` is below the floor of 50s (25 DRAIN_BUDGET +
# 5 exit margin + 20 preStop sleep)" — a false refusal naming a number no `preStop`
# in that chart sets. The same lookup pointed the other way too: with the `preStop`
# an `exec` handler, whose duration a chart cannot state, a `postStart` sleep
# SATISFIED the refusal and was priced as the drain sleep, so that chart passed at
# exit 0. Both are closed by scoping the key to the `preStop` block.
#
# `chart-baseline` READS TWO FILES PER CHART, and that is forced rather than chosen.
# No module template contains `35` or `ScheduleAnyway` — every value arrives through
# `.Values.*` — so the template carries the KEY, `values.yaml` carries the NUMBER,
# and an assertion against either alone is fail-open. A chart can keep every
# `topologySpreadConstraints` line and render none of them by flipping
# `topologySpread.enabled: false`. `chart-network-policy` reads NEITHER: it reads
# `kind:` lines and nothing else, which is not a shortcut but a fail-open closed —
# sharing the deployment half's path would have let an unbalanced Go template
# early-return before the policy assertion ran, reporting a chart judged with nothing
# asserted about its policy.
#
# THE TWO `enabled` KEYS ARE NOT ONE RULE. `topologySpread.enabled` must be true:
# a spread constraint needs no CRD and installs on a bare cluster, so D80's
# fail-closed arm does not reach it. `networkPolicy.enabled` may be false, and in
# all six charts that have a policy it IS false: a module chart must stay
# installable on a bare cluster, so switching the policy on is the reference
# deployment's business. `chart-network-policy` therefore demands the TEMPLATE,
# never that the policy is enabled — demanding `true` would refuse the design D80
# chose.
#
# THREE WAYS TO GO BLIND, AND EACH HALF CLEARS ITS OWN FLOORS. A tree with nothing to
# judge is RED. The chart floor catches the walk finding nothing — a `chart/` to
# `charts/` rename. The assertions floor catches every chart turning into something
# the gate does not judge AT ONCE: the chart count holds while the assertions drop to
# zero. Neither catches SOME charts judged and others not in the same tree, where the
# judged ones keep the total above the floor — so every chart's `judged` flag is
# checked against the chart count directly. Ledger 715's `MINIMUM_SITES=2` is the
# precedent and `certificate_usages.py` carries the first pair. Splitting a gate
# MULTIPLIES this risk rather than moving it: a half able to report success having
# examined nothing reintroduces ledger 715's class on whichever side is weaker. So
# all three are evaluated per part against that part's own numbers, every count is in
# that part's own success line, and `scripts/tests/test_chart_baseline.py` fires each
# of the three in BOTH halves.
#
# `language: script` AND STDLIB ONLY, the reason eight hooks above already carry: a
# `language: python` hook pip-installs this repository, which is not a package, and
# the failure surfaces in the CONSUMING repo where nothing explains it. So the YAML
# scan is hand-written, and `scripts/tests/test_chart_baseline.py` asserts it against
# PyYAML over a corpus carrying the traps the real files hold — including
# `- maxSkew: {{ .Values.topologySpread.maxSkew }}`, a key on a sequence item that
# this gate's own first revision skipped, reporting "sets no maxSkew" against all
# seven correct charts.
#
# `always_run` WITH `pass_filenames: false` on both: the subject is every chart in
# the tree, not the file somebody touched. A `files: ^chart/` filter would leave a
# chart moved elsewhere unjudged, which is the hole `certificate_usages.py` measured
# when its own `files:` scoping let a Certificate at the repository root pass.
#
# NEITHER IS ADDED TO THIS REPOSITORY'S OWN `.pre-commit-config.yaml`, unlike the
# actionlint, prettier and no-test-skips entries. `yadgarhq/actions` holds no chart,
# and both halves REFUSE a tree with no `Chart.yaml` rather than passing it — the way
# `boot_reads_watched.py` refuses a repository with no `src/rotate.rs`, because a
# green tick must not mean "examined nothing". So what gates this file on every commit
# is `pytest-scripts`, not the hooks themselves, and the pull request that publishes
# them says so rather than claiming CI exercised them.
#
# ADOPTION IS PER REPOSITORY AND IS NOT AUTOMATIC (ADR-0577, ADR-0607), and it is now
# per HALF as well. A library repository with no chart — `dial`, `lifecycle` —
# references neither. Re-measure rather than trusting a typed count (ledger 847):
#
#   git clone --depth 1 git@github.com:yadgarhq/<repo>.git <tree>
#   python3 hooks/chart_baseline.py --root <tree> --part chart-baseline --report
#   python3 hooks/chart_baseline.py --root <tree> --part chart-network-policy --report
#
# Run that way across the seven module repositories on 2026-09-14, at `origin/main`:
# `chart-baseline` passes ALL SEVEN at 29 assertions each, and `chart-network-policy`
# passes six at 1 assertion and refuses `yadgarhq/gateway`, whose policy is the
# `deploy` file named above. 29 + 1 = 30 is what the single gate evaluated per chart
# before the split, on every one of the seven, which is the measurement that says the
# fourth assertion MOVED rather than being dropped (ADR-0645). Read these as dated
# observations, not as this file's standing claim about anybody's tree. Publication is
# not adoption, so ADR-0584 is satisfied by this file regardless of either count.
- id: chart-baseline
  name: ledger 511 — a module chart carries the three deployment baseline fields
  language: script
  entry: hooks/chart_baseline.py --part chart-baseline
  always_run: true
  pass_filenames: false
  verbose: true

# THE OTHER HALF. Published side by side rather than folded into the entry above, so a
# repository whose ingress policy legitimately lives elsewhere references one and not
# the other — and so that choice is a line in its own `.pre-commit-config.yaml` rather
# than an exemption inside this gate.
- id: chart-network-policy
  name: ledger 511 — a module chart ships its own ingress NetworkPolicy template
  language: script
  entry: hooks/chart_baseline.py --part chart-network-policy
  always_run: true
  pass_filenames: false
  verbose: true
