# Cutting a release. The stage order is forced by D61, not chosen: the chart
# pins the image by DIGEST, so the digest must exist before the chart can be
# packaged. Build, push, capture digest, package chart against it, push, sign.
name: ci-release

on:
  workflow_call:
    inputs:
      version:
        description: >-
          The release version. A git tag name is fine: a leading `v` is stripped
          here so every caller can pass `github.ref_name` unchanged.
        type: string
        required: true
    # BOTH OPTIONAL, and that is what keeps the `deployment` job below INERT.
    # A reusable workflow cannot see a caller's secrets unless the caller passes
    # them, so a repository that has not been wired up hands over two empty
    # strings, the job notices and reports, and the release is exactly what it
    # was before. Same shape `ci-pr.yaml` uses for the release tag, and the same
    # reason: this ships into every repository before the thing behind it exists.
    #
    # The App is the one ADR-0527 already mints per run for the tag. It is not a
    # second credential and there is no new key to hold — what is new is the
    # `repositories:` it is scoped to when the token is minted.
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  packages: write
  # Signing uses the workflow's own OIDC identity, so there is no key material
  # to hold or rotate (D61).
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.d.outputs.image }}
      chart: ${{ steps.d.outputs.chart }}
      # Normalised ONCE, here, and read by every later job. Callers pass
      # `github.ref_name`, which for the tag `v0.1.0` is `v0.1.0` — but a chart
      # version and an image tag must both be bare SemVer, and D64 derives the
      # number from the changelog with no `v` anywhere in it. Stripping in the
      # callers instead would mean the same expression copied into ~61 repos,
      # and GitHub expressions have no suffix-strip: `replace(x, 'v', '')` is
      # the only inline option and it eats the `v` in `preview` too.
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "## Release ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          for pair in "image:Containerfile" "chart:chart"; do
            k=${pair%%:*}; f=${pair#*:}
            if [ -e "$f" ]; then
              echo "$k=true" >> "$GITHUB_OUTPUT"
              echo "- **$k**: \`$f\` present → publishing" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$k=false" >> "$GITHUB_OUTPUT"
              echo "- $k: no \`$f\` → nothing to publish" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  image:
    needs: detect
    if: needs.detect.outputs.image == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Containerfile is podman's native name and is understood by buildkit
          # too, but buildkit defaults to Dockerfile, so it has to be named.
          # This project builds with podman locally; using two names for one
          # file to satisfy two builders would be the drift, not the fix.
          file: Containerfile
          push: true
          # THE BUILD IS TOLD ITS VERSION RATHER THAN LEFT TO DERIVE ONE, and
          # this is the only place in the estate that knows the answer without
          # guessing: `detect` normalised the tag once, and the image tag, the
          # chart version and this argument are now the same string.
          #
          # It is passed BARE — `0.9.0`, not `v0.9.0` — because that is what
          # `needs.detect.outputs.version` holds after the strip at the top of
          # this file, and a consumer that wants the `v` back cannot get it from
          # a value that never had one. A Containerfile may strip a leading `v`
          # anyway for the local case; nothing here relies on that.
          #
          # WHY IT IS UNCONDITIONAL, for a workflow shared by ~61 repositories
          # of which most declare no `VERSION` at all: an undeclared build
          # argument is accepted and ignored by buildkit — verified against
          # `moby/buildkit` directly, exit 0, no warning — so this costs the
          # repositories that do not want it nothing. Making it conditional
          # would mean a new input every caller has to set, which is the
          # ~61-copies shape D19 exists to prevent.
          #
          # A Containerfile that declares `ARG VERSION` AFTER an expensive
          # cached layer keeps that layer cached when this value changes; that
          # is dockerfile semantics rather than a hope, and it was confirmed the
          # same way — a pre-`ARG` step reported CACHED across two builds with
          # different values. So a release does not rebuild a dependency graph
          # to learn its own number.
          build-args: |
            VERSION=${{ needs.detect.outputs.version }}
          # Images at the top level; charts under charts/. They share a
          # namespace and would otherwise collide — `helm push` would claim
          # exactly the path the image wants (D61).
          # TWO tags, and the moving one is required rather than a convenience.
          #
          # D65 splits them deliberately: the chart in GIT points at a moving tag
          # so a development cluster picks up releases without a commit, while
          # the PUBLISHED chart pins a digest for reproducibility. Publishing only
          # the version tag left the git half pointing at an image that does not
          # exist — every Argo-deployed pod sat in ImagePullBackOff, and the
          # release itself looked entirely successful.
          #
          # Found when the D54 ApplicationSet first deployed anything.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.detect.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # THE DIGEST IS ASSERTED ONCE, HERE, AND NOWHERE ELSE. Five things read it
      # and not one of them checked it: the trivy scan below, the SBOM, the
      # cosign signature, the `yq` rewrite of `chart/values.yaml` in the `chart`
      # job, and the `versions/<module>.yaml` write in the `deployment` job. The
      # first three build a reference ending in `@` and fail on a malformed ref,
      # which is luck rather than a check. The last two fail SILENTLY, and that
      # is what this step is for: an empty digest publishes a chart carrying
      # `image.digest: ""` and NO TAG AT ALL, because the same `yq` expression
      # deletes `image.tag`; and it pins the module to `:<version>`, a GHCR tag
      # this file's own comment further down admits is mutable.
      #
      # AT THE PRODUCER RATHER THAN AT EACH CONSUMER. A guard in `deployment`
      # protects one of those five writes. Here it protects all five, and the
      # gating already carries the failure downstream: `chart` runs on
      # `needs.image.result != 'failure'` and `deployment` on `== 'success'`, so
      # a red guard skips both writes rather than letting them run on a value
      # nobody vouched for. The sixth consumer, whenever it arrives, gets the
      # guarantee without having to remember to ask for it.
      #
      # THE SHAPE IS NOT INVENTED HERE. `^sha256:[0-9a-f]{64}$` is what
      # `scripts/versions_pinned.py` in `yadgarhq/argocd` enforces on the value
      # this workflow writes there, so matching it turns a pod that will never
      # pull into a build that will not pass.
      #
      # TESTED AS A VARIABLE, NEVER AS A PIPELINE. The `if ! cmd | grep -q ...`
      # shape collapses a tool error, an absent tool and a genuine mismatch into
      # one branch, which is a check that cannot fail — this estate has already
      # shipped one. `set -euo pipefail` and a test of the captured value keep
      # the three apart.
      - name: the push must have reported a digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Image digest \`$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### The image push reported no usable digest"
            echo ""
            echo "\`docker/build-push-action\` returned \`${DIGEST:-(empty)}\`, which"
            echo "is not \`sha256:\` followed by 64 lowercase hex characters."
            echo ""
            echo "Nothing downstream would have said so. The published chart would"
            echo "carry \`image.digest: \"\"\` and no \`image.tag\` at all, and"
            echo "\`versions/<module>.yaml\` would pin \`:<version>\` — a GHCR tag that"
            echo "any re-run of this job overwrites. Both look like a successful"
            echo "release."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The image push reported no usable digest. See the job summary."
          exit 1

      # Scan the ARTIFACT, not the source tree. ci-validation scans the
      # filesystem before anything is built; this is the thing an adopter
      # actually runs, including whatever the base image contributed.
      #
      # ignore-unfixed: an unfixable CVE in a base is not something this build
      # can act on, and a gate nobody can satisfy gets disabled rather than
      # fixed. The weekly base rebuild is what picks up fixes when they land.
      - name: scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # D63: lean and secure are measured, not asserted. A claim about an
      # image's contents that nothing verifies is a claim about the
      # Containerfile.
      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: "${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          upload-artifact: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        env:
          # Through env, never interpolated into the script. zizmor's
          # template-injection audit is right even where the value looks
          # trustworthy: the habit is what protects the one case that is not.
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"

      # A published package is PRIVATE by default, even from a public
      # repository, and there is no API to change that — visibility lives on the
      # package's own settings page and nowhere else. Publishing therefore
      # succeeds, this workflow goes green, and only an adopter discovers the
      # problem, as `unauthorized` rendered by most clients as "not found".
      #
      # So the workflow checks what an adopter experiences rather than what it
      # just did. Same instinct as the detection step narrating what it skipped:
      # a silent wrong state is worse than a red build.
      - name: verify an adopter can actually pull this
        env:
          REF: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.detect.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "Anonymous pull of $REF works." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Published, but NOT publicly pullable"
            echo ""
            echo "\`$REF\` was pushed and signed, but an anonymous pull is refused."
            echo "A new GitHub package is private by default and **no API can change it** —"
            echo "it is a one-time manual step per package:"
            echo ""
            echo "  https://github.com/orgs/${OWNER}/packages/container/$(basename "$REPO")/settings"
            echo ""
            echo "Danger Zone -> Change visibility -> Public."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Package is not publicly pullable. See the job summary."
          exit 1

  chart:
    needs: [detect, image]
    # always(): a repository may ship a chart and no image. Without this the
    # chart would be skipped whenever the image job did not run.
    if: always() && needs.detect.outputs.chart == 'true' && needs.image.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # THE SAME TWO PINS `ci-pr.yaml` USES — the action's SHA and the helm
      # version — and this is the call site where the version matters MOST. The
      # two in `ci-pr.yaml` decide whether a check passes; this one packages the
      # artefact an operator installs, so an unpinned helm here means the
      # published chart was built by whichever major the network answered with.
      # v3.18.4 is what Argo CD v3.1.8 bundles and therefore what renders these
      # charts in the cluster, so packaging with it keeps the producer and the
      # consumer the same program. The full reasoning is above the `precommit`
      # copy in `ci-pr.yaml`; when Argo's bundled helm changes, all three follow.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      # D65: the chart IN GIT points at a moving tag, because our own cluster
      # deploys it from git at HEAD and development follows HEAD by design. The
      # PUBLISHED chart pins a digest, because a release must name exactly what
      # runs (D61).
      #
      # This rewrite happens in the workspace and is NEVER committed. Committing
      # it would mean a bot pull request against a protected main for every
      # release, changing one line — noise that trains people to merge without
      # reading.
      #
      # A chart published without this step would ship a floating tag. The
      # release workflow is the only thing that publishes a chart, which is what
      # keeps that from happening.
      - name: pin the image by digest, for the published chart only
        if: needs.image.result == 'success'
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Publishing with image digest \`$DIGEST\` (git keeps its tag)." \
            >> "$GITHUB_STEP_SUMMARY"
          yq -i ".image.digest = \"$DIGEST\" | del(.image.tag)" chart/values.yaml
      - name: package and push
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package chart --version "$VERSION" --app-version "$VERSION"
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin
          helm push ./*-"$VERSION".tgz "oci://${REGISTRY}/${OWNER}/charts"

  # PUBLISHING AN IMAGE DID NOT ROLL A POD, and this job is the whole fix. Every
  # module Deployment renders `image: <repo>:latest` with `imagePullPolicy:
  # Always`, because a chart in git points at a moving tag (D65). `Always` is
  # evaluated when a container is CREATED and never itself causes one to be
  # created, so a release moved the tag and nothing restarted — with Argo CD
  # reporting Synced/Healthy throughout. Measured 2026-09-03: FOUR of the five
  # deployed services were behind for a full day, `task-db` by four releases, and
  # `kubectl rollout restart` by hand was the only thing that ever deployed them.
  # The fifth was current only because an unrelated pod-spec change had restarted
  # it, which is the same accident by another name.
  #
  # Writing the released version into the deployment repository changes the pod
  # template, and a changed pod template is what makes a rollout happen.
  #
  # D55 IS NOT NARROWED BY THIS. The chart still comes from the module
  # repository at HEAD — the ApplicationSet's source is still `repoURL: {{
  # .url }}`, `targetRevision: {{ .branch }}`, `path: chart` — so a chart change
  # still reaches the cluster with no release at all. Only the image tag is
  # pinned. What changes is that a RELEASE now deploys, which is faster than the
  # never it managed before.
  #
  # THIS IS INERT AS SHIPPED and needs two things done by hand, IN THIS ORDER:
  #
  #   1. the release App added to the `main` ruleset bypass in `yadgarhq/argocd`,
  #      so this write lands as a direct push and no pull request is created;
  #   2. each module's own `ci.yaml` release job passing the two secrets below,
  #      the way its `main` job already passes them to `ci-pr.yaml`.
  #
  # In the other order every release turns red on a ruleset that refuses the
  # push. ADR-0527 shipped into 13 repositories the same way, dark until the
  # credential arrived.
  #
  # NOT A CONTRADICTION OF D66, which rejected "dispatch from each module on
  # release" for `chart` — and rejected it on the ground that ~61 repositories
  # would each need a credential with write access to another repository, to
  # hold, rotate and audit. ADR-0527 replaced those with ONE org-owned App
  # minting a short-lived token per run, so that objection has nothing left to
  # bite on. Polling, D66's answer, is also not available here: it is the
  # release that must deploy, not a schedule that eventually notices.
  #
  # NOT A REVIEW MANUFACTURED, which is ADR-0531's test. With the bypass in
  # place the write is a direct push and there is no pull request whose approval
  # would be a formality. It is precisely the third case that ADR's
  # `revisit_trigger` anticipated — a write that reaches a protected branch
  # WITHOUT a pull request — so it satisfies the cause the two stated cases were
  # drawn from while falling outside their letter.
  deployment:
    needs: [detect, image]
    # A repository with no `chart/` is not deployed by the ApplicationSet at all
    # — its filter is `pathsExist: [chart]` — so there would be nothing to point
    # at. A repository that has a chart but not the `yadgar-deployable` topic
    # gets a file nothing reads, which is residue rather than a fault; detecting
    # the topic would cost an API call to prevent an unused file.
    if: needs.detect.outputs.chart == 'true' && needs.image.result == 'success'
    runs-on: ubuntu-latest
    # A BOUND, BECAUSE THIS JOB RUNS PAST THE POINT OF NO RETURN. No job in this
    # file sets one, so every job here inherits GitHub's 360-minute default.
    # That is merely wasteful for a job that can be re-run freely, and it is not
    # tolerable for this one: by the time these steps run the tag is cut, the
    # image is pushed and `:latest` has moved, and the steps below make roughly
    # fourteen `gh api` calls, one of which polls. A wedged read would hold a
    # runner for six hours on a release that already shipped.
    #
    # TEN, and the arithmetic is the argument rather than a round number. The
    # worst path here is the three argocd write attempts with their 5s and 10s
    # backoff, then the estate poll at 150s, plus two token mints and the reads
    # between them — under four minutes. Ten leaves more than twice that as
    # headroom, so raising the poll window again does not quietly arrive at the
    # ceiling, while still cutting a hung job short by a factor of thirty-six.
    timeout-minutes: 10
    steps:
      # THE OFF SWITCH, and it has to be a step output rather than a condition on
      # the secret: the `secrets` context is not available in a step-level `if:`.
      - name: is the release App configured here
        id: cred
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # BOTH OR NEITHER. An id without a key fails inside the minting action
          # instead of here, which is a red job in place of a skipped step.
          if [ -n "$CLIENT_ID" ] && [ -n "$APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "_No release App is configured here, so \`yadgarhq/argocd\`"
              echo "was not told about this version and no pod will roll, and"
              echo "\`yadgarhq/estate\` was not asked for a verdict on it. See the"
              echo "\`deployment\` job in \`yadgarhq/actions\`._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # SCOPED TO `argocd`, and both narrowings carry weight. With neither
      # `owner:` nor `repositories:` the action scopes the token to the CURRENT
      # repository — the one place this token must never be able to write. And
      # `repositories:` alone does nothing: the action's own documentation makes
      # it conditional on `owner`, so the two travel together or the default
      # quietly stands.
      #
      # `permission-contents: write` rather than whatever the installation holds,
      # for the reason `ci-pr.yaml` gives: zizmor's `github-app` audit fails the
      # blanket form, and a later grant to this App would otherwise be picked up
      # by this token silently.
      - name: mint a token that can write to argocd and nowhere else
        id: app
        if: steps.cred.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: argocd
          permission-contents: write

      # ONE FILE PER MODULE, NAMED AFTER THE MODULE, and never a map of modules.
      # D54's generator enumerates repositories rather than listing them, so a
      # per-module value has nowhere to live in the ApplicationSet without
      # reintroducing the central list D54 exists to delete. A file whose PATH is
      # templated from the generator is not a list: nothing enumerates it, a file
      # exists because a module released, and a module that never releases is a
      # file that never appears.
      #
      # BOTH THE DIGEST AND THE TAG, AND THE DIGEST IS WHAT GOVERNS. A module
      # chart's template reads `image.digest` in preference to `image.tag`, so
      # the pull is by digest — the estate's "pin by digest, SHA or revision"
      # invariant — while the tag stays in the file for a person to read.
      #
      # THE TAG ALONE WOULD NOT DO, and the distinction it rests on is worth
      # keeping straight. A GIT tag here is immutable: the `release-tags` ruleset
      # forbids `deletion`, `update` and non-fast-forward. A GHCR IMAGE tag is
      # NOT. Re-running the `image` job on an existing git tag rebuilds and
      # overwrites `:<version>`, so a values file naming only the version can
      # come to mean a different image without the file changing.
      #
      # ROLLING BACK IS AN EDIT, NEVER A DELETE. Deleting the file returns the
      # module to `image.tag: latest` from the chart, and `latest` was moved to
      # THIS release by the `image` job above — so a delete rolls the pod a
      # second time onto the very build being rolled back from. To roll back,
      # set both keys to the previous release's values; `:<previous>` is still
      # in the registry, because only `latest` moves.
      #
      # AND THE HEADER WRITTEN BELOW NOW SAYS SO. It used to end "Deleting this
      # file returns the module to the moving tag, which now points at THIS
      # release" — a description of the damage that reads as a documented way
      # out. `yadgarhq/argocd` REFUSES that deletion now (`ci / passed`,
      # `scripts/versions_pinned.py`, ledger 608) and its five existing files
      # were corrected by hand; but this generator rewrites the header on every
      # release, so the old invitation would have come back one module at a
      # time. The replacement is lifted from those files and from the script's
      # own failure message rather than phrased a third way, and it adds the
      # retirement shape that script had to work out: a module leaves the
      # cluster by losing its `yadgar-deployable` topic or its `chart/`, after
      # which nothing reads the file and leaving it costs nothing.
      #
      # THE FAILURE IS RED, NOT SILENT, and that is this workflow's own instinct
      # rather than a new one: the "verify an adopter can actually pull this"
      # step above already fails the job after a successful push, for a condition
      # only a human can clear. Swallowing this one would leave the estate
      # exactly where it started — a published image that never reaches a pod,
      # with every check green.
      - name: tell argocd which version to run
        if: steps.cred.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          module="${REPO#*/}"
          api="repos/${OWNER}/argocd/contents/versions/${module}.yaml"
          file="$RUNNER_TEMP/version.yaml"
          # NO BACKTICKS IN THE STRINGS BELOW, and that is not a style choice.
          # A backtick inside a single-quoted string reads to SC2016 as a command
          # substitution somebody meant to expand. actionlint pipes every run
          # block through shellcheck, so the five markdown backticks that used to
          # be here failed the workflow lint — found on the day the actionlint
          # hook first became able to fail at all. The text lands in a YAML
          # comment that nothing renders as markdown, so the emphasis bought
          # nothing and the plain words read the same.
          #
          # NOR MAY A LINE HERE OPEN WITH THE WORD shellcheck. A comment of that
          # shape is parsed as a shellcheck DIRECTIVE, and an unparseable one is
          # SC1072/SC1073 — an error, not an info. The first draft of this very
          # note tripped it.
          {
            printf '# Written by ci-release in %s. Do not edit by hand.\n' "$REPO"
            printf '# The digest governs the pull; the tag is here to be read.\n'
            printf '# To roll back, set BOTH keys to the previous release.\n'
            printf '# DO NOT DELETE THIS FILE. Deleting it hands helm no values,\n'
            printf '# so the module falls back to the moving tag with nothing\n'
            printf '# reporting it — ci / passed refuses the deletion (ledger\n'
            printf '# 608, scripts/versions_pinned.py).\n'
            printf '# That is an EDIT of both keys and never a delete, because\n'
            printf '# :latest already points at the release being rolled back\n'
            printf '# from.\n'
            printf '# Retiring the module is not a reason to delete it either: a\n'
            printf '# module leaves the cluster by losing its yadgar-deployable\n'
            printf '# topic or its chart/, after which nothing reads this file\n'
            printf '# and leaving it costs nothing.\n'
            printf 'image:\n  digest: "%s"\n  tag: "%s"\n' "$DIGEST" "$VERSION"
          } > "$file"
          err="$RUNNER_TEMP/write_error.txt"
          # THREE ATTEMPTS, RE-READING THE BLOB SHA EACH TIME. The Contents API
          # refuses a write carrying a stale sha, and two modules releasing at
          # once move the branch under each other even though they write
          # different files. A retry is the whole remedy for that. Three
          # releases landing at once can still exhaust three attempts, so a
          # third failure is not proof that no retry could ever clear it — it is
          # the point at which reporting beats guessing.
          for attempt in 1 2 3; do
            sha=$(gh api "$api" --jq .sha 2>/dev/null || true)
            set -- -X PUT -f "message=ci: ${module} ${VERSION}" \
                   -f "content=$(base64 -w0 < "$file")"
            if [ -n "$sha" ]; then set -- "$@" -f "sha=$sha"; fi
            if gh api "$api" "$@" >/dev/null 2>"$err"; then
              echo "::notice::argocd now runs ${module} ${VERSION}"
              echo "\`yadgarhq/argocd\` now pins **${module} ${VERSION}**." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          cat "$err" >&2
          {
            echo "### Published, but NOT deployed"
            echo ""
            echo "\`${module} ${VERSION}\` was pushed and signed, but writing"
            echo "\`versions/${module}.yaml\` to \`${OWNER}/argocd\` was refused."
            echo "The cluster keeps running the previous image and Argo CD"
            echo "reports Synced, which is the exact failure this job exists to"
            echo "end — so this is a red build rather than a warning."
            echo ""
            echo "The usual cause is the \`main\` ruleset on \`${OWNER}/argocd\`:"
            echo "the release App has to be a bypass actor there, or the write"
            echo "needs a pull request that nothing opens."
            echo ""
            echo "RELEASING AGAIN IS NOT THE REPAIR. \`v${VERSION}\` is cut and"
            echo "permanent — \`release-tags\` forbids deletion, update and"
            echo "non-fast-forward — and \`:latest\` has already moved. Once the"
            echo "write is permitted, either **Re-run failed jobs** on this run,"
            echo "which reuses \`detect\` and \`image\` rather than rebuilding"
            echo "them, or write \`versions/${module}.yaml\` by hand."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Could not write the version to ${OWNER}/argocd. See the job summary."
          exit 1

      # ASKING THE ESTATE FOR A VERDICT, and this is the second half of a
      # trigger whose first half has been waiting since the suite was written.
      # `yadgarhq/estate`'s `smoke.yaml` fires on `repository_dispatch` type
      # `module-rolled`; nothing in the organisation sent that event, so the
      # behavioural contract suite had never executed once. This is the sender.
      #
      # A SECOND TOKEN RATHER THAN A WIDER FIRST ONE. The mint above narrows to
      # `repositories: argocd` and says why. Adding `estate` to that list would
      # hand the token that pins the cluster's images write access to a test
      # repository, and hand the dispatch a token that can rewrite every
      # `versions/*.yaml`. Two mints cost one extra API call and keep each token
      # unable to do the other's job. Same action at the SAME pinned SHA — two
      # pins for one action in one file would be a smell of its own.
      #
      # `contents: write` IS WHAT THE ENDPOINT ASKS FOR, read from GitHub's
      # fine-grained permission reference rather than assumed: `POST
      # /repos/{owner}/{repo}/dispatches` is listed under Contents at `write`.
      # `actions: read` is for the verification below, which reads a run list.
      # The App — `yadgarhq-bot`, app id 4814165 — holds `contents: write` and
      # `actions: write` organisation-wide with `repository_selection: all`, so
      # `estate` is already in reach. There is NO new credential, no new secret
      # and no caller change: the five chart-carrying repositories that already
      # pass `RELEASE_APP_*` to their `release:` job need no edit, and the
      # `workflow_call` signature above is untouched.
      - name: mint a token that can ask estate for a verdict and nothing else
        id: estate_app
        if: steps.cred.outputs.configured == 'true'
        # NOT WORTH A RED RELEASE — the argument is on the step below. A failed
        # mint arrives there as an empty token and is reported there, so the
        # failure has one voice rather than two.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: estate
          permission-contents: write
          permission-actions: read

      # AFTER THE PIN IS WRITTEN, AND THAT ORDER IS WHY THIS IS A STEP RATHER
      # THAN A JOB. The step that writes `versions/<module>.yaml` exits 1 when
      # the write is refused, so everything after it is skipped: a roll that
      # never reached argocd never asks for a verdict on itself. A separate job
      # with `needs:` would state the same ordering at the cost of minting the
      # credential a third time.
      #
      # THE DISPATCH IS NOT A PROMISE THAT THE NEW PODS ARE UP, and the
      # receiving half already knows it. Argo CD syncs seconds to minutes after
      # the pin lands, so a suite that wins that race measures the PREVIOUS pods
      # and reports green for code that is not running. `estate`'s `await-roll`
      # binary is the tolerance, and it reads exactly the payload sent below: for
      # the gateway it polls `server/discover` for up to ten minutes until the
      # served version equals the dispatched tag with the leading `v` stripped,
      # and for the other four modules it prints on the run itself that the
      # verdict may describe the previous pods. Stage 3's A-04 replaces both
      # halves with digest parity — which is why `digest` is in the payload
      # although nothing reads it yet.
      #
      # A FAILED DISPATCH MUST NOT REDDEN THE RELEASE. By the time this step
      # runs the tag is cut and permanent, the image is pushed and signed, and
      # argocd is pinned — the release SUCCEEDED and the pods will roll. Failing
      # the job here would report a shipped release as broken and invite the one
      # repair the step above spends four lines forbidding, which is releasing
      # again.
      #
      # BUT IT IS NOT ALLOWED TO BE SILENT, because a dispatch that fails
      # quietly is this estate's most repeated defect. So the step itself FAILS
      # — a red cross in the step list, an error annotation on the run, and a
      # named section in the job summary — and `continue-on-error` keeps that
      # failure out of the release's own verdict. It is the shape `estate`'s
      # `smoke.yaml` already uses for its C-18 row, for the same reason.
      #
      # A 204 IS NOT EVIDENCE THAT ANYTHING LISTENED, and checking only the exit
      # status of the POST would be a sixth check that cannot fail. The endpoint
      # answers 204 when the event type matches no workflow, and 204 when the
      # workflow is missing from the default branch — GitHub runs the
      # DEFAULT-BRANCH copy of a `repository_dispatch` workflow and no other. So
      # this step records the newest dispatch run in `estate` before the POST and
      # waits for a NEWER one to appear. That discriminates today, with no runner
      # installed, because a QUEUED run is still a CREATED run.
      #
      # NOT GATED ON THE ESTATE BEING READY, argued rather than assumed. The ARC
      # scale set is not installed — `estate` has zero registered runners — so a
      # dispatched run queues, and `estate`'s own README says a queued run is
      # easy to mistake for a passing one. This side cannot fix that, and a
      # readiness gate is a switch somebody must remember to remove, which is
      # how the first half came to sit unused. The credential check above is
      # already the one gate this job needs. What this side CAN do is name the
      # created run, so the release says where the verdict will appear and one
      # link shows whether it ever ran.
      #
      # THE QUERY NAMES `smoke.yaml`, AND AN EARLIER REVISION OF THIS COMMENT
      # CLAIMED MORE FOR THAT THAN IT DELIVERS. It said the scoping stops one
      # module confirming on another's run. It does not, and the reason is
      # measurable: `estate` holds exactly two workflows, and `ci.yaml` triggers
      # only on `pull_request` and `push`, so `smoke.yaml` is the ONLY workflow
      # there a `repository_dispatch` can reach. A repository-wide query
      # filtered by `event=repository_dispatch` is therefore SET-EQUAL to this
      # one, and naming the workflow separates nothing.
      #
      # THE CROSS-MODULE COLLISION IS STILL OPEN. Five modules POST the same
      # event to the same workflow within seconds; each records the same
      # `before`, each POSTs, and each confirms on whichever run appeared first.
      # Module A can pass on module B's run and print B's URL into A's release
      # summary. Nothing in the runs list identifies the payload, because
      # `estate`'s `smoke.yaml` carries no `run-name:`, and `created_at` cannot
      # separate dispatches seconds apart. The fix is two-repo and belongs
      # there: give `smoke.yaml` a `run-name` carrying `client_payload.module`
      # and `.tag`, then match on `display_title` here instead of on "newest id
      # greater than baseline".
      #
      # WHAT THE SCOPING DOES BUY, stated at its real size: it excludes a future
      # second `repository_dispatch` workflow in `estate`, and it turns an
      # absent `smoke.yaml` into a named 404 rather than a silent timeout. The
      # endpoint takes the `event` filter — verified read-only against
      # `ci-self.yaml` in this repository, where 45 runs split 16 `push` + 29
      # `pull_request` + 0 `repository_dispatch`.
      #
      # IT ALSO TURNS ONE GUESSED CAUSE INTO A NAMED ONE. This URL resolves a
      # workflow by path in the DEFAULT BRANCH, so a `smoke.yaml` that is
      # renamed or absent there answers 404 — and that lands on the strict read
      # below, which reports it and does not send the dispatch, instead of being
      # one of four possibilities offered after a silent timeout.
      #
      # 150s, NOT 60s, AND THE WAIT COSTS THE RELEASE NOTHING. This step is
      # `continue-on-error` inside a job whose expensive work is already done,
      # and it exits the moment a newer run id appears, so the happy path is
      # unchanged at about five seconds. What the longer window buys is fewer
      # false reds — and a false red here is expensive out of proportion to the
      # wait, because both repairs it can prompt are harmful when a run does in
      # fact exist. The interval stays at 5s; only the count rises.
      #
      # AND THE TIMEOUT NO LONGER ASSERTS A CAUSE IT CANNOT KNOW. `newest()`
      # turns every read failure into 0, and the loop ends on elapsed time, so
      # `run_id -eq 0` is reachable three ways: no run was created, which is the
      # real case; every confirming read failed; or an eventually-consistent
      # read answered with a lower id. The old text opened "The run list was
      # readable a moment ago" and listed four causes with the read failing not
      # among them — it asserted the one thing it could not check. It is a
      # separate function now, with a separate heading, because the summary it
      # shared claimed NO behavioural contract ran for this roll, which is false
      # exactly when the check is wrong.
      - name: ask estate for a verdict on this roll
        id: estate_dispatch
        if: steps.cred.outputs.configured == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.estate_app.outputs.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          module="${REPO#*/}"
          # SCOPED TO smoke.yaml, not to the event alone. See above: five
          # modules rolling at once would otherwise confirm on each other.
          w="actions/workflows/smoke.yaml/runs"
          runs="repos/${OWNER}/estate/${w}?event=repository_dispatch&per_page=1"

          # Sanitised rather than trusted: a partial write followed by a non-zero
          # exit would otherwise put a non-number into a numeric comparison, and
          # the arithmetic error would read as a missing run.
          newest() {
            n=$(gh api "$runs" --jq '.workflow_runs[0].id // 0' 2>/dev/null || true)
            case "$n" in '' | *[!0-9]*) n=0 ;; esac
            printf '%s' "$n"
          }

          fail() {
            {
              echo "### Rolled, but the estate was not asked"
              echo ""
              echo "\`${module} ${VERSION}\` is released and \`${OWNER}/argocd\` is"
              echo "pinned to it, so the release is sound and the pods will roll."
              echo "What did not happen is the verdict: $1"
              echo ""
              echo "NO behavioural contract ran for this roll. Send it by hand from"
              echo "the Actions tab of \`${OWNER}/estate\` — smoke has a"
              echo "\`workflow_dispatch\` taking \`module\` and \`tag\` — or re-run this"
              echo "job once the cause is cleared. RELEASING AGAIN IS NOT THE REPAIR."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${OWNER}/estate was not asked for a verdict: $1"
            exit 1
          }

          # NOT THE FAILURE ABOVE, and it must not borrow those words: that one
          # knows the dispatch was never sent, this one knows only that no newer
          # run id was READ. The reasoning is on this step; the text is written
          # for somebody who will act on it without reading either.
          unconfirmed() {
            {
              echo "### Rolled, but the verdict was not confirmed"
              echo ""
              echo "\`${module} ${VERSION}\` is released and \`${OWNER}/argocd\` is"
              echo "pinned to it, so the release is sound and the pods will roll."
              echo "The dispatch was accepted, and then no new \`smoke\` run was"
              echo "read in ${window}s. WHETHER ONE EXISTS IS NOT KNOWN FROM HERE."
              echo ""
              echo "The causes, in order: the event type no longer matches"
              echo "\`smoke.yaml\`; that workflow is disabled in the Actions tab of"
              echo "\`${OWNER}/estate\`; GitHub is behind and the run appeared after"
              echo "this check stopped looking; or THE CONFIRMING READS THEMSELVES"
              echo "FAILED — each one turns any error into 0, so a revoked token"
              echo "or an Actions API blip longer than ${window}s reports exactly"
              echo "like a missing run while a run sits queued."
              echo ""
              echo "SO OPEN THE ACTIONS TAB OF \`${OWNER}/estate\` FIRST. A smoke"
              echo "run for **${module} v${VERSION}** there means this check was"
              echo "wrong and there is nothing to repair. Only if none is there,"
              echo "send one by hand — smoke takes \`module\` and \`tag\` on"
              echo "\`workflow_dispatch\` — bearing in mind that it joins smoke's"
              echo "\`estate-smoke\` group, which queues rather than running"
              echo "alongside, so a blind send while a real run is already waiting"
              echo "risks losing a verdict rather than gaining one."
              echo ""
              echo "Re-running is the heavier option and there is"
              echo "no cheap form of it: this step is \`continue-on-error\`, so the"
              echo "job concluded SUCCESS and **Re-run failed jobs** cannot reach"
              echo "it. **Re-run all jobs** can, and that rebuilds and re-pushes"
              echo "the image — moving \`:latest\` again and giving \`:${VERSION}\` a"
              echo "digest \`argocd\` is not pinned to — as well as replaying the"
              echo "\`argocd\` write. RELEASING AGAIN IS NOT THE REPAIR EITHER."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${OWNER}/estate: no smoke run confirmed in ${window}s, but one may exist — open the Actions tab of ${OWNER}/estate before repairing anything. See the job summary."
            exit 1
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            fail "the estate-scoped App token could not be minted; see the step above."
          fi

          # STRICT ON THIS FIRST READ, LENIENT ON THE POLL BELOW, and the split
          # is the difference between naming a cause and guessing one. If this
          # token cannot list runs at all, every later read returns 0 as well
          # and the timeout below would blame the event type or the default
          # branch — the wrong cause, stated confidently, which is the defect
          # this whole step exists to end. So a refusal HERE says so, and the
          # dispatch is not sent: an event whose arrival cannot be confirmed is
          # worse than one not sent, because it reports as sent. A blip DURING
          # the poll is a different thing entirely — one missed sample of
          # thirty, which the next sample covers. A blip lasting the WHOLE poll
          # is neither, and unconfirmed() below is what says so.
          err="$RUNNER_TEMP/estate_error.txt"
          before=$(gh api "$runs" --jq '.workflow_runs[0].id // 0' 2>"$err") ||
            fail "this token could not list smoke.yaml runs in ${OWNER}/estate ($(tr -d '\n' < "$err")). The dispatch was NOT sent: an arrival that cannot be confirmed would report as confirmed. Two usual causes, and the error above tells them apart: the actions: read grant on the token minted above, or — on a 404 — smoke.yaml being renamed or absent on the default branch of ${OWNER}/estate, which is the only copy this event can run."
          case "$before" in '' | *[!0-9]*) before=0 ;; esac

          # One JSON document built by jq, rather than nested bracket keys on the
          # command line: this can only be tested by reading it, so it is written
          # in the form that reads unambiguously.
          if ! jq -n --arg m "$module" --arg t "v${VERSION}" --arg d "$DIGEST" \
                 '{event_type:"module-rolled",client_payload:{module:$m,tag:$t,digest:$d}}' |
            gh api -X POST "repos/${OWNER}/estate/dispatches" --input - >/dev/null; then
            fail "the dispatch POST was refused."
          fi

          # The POST answered 204. Now find out whether anything listened. The
          # count rises and the interval does not: a run that appears in five
          # seconds is still confirmed in five seconds.
          run_id=0
          tries=30
          window=$((tries * 5))
          i=0
          while [ "$i" -lt "$tries" ]; do
            i=$((i + 1))
            sleep 5
            now=$(newest)
            if [ "$now" -gt "$before" ]; then
              run_id="$now"
              break
            fi
          done

          if [ "$run_id" -eq 0 ]; then
            unconfirmed
          fi

          url="https://github.com/${OWNER}/estate/actions/runs/${run_id}"
          echo "::notice::${OWNER}/estate accepted the roll: ${url}"
          {
            echo "### The estate was asked for a verdict"
            echo ""
            echo "\`${OWNER}/estate\` accepted \`module-rolled\` for"
            echo "**${module} v${VERSION}** and created [run ${run_id}](${url})."
            echo "Whether it finds a runner, and what it answers, shows on that run."
          } >> "$GITHUB_STEP_SUMMARY"
