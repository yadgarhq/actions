# Cutting a release. The stage order is forced by D61, not chosen: the chart
# pins the image by DIGEST, so the digest must exist before the chart can be
# packaged. Build, push, capture digest, package chart against it, push, sign.
name: ci-release

on:
  workflow_call:
    inputs:
      version:
        description: >-
          The release version. A git tag name is fine: a leading `v` is stripped
          here so every caller can pass `github.ref_name` unchanged.
        type: string
        required: true
    # BOTH OPTIONAL, because only the `parent` job below reads them and only a
    # repository that publishes a chart reaches it. A reusable workflow cannot
    # see a caller's secrets unless the caller passes them, so a repository with
    # no chart passes nothing and loses nothing. A chart-carrying repository
    # that passes nothing hands over two empty strings, and `parent`'s `cred`
    # step reds the release and names the repair. (This said the secrets kept a
    # `deployment` job INERT. That job asked `yadgarhq/estate` for a verdict on
    # every release and is retired: ledger 675 stage 7, ledger 1487.)
    #
    # The App is the one ADR-0527 already mints per run for the tag. It is not a
    # second credential and there is no new key to hold — what is new is the
    # `repositories:` it is scoped to when the token is minted.
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  packages: write
  # Signing uses the workflow's own OIDC identity, so there is no key material
  # to hold or rotate (D61).
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.d.outputs.image }}
      chart: ${{ steps.d.outputs.chart }}
      # Normalised ONCE, here, and read by every later job. Callers pass
      # `github.ref_name`, which for the tag `v0.1.0` is `v0.1.0` — but a chart
      # version and an image tag must both be bare SemVer, and D64 derives the
      # number from the changelog with no `v` anywhere in it. Stripping in the
      # callers instead would mean the same expression copied into ~61 repos,
      # and GitHub expressions have no suffix-strip: `replace(x, 'v', '')` is
      # the only inline option and it eats the `v` in `preview` too.
      version: ${{ steps.d.outputs.version }}
      # THE CHART'S OWN NAME, WHICH IS NOT THE REPOSITORY'S. The `parent` job
      # below writes this release into the parent chart's `dependencies:`, whose
      # entries are keyed by CHART name — and `yadgarhq/chart` is already the
      # counterexample: its chart is named `yadgar`. Empty for a repository with
      # no `chart/`, which is every repository the `parent` job skips anyway.
      chartname: ${{ steps.d.outputs.chartname }}
    steps:
      # ADR-0981 / ADR-0984: `detect` takes no checkout of `yadgarhq/actions`.
      # It reads and checks the commit THIS workflow file runs at only to record
      # it once per run, and to fail the whole release closed if it is unreadable.
      - name: the actions commit this job runs (ADR-0981)
        id: own_sha
        env:
          OWN_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$OWN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a 40-hex commit SHA: '${OWN_SHA}'. There is no fallback to main (ADR-0981)."
            exit 1
          fi
          echo "sha=${OWN_SHA}" >> "$GITHUB_OUTPUT"
      # ONCE PER RUN (ADR-0981): the commit of `yadgarhq/actions` every second
      # checkout in this run reads, so a run can be reproduced from its summary.
      - name: record the yadgarhq/actions commit this run executes
        env:
          OWN_SHA: ${{ steps.own_sha.outputs.sha }}
        run: |
          echo "yadgarhq/actions commit this run executes: \`${OWN_SHA}\` (ADR-0981)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "## Release ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          for pair in "image:Containerfile" "chart:chart"; do
            k=${pair%%:*}; f=${pair#*:}
            if [ -e "$f" ]; then
              echo "$k=true" >> "$GITHUB_OUTPUT"
              echo "- **$k**: \`$f\` present → publishing" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$k=false" >> "$GITHUB_OUTPUT"
              echo "- $k: no \`$f\` → nothing to publish" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # READ RATHER THAN DERIVED, and the difference is not cosmetic. The
          # parent chart's `dependencies:` entries are keyed by CHART name, and so
          # is what `helm push` publishes — `chart_publicly_pullable.py` takes the
          # package name off the TARBALL for exactly this reason rather than off
          # `github.repository`. Those two names agree in the eight module
          # repositories and disagree in the ninth: `yadgarhq/chart` publishes
          # `yadgar`. Deriving the name would be right by coincidence.
          #
          # AN UNNAMED CHART IS A REFUSAL. `yq` prints `null` for an absent key
          # and exits 0, so the empty answer has to be tested here; a pin written
          # under `null` is a parent nothing can resolve.
          if [ -f chart/Chart.yaml ]; then
            name=$(yq '.name' chart/Chart.yaml)
            if [ -z "$name" ] || [ "$name" = "null" ]; then
              echo "::error::chart/Chart.yaml declares no name:, so neither the published package nor the parent chart's pin can be named"
              exit 1
            fi
            echo "chartname=$name" >> "$GITHUB_OUTPUT"
            echo "- chart name: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  image:
    needs: detect
    if: needs.detect.outputs.image == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Containerfile is podman's native name and is understood by buildkit
          # too, but buildkit defaults to Dockerfile, so it has to be named.
          # This project builds with podman locally; using two names for one
          # file to satisfy two builders would be the drift, not the fix.
          file: Containerfile
          push: true
          # THE BUILD IS TOLD ITS VERSION RATHER THAN LEFT TO DERIVE ONE, and
          # this is the only place in the estate that knows the answer without
          # guessing: `detect` normalised the tag once, and the image tag, the
          # chart version and this argument are now the same string.
          #
          # It is passed BARE — `0.9.0`, not `v0.9.0` — because that is what
          # `needs.detect.outputs.version` holds after the strip at the top of
          # this file, and a consumer that wants the `v` back cannot get it from
          # a value that never had one. A Containerfile may strip a leading `v`
          # anyway for the local case; nothing here relies on that.
          #
          # WHY IT IS UNCONDITIONAL, for a workflow shared by ~61 repositories
          # of which most declare no `VERSION` at all: an undeclared build
          # argument is accepted and ignored by buildkit — verified against
          # `moby/buildkit` directly, exit 0, no warning — so this costs the
          # repositories that do not want it nothing. Making it conditional
          # would mean a new input every caller has to set, which is the
          # ~61-copies shape D19 exists to prevent.
          #
          # A Containerfile that declares `ARG VERSION` AFTER an expensive
          # cached layer keeps that layer cached when this value changes; that
          # is dockerfile semantics rather than a hope, and it was confirmed the
          # same way — a pre-`ARG` step reported CACHED across two builds with
          # different values. So a release does not rebuild a dependency graph
          # to learn its own number.
          build-args: |
            VERSION=${{ needs.detect.outputs.version }}
          # Images at the top level; charts under charts/. They share a
          # namespace and would otherwise collide — `helm push` would claim
          # exactly the path the image wants (D61).
          # TWO tags, and the moving one is required rather than a convenience.
          #
          # D65 splits them deliberately: the chart in GIT points at a moving tag
          # so a development cluster picks up releases without a commit, while
          # the PUBLISHED chart pins a digest for reproducibility. Publishing only
          # the version tag left the git half pointing at an image that does not
          # exist — every Argo-deployed pod sat in ImagePullBackOff, and the
          # release itself looked entirely successful.
          #
          # Found when the D54 ApplicationSet first deployed anything.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.detect.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # THE DIGEST IS ASSERTED ONCE, HERE, AND NOWHERE ELSE. Four things read
      # it for a build that depends on it being real: the trivy scan below,
      # the SBOM, the cosign signature, and the `yq` rewrite of
      # `chart/values.yaml` in the `chart` job. The first three build a
      # reference ending in `@` and fail on a malformed ref, which is luck
      # rather than a check. The last fails SILENTLY, and that is what this
      # step is for: an empty digest publishes a chart carrying
      # `image.digest: ""` and NO TAG AT ALL, because the same `yq` expression
      # deletes `image.tag`.
      #
      # AT THE PRODUCER RATHER THAN AT EACH CONSUMER. Here this step protects
      # all four, and the gating already carries the failure downstream:
      # wherever there is an image at all, `chart` requires this job to have
      # SUCCEEDED, so a red guard skips its silent write rather than letting
      # it run on a value nobody vouched for. (`chart` read `!= 'failure'`
      # when this comment was written, which admitted a cancelled job; ledger
      # 729 replaced it — see the condition itself.) A later consumer gets
      # the guarantee without having to remember to ask for it.
      #
      # THE SHAPE IS NOT ARBITRARY. `^sha256:[0-9a-f]{64}$` is the only form
      # every downstream reader below can act on — the trivy scan, the SBOM
      # and the cosign signature all build a reference out of it — so matching
      # it here turns a reference nothing downstream could use into a build
      # that does not pass.
      #
      # TESTED AS A VARIABLE, NEVER AS A PIPELINE. The `if ! cmd | grep -q ...`
      # shape collapses a tool error, an absent tool and a genuine mismatch into
      # one branch, which is a check that cannot fail — this estate has already
      # shipped one. `set -euo pipefail` and a test of the captured value keep
      # the three apart.
      - name: the push must have reported a digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Image digest \`$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### The image push reported no usable digest"
            echo ""
            echo "\`docker/build-push-action\` returned \`${DIGEST:-(empty)}\`, which"
            echo "is not \`sha256:\` followed by 64 lowercase hex characters."
            echo ""
            echo "Nothing downstream would have said so. The published chart would"
            echo "carry \`image.digest: \"\"\` and no \`image.tag\` at all, which looks"
            echo "like a successful release."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The image push reported no usable digest. See the job summary."
          exit 1

      # Scan the ARTIFACT, not the source tree. ci-validation scans the
      # filesystem before anything is built; this is the thing an adopter
      # actually runs, including whatever the base image contributed.
      #
      # ignore-unfixed: an unfixable CVE in a base is not something this build
      # can act on, and a gate nobody can satisfy gets disabled rather than
      # fixed. The weekly base rebuild is what picks up fixes when they land.
      - name: scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # D63: lean and secure are measured, not asserted. A claim about an
      # image's contents that nothing verifies is a claim about the
      # Containerfile.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: "${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          upload-artifact: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        env:
          # Through env, never interpolated into the script. zizmor's
          # template-injection audit is right even where the value looks
          # trustworthy: the habit is what protects the one case that is not.
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"

      # A push reports success without saying whether anybody else can pull what
      # it pushed. Visibility is a GitHub-side property this job never sets, and
      # there is no API that sets it either — it lives on the package's own
      # settings page and nowhere else. So the workflow checks what an adopter
      # EXPERIENCES rather than what it just did, and names the one-time manual
      # fix on the day the answer is no. Same instinct as the detection step
      # narrating what it skipped: a silent wrong state is worse than a red build.
      #
      # THIS COMMENT NO LONGER CLAIMS A NEW PACKAGE IS PRIVATE BY DEFAULT.
      # ADR-0723 measured the opposite for a package pushed from a public
      # repository, and `scripts/chart_publicly_pullable.py` was corrected in #83
      # while this step was left saying the refuted thing. The gate stays for what
      # it verifies, not for a defect it no longer has evidence of.
      #
      # LEDGER 976 — THE READ IS MADE ANONYMOUS, AND UNTIL NOW IT WAS NOT. This
      # job's third step is `docker/login-action`, which writes a credential into
      # the docker CLI's configuration directory, and `docker manifest inspect`
      # answers from whatever is on disk. So this step performed an AUTHENTICATED
      # pull — and an authenticated pull of a PRIVATE package succeeds. It
      # reported "Anonymous pull works" about a request that was not anonymous and
      # could not fail for the reason it exists: the fifth check-that-cannot-fail
      # this estate has measured (ADR-0645). The `chart` job's own guard below is
      # headed "SAME INTENT, DELIBERATELY NOT ITS MECHANISM" and names exactly
      # this mistake; the prose was right and the step was never fixed.
      #
      # `DOCKER_CONFIG` POINTED AT AN EMPTY DIRECTORY is the whole fix: no
      # `config.json`, so no `auths` entry and no credential helper, so docker
      # performs the anonymous token exchange an adopter's client performs. It is
      # WEAKER THAN THE CHART GATE'S ASSERTION and that is worth stating: that
      # gate asserts the two requests' headers are byte-identical under poisoned
      # environment values, which is an equality; this is an absence, and an
      # absence is easier to lose. `scripts/tests/test_image_visibility_is_anonymous.py`
      # executes this very block against a stub registry to keep the absence
      # honest, with the paired public-package case ADR-0646 requires.
      - name: verify an adopter can actually pull this
        env:
          REF: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.detect.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          anon="$RUNNER_TEMP/anonymous-docker-config"
          rm -rf "$anon"
          mkdir -p "$anon"
          if DOCKER_CONFIG="$anon" docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "Anonymous pull of $REF works." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Published, but NOT publicly pullable"
            echo ""
            echo "\`$REF\` was pushed and signed, but an anonymous pull is refused."
            echo "**No API can change a package's visibility** — it is a one-time"
            echo "manual step per package:"
            echo ""
            echo "  https://github.com/orgs/${OWNER}/packages/container/$(basename "$REPO")/settings"
            echo ""
            echo "Danger Zone -> Change visibility -> Public."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Package is not publicly pullable. See the job summary."
          exit 1

  chart:
    needs: [detect, image]
    # THREE CASES, NOT TWO, and the middle one is what the old condition
    # published. GitHub renders `needs.image.result` as one of four values, and
    # `!= 'failure'` sorted them into "failure" and "everything else" — so a
    # CANCELLED image job satisfied this gate. The digest-pin step below is
    # separately gated on `success`, so it did not run, and `helm push` then
    # published the chart built from git's `values.yaml`, which by D65 carries a
    # MOVING TAG rather than a digest. Nothing errored and nothing reported it:
    # from every angle this file could see, that was a successful release.
    #
    #   image succeeded             -> package it, pinned by the digest below
    #   image SKIPPED, because this
    #     repository has no image   -> package it, there is nothing to pin
    #   image cancelled or failed   -> refuse; a digest exists and we do not
    #                                  have it
    #
    # always() STAYS, and it is load-bearing rather than defensive: without it a
    # chart-only repository's chart is skipped whenever the image job does not
    # run. That repository exists. Measured 2026-09-06 across all 18
    # repositories in the organisation: 7 carry a `chart/`, and exactly one of
    # them — `yadgarhq/config` — carries no `Containerfile`. It calls this
    # workflow at `@main`, so the skipped arm is live rather than hypothetical.
    #
    # THE SKIP ARM ASKS `detect`, NOT `image`. `needs.detect.outputs.image` is a
    # FACT about the tree — the `Containerfile` is absent — and it is the same
    # fact that made the image job skip. Reading `needs.image.result ==
    # 'skipped'` instead would let any FUTURE reason for that job not to run
    # publish an unpinned chart, which is the defect being closed rather than a
    # narrower spelling of the fix.
    #
    # `== 'false'` RATHER THAN `!= 'true'`, which reads as equivalent and is
    # not. `detect` writes the literal string `false`. Anything else it could
    # ever render — an empty output from a job that did not itself complete, a
    # typo, some third value — leaves `== 'false'` demanding a successful image
    # and leaves `!= 'true'` publishing without one. One keystroke, opposite
    # failure direction.
    if: >-
      always() && needs.detect.outputs.chart == 'true'
      && (needs.image.result == 'success' || needs.detect.outputs.image == 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # THE SAME TWO PINS `ci-pr.yaml` USES — the action's SHA and the helm
      # version — and this is the call site where the version matters MOST. The
      # two in `ci-pr.yaml` decide whether a check passes; this one packages the
      # artefact an operator installs, so an unpinned helm here means the
      # published chart was built by whichever major the network answered with.
      # v3.18.4 is what Argo CD v3.1.8 bundles and therefore what renders these
      # charts in the cluster, so packaging with it keeps the producer and the
      # consumer the same program. The full reasoning is above the `precommit`
      # copy in `ci-pr.yaml`; when Argo's bundled helm changes, all three follow.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      # D65: the chart IN GIT points at a moving tag, because our own cluster
      # deploys it from git at HEAD and development follows HEAD by design. The
      # PUBLISHED chart pins a digest, because a release must name exactly what
      # runs (D61).
      #
      # This rewrite happens in the workspace and is NEVER committed. Committing
      # it would mean a bot pull request against a protected main for every
      # release, changing one line — noise that trains people to merge without
      # reading.
      #
      # A chart published without this step ships a floating tag, and the JOB
      # CONDITION above is what keeps that from happening — not this step's own.
      # Until ledger 729 the argument written here was that the release workflow
      # is the only thing that publishes a chart, which names publication
      # frequency as the safeguard rather than a gate; a cancelled image job
      # walked straight through it.
      #
      # LEFT ON `needs.image.result == 'success'` rather than restated as the
      # fact the gate above uses. Inside this job the two are now equivalent, so
      # rewriting it would widen the diff and buy nothing. It would not buy a
      # red build either: `yq` exits 0 on an empty digest, writing
      # `image.digest: ""` and deleting the tag, so no phrasing of THIS
      # condition turns a missing digest into a failure. The `image` job's own
      # digest guard is where an empty digest reddens, and the gate above is
      # where "no digest at all" is decided.
      - name: pin the image by digest, for the published chart only
        if: needs.image.result == 'success'
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Publishing with image digest \`$DIGEST\` (git keeps its tag)." \
            >> "$GITHUB_STEP_SUMMARY"
          yq -i ".image.digest = \"$DIGEST\" | del(.image.tag)" chart/values.yaml
      # ADR-0981 / ADR-0984: the checkout of `yadgarhq/actions` in this job reads
      # the commit THIS workflow file runs at, never `main`. Read through
      # `fromJSON(toJSON(job))` because actionlint types `job` strictly; checked
      # here, fail-closed, before anything consumes it.
      - name: the actions commit this job runs (ADR-0981)
        id: own_sha
        env:
          OWN_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$OWN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a 40-hex commit SHA: '${OWN_SHA}'. There is no fallback to main (ADR-0981)."
            exit 1
          fi
          echo "sha=${OWN_SHA}" >> "$GITHUB_OUTPUT"
      # STAGED BEFORE THE PUSH, and the order is the point. The two steps below
      # fetch the gate that runs AFTER publishing; a checkout flake or a missing
      # file has to fail with nothing published rather than after.
      #
      # THE IDIOM IS `ci-pr.yaml`'S, five times over — its `portability`,
      # `service_immutable` and `passed` jobs among them: a second checkout of
      # `yadgarhq/actions` into `.ci-actions`, skipped when this IS that
      # repository, and the REPOSITORY NAME rather than the file's presence
      # decides which copy runs. At the workflow's own commit (ADR-0981):
      # `job.workflow_sha`, measured from a consumer, is the commit of this file
      # as the caller resolved it, so the script and the workflow that calls it
      # are one commit. (`github.job_workflow_ref` is an OIDC claim, not an
      # expression; `job.workflow_sha` is.)
      #
      # THE `yadgarhq/actions` ARM IS INERT AS SHIPPED, said rather than left to
      # be discovered: that repository carries no `chart/`, so `detect` reports
      # `chart=false` and this job never runs there. It is written anyway because
      # the alternative is an idiom that reads differently here than in the five
      # places it already appears.
      - if: github.repository != 'yadgarhq/actions'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: yadgarhq/actions
          ref: ${{ steps.own_sha.outputs.sha }}
          path: .ci-actions
      - name: stage the visibility gate, then restore the tree
        env:
          # Through the environment, never `${{ }}` inside the script.
          UNDER_RELEASE: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$UNDER_RELEASE" = "yadgarhq/actions" ]; then
            src=scripts/chart_publicly_pullable.py
          else
            src=.ci-actions/scripts/chart_publicly_pullable.py
          fi
          if [ ! -f "$src" ]; then
            echo "::error::the chart visibility gate is missing at $src"
            exit 1
          fi
          cp "$src" "$RUNNER_TEMP/chart_publicly_pullable.py"
          # THE SECOND CHECKOUT IS DELETED BEFORE ANYTHING ELSE RUNS. `helm
          # package` and the gate both work on this workspace, and another
          # repository's tree inside it is a source of artefacts neither should
          # ever see.
          rm -rf .ci-actions
      # `-u` OVER A SEPARATE `helm dependency update` STEP. Every chart in this
      # estate was a leaf until `yadgarhq/chart`, whose `Chart.yaml` declares
      # eight OCI dependencies, so this line has never had to resolve anything.
      # Bare `helm package chart` REFUSES such a chart outright — measured on
      # helm 3.18.4, 3.20.2 and 4.2.3 alike:
      #
      #   Error: found in Chart.yaml, but missing in charts/ directory:
      #   config, gateway, iam, iam-db, project, project-db, task, task-db
      #
      # `-u`/`--dependency-update` (confirmed present on the pinned v3.18.4 via
      # its own `helm package --help`) resolves every dependency from its
      # declared `repository:` and exact `version:` before packaging, and on a
      # failure to resolve names the one dependency and the reason —
      # `Error: could not download oci://.../gateway: ... gateway:X.Y.Z: not
      # found` — rather than the bare command's one-shot list of every missing
      # name. A standalone `helm dependency update chart` step first would give
      # the identical message and exit code (measured), so the only difference
      # is that it also refreshes every HTTP chart repository configured on the
      # runner before touching the OCI ones this chart actually needs — `-u`
      # does not. One flag, not a second step.
      #
      # THIS IS A NO-OP FOR EVERY CHART THAT PRECEDED THE PARENT. Measured
      # against `yadgarhq/config`'s leaf chart, which has no `dependencies:` key
      # at all, on both the pinned v3.18.4 and v4.2.3: exit 0, no file written
      # under `charts/`, nothing in the working tree changes.
      #
      # A STALE VENDORED SUBCHART STOPS BEING SILENT FOR WHAT THIS JOB
      # PUBLISHES. Measured: with `Chart.yaml` pinning a dependency one version
      # ahead of the tarball already committed under `charts/`, bare `helm
      # package` packages and ships the OLD subchart under the NEW parent
      # version, exit 0. `-u` does not trust that committed tarball — it always
      # re-resolves and re-fetches every declared dependency from the registry
      # at the version `Chart.yaml` names, overwriting whatever `charts/`
      # already held, so the artefact this job publishes reflects the pin
      # rather than whatever happened to be vendored in git. `Chart.lock` is
      # therefore not something this step reads or needs: `Chart.yaml` here
      # pins exact versions with no ranges, `-u` regenerates the lock as a
      # byproduct of resolving against that pin, and — like the digest rewrite
      # above — it lives only in this ephemeral workspace and is never
      # committed.
      - name: package and push
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package chart -u --version "$VERSION" --app-version "$VERSION"
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin
          helm push ./*-"$VERSION".tgz "oci://${REGISTRY}/${OWNER}/charts"

      # PUBLISHING A CHART DID NOT MAKE IT PULLABLE on its own authority, and
      # until this step nothing here checked. Visibility is a GitHub-side
      # property this job never sets, and there is no API that sets it either
      # — it lives on the package's own settings page and nowhere else. So the
      # workflow checks what an adopter EXPERIENCES rather than trusting what
      # the push above just did.
      #
      # THIS COMMENT NO LONGER CLAIMS A NEW PACKAGE IS PRIVATE BY DEFAULT.
      # ADR-0723 RECORDS THE GENERAL MEASUREMENT: "a GHCR package pushed by
      # `GITHUB_TOKEN` from a PUBLIC repository is created public", measured
      # on 2026-09-19. The SPECIFIC INSTANCE is not in the ADR, and is what
      # `scripts/chart_publicly_pullable.py`'s own docstring carries instead
      # — `yadgarhq/config` tagged `v0.1.0` that same day, and the
      # `charts/config` package this job created was PUBLIC from the moment
      # it existed, with no window for a manual settings flip. The gate stays
      # for what it verifies, not for a defect it no longer has evidence of.
      #
      # ADR-0705 IS WHAT MAKES A PRIVATE PACKAGE FATAL RATHER THAN UNTIDY. An installation
      # clones nothing: it REFERENCES this published chart from its own GitOps
      # repository and an upgrade is a version bump. The three Argo
      # `Application`s already consuming OCI charts in `yadgarhq/deploy` —
      # `infra/arc.yaml`, `infra/estate-front-runner.yaml`,
      # `infra/envoy-gateway.yaml` — carry no repository Secret at all, so every
      # installation's pull is ANONYMOUS by design and a private package fails
      # each one at sync, with nothing upstream reporting a problem.
      #
      # SAME INTENT AS THE `image` JOB'S GUARD ABOVE, deliberately not its
      # mechanism. That step asks the same question about the image and this
      # message is shaped after its message on purpose. What is not reused is HOW
      # it asks: it runs `docker manifest inspect` in a job whose first steps
      # include `docker/login-action`, so docker answers it from the credentials
      # on disk — an AUTHENTICATED pull, which succeeds against a private package.
      # This step is therefore given no token of its own, and that is the whole of
      # why it can fail: the gate exchanges an anonymous pull token and carries
      # nothing else. `scripts/tests/test_chart_publicly_pullable.py` pins both
      # halves — that no credential reaches the registry, and that this step's
      # `env:` holds none.
      #
      # A SCRIPT RATHER THAN SHELL, because shell in this file is untestable by
      # anything this repository runs: `ci-release.yaml` is tag-triggered, so the
      # first execution of any change here is post-merge in a consumer. The Python
      # half is exercised by `scripts/tests/`, which the `pytest-scripts` hook
      # gates on every commit.
      - name: an installation with no credential must be able to pull this chart
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          # THE SUMMARY IS WRITTEN ON THE FAILING PATH TOO, which is the only path
          # anybody reads it on — and a pipe into `tee` would have carried the
          # gate's status out through `pipefail` and never reached the summary.
          # The same shape `ci-pr.yaml`'s merge-gate step uses, for the same
          # reason.
          rc=0
          python3 "$RUNNER_TEMP/chart_publicly_pullable.py" \
            >"$RUNNER_TEMP/chart-pull.txt" 2>"$RUNNER_TEMP/chart-pull.err" || rc=$?
          cat "$RUNNER_TEMP/chart-pull.txt"
          cat "$RUNNER_TEMP/chart-pull.err" >&2
          {
            echo "## An anonymous pull of the published chart"
            echo ""
            cat "$RUNNER_TEMP/chart-pull.txt" "$RUNNER_TEMP/chart-pull.err"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # A MODULE RELEASE CUTS A NEW PARENT VERSION, which is ADR-0722 and which
  # REVERSES D66. An adopter installs ONE thing — the parent chart in
  # `yadgarhq/chart`, at one version, declaring every module as an OCI dependency
  # pinned exactly (D60) — so a module release that does not reach the parent is a
  # release no adopter can install. D66 left the parent's version "cut by hand,
  # deliberately"; the operator reversed that, on the ground that a hand-cut parent
  # makes every module fix's delivery wait for somebody to remember.
  #
  # THIS IS THE WRITING HALF OF A MECHANISM THAT WAS PUBLISHED AND ADOPTED
  # NOWHERE. `scripts/parent_pin.py` shipped in #82 with 58 test cases and 22
  # killed mutants, and `grep -rn parent_pin .github/` answered with nothing —
  # so every refusal it carries was a refusal nothing could reach. This job and
  # `scripts/parent_bump.py` are the caller. The decisions stay in `parent_pin`:
  # the semver comparison that ADR-0690 paid for, the equal-version refusal, the
  # downgrade refusal, and the ladder read off `next_version.compute` rather than
  # copied.
  #
  # WHAT MAKES THE FEATURE WORK AT ALL IS THAT AN APP CUTS THE TAG. Writing the
  # pin publishes nothing: the parent is published by `yadgarhq/chart`'s own
  # `ci.yaml`, which fires on `push` to `tags: ["v*"]`. A tag created with
  # `GITHUB_TOKEN` triggers NO workflow, so that arrangement would leave a pinned
  # parent nobody ever packaged — inert, and green from every angle. An App token
  # does trigger it, measured rather than assumed: `yadgarhq/config` carries five
  # consecutive tag-push runs, `v0.1.1` through `v0.1.5`, whose actor is
  # `yadgarhq-bot[bot]`, each of them a successful release.
  #
  # A DIRECT WRITE RATHER THAN A `repository_dispatch`, and the choice is
  # narrower than it looks. Dispatch would need a new workflow in `chart`, it runs
  # only the DEFAULT-BRANCH copy of that workflow, and it answers 204 whether or
  # not any workflow matched the event — so its exit status is a check that cannot
  # fail, and confirming it means watching for a run to appear, which the retired
  # `estate` dispatch step spent a hundred lines doing (ledger 675 stage 7). A
  # direct write, retried and confirmed by its own response, avoids all of that.
  #
  # NOT GATED ON `image`, AND THAT IS WHY THIS IS ITS OWN JOB. A job requiring
  # `needs.image.result == 'success'` — the retired `deployment` job's gate —
  # would skip `yadgarhq/config`, a parent module with NO `Containerfile` that
  # released five times on the day this was written. Every one of them would
  # have skipped, silently, for the one module whose shape differs.
  #
  # `needs.chart.result == 'success'` IS THE GATE, NOT BELT AND BRACES — and
  # that stopped being true the moment the `always()` below was added. Before
  # it, a job whose `needs` did not all succeed was skipped by GitHub
  # regardless, so a failed `chart` could never reach this far and the
  # comparison was redundant with GitHub's own default. `always()` disables
  # exactly that default, for every result it covers, not only the `skipped`
  # one it was added for — so a `chart` that FAILED or was CANCELLED now
  # reaches this line with nothing else standing between it and a bump. This
  # comparison is what still excludes them, and `scripts/tests/test_parent_bump.py`
  # evaluates it for the reason it always did: `helm package -u` resolves this
  # pin from the REGISTRY, so a pin written for a chart that never pushed does
  # not fail this release — it fails the NEXT parent release, in another
  # repository, for a reason nothing there can see.
  #
  # THE PARENT DOES NOT PIN ITSELF. `yadgarhq/chart` publishes a chart named
  # `yadgar` which is not in its own `dependencies:`, so `parent_bump.py` would
  # refuse and every parent release would be red — the feature failing on its own
  # output. The repository is named as a literal for the same reason the `chart`
  # job above names `yadgarhq/actions` as one.
  #
  # INERT UNTIL TWO THINGS ARE TRUE, and NEITHER of them is in this repository:
  #
  #   1. `yadgarhq/config`'s `release:` job passes `RELEASE_APP_*` — TRUE AS OF
  #      2026-09-19. Measured, not assumed: every one of the eight chart-bearing
  #      module repositories (`config`, `gateway`, `iam`, `iam-db`, `project`,
  #      `project-db`, `task`, `task-db`) now wires both secrets to its own
  #      `release:` job, `config` last, in its own `config#19`. Both names are
  #      also real organisation secrets visible to `config` — confirmed via
  #      `repos/yadgarhq/config/actions/organization-secrets` — so the wiring
  #      resolves to values rather than the two empty strings this paragraph
  #      used to describe. NOT "so this can no longer happen": the `cred` step
  #      below is the off switch for exactly the case this measurement stops
  #      describing — nothing here gates a NINTH repository, or one of these
  #      eight regressing, omitting them — and its red-not-quiet behaviour is
  #      why the step exists rather than a condition on this list.
  #   2. The release App can push to `yadgarhq/chart`'s `main` past its
  #      ruleset — TRUE AS OF 2026-10-16, measured live. chart's `main`
  #      ruleset (active, created 2026-09-23) requires a pull request and
  #      `ci / passed`, and lists app id 4814165, the release App, as an
  #      `always` bypass actor. That bypass is why this direct write lands;
  #      remove it and every release reds here. By contrast all three rulesets
  #      on `yadgarhq/argocd` carry `bypass_actors: []` since A-U6, so argocd
  #      is no precedent for this.
  #
  # `always()` IS LOAD-BEARING HERE FOR THE SAME REASON IT IS ON `chart`, one
  # hop further down the graph. MEASURED, via the API rather than the UI, on
  # `yadgarhq/config` cutting `v0.1.7`, run 35453443606: `image` concluded
  # `skipped` (no `Containerfile`), `chart` concluded `success`, and `parent`
  # — needing only `chart`, already `success` — concluded `skipped` with
  # ZERO steps, started and completed in the same second. WHY is inferred
  # rather than proven: GitHub does not publish the algorithm behind the
  # admission check it applies to a job whose `if:` carries none of
  # `always()`/`success()`/`failure()`/`cancelled()`, and no offline harness
  # here can execute one to find out. The reading that fits the measurement —
  # the default check is not scoped to `parent`'s own direct `needs:`, and
  # `image` skipping poisoned it two hops away despite `chart` standing
  # between them and concluding `success` — matches a shape GitHub's own
  # runner tracker carries reports of (`actions/runner#2205`). Either way,
  # `always()` is the fix GitHub's docs name for a job that must run when
  # `if:` carries no such function and any needs, direct or not, did not all
  # conclude `success`: it removes the check whatever its exact scope, and
  # the explicit comparison below is what still decides admission afterward.
  #
  # THE REST OF THE CONDITION IS UNCHANGED, and that is deliberate. Unlike
  # `chart` reading `needs.image.result`, `parent` reads `needs.chart.result`
  # for a job it needs DIRECTLY — there is no second, unneeded job to name a
  # fact about instead. A chart that failed or was cancelled still reads
  # `!= 'success'` here, so `always()` widens WHEN this job runs without
  # widening WHAT it accepts: a published chart the parent will never pin
  # still refuses the bump rather than admitting it.
  parent:
    needs: [detect, chart]
    if: >-
      always() && needs.chart.result == 'success'
      && github.repository != 'yadgarhq/chart'
    runs-on: ubuntu-latest
    # A BOUND, BECAUSE THIS JOB RUNS PAST THE POINT OF NO RETURN: the tag is cut
    # and the chart is published, so a wedged read would hold a runner for
    # GitHub's 360-minute default on a release that already shipped. The worst
    # path here is three write attempts with 5s and 10s backoff plus three tag attempts with
    # the same, one token mint and about a dozen `gh api` reads — under two
    # minutes, and nothing polls. Ten leaves five times that as headroom while
    # cutting a wedged read short by a factor of thirty-six.
    timeout-minutes: 10
    steps:
      # THE OFF SWITCH, AND HERE IT IS RED RATHER THAN QUIET. It has to be a step
      # output rather than a condition on the secret, because the `secrets` context
      # is not available in a step-level `if:` — and it is executed by
      # `test_parent_bump.py` rather than read, for the reason `ci-pr.yaml`'s twin
      # gives: a condition on the step can only be asserted as text.
      #
      # LEDGER 580'S RULING, APPLIED TO THE SAME SHAPE. `ci-pr.yaml` reddens when a
      # version was derived and cannot be tagged, because work that was done and
      # cannot be delivered is a failure rather than a skip. By the time this job
      # runs the module chart is published and pullable, and ADR-0722 makes the
      # parent the only thing an adopter installs — so a published chart the parent
      # will never pin is exactly that shape. A quiet note in the summary, which
      # is what the retired `deployment` job wrote for the same missing secrets,
      # is too quiet for this one.
      - name: is the release App configured here
        id: cred
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # BOTH OR NEITHER. An id without a key fails inside the minting action
          # instead of here, which is a red job in place of a named one.
          if [ -n "$CLIENT_ID" ] && [ -n "$APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Published, but the parent chart does NOT pin it"
            echo ""
            echo "This repository publishes a module chart and passes no release"
            echo "App, so the parent chart was not re-pinned and no parent version"
            echo "was cut. ADR-0722 makes the parent the only thing an adopter"
            echo "installs, so this release reaches nobody."
            echo ""
            echo "The repair is one line in this repository's own ci.yaml: the"
            echo "release job must pass RELEASE_APP_CLIENT_ID and"
            echo "RELEASE_APP_PRIVATE_KEY the way its main job already does."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::the parent chart was not re-pinned: no release App is configured for this repository. See the parent job in yadgarhq/actions."
          exit 1

      # SCOPED TO `chart`, AND NOTHING ELSE. A token minted here can write to the
      # parent chart and to no other repository, which keeps it narrower than
      # the App's own organisation-wide grant.
      #
      # `repositories:` ALONE DOES NOTHING — the action makes it conditional on
      # `owner:`, so the two travel together or the default quietly scopes the
      # token to THIS repository, which is the one place it must never write.
      # `permission-contents: write` rather than whatever the installation holds,
      # because zizmor's `github-app` audit fails the blanket form and a later
      # grant to this App would otherwise be picked up silently.
      - name: mint a token that can write to the parent chart and nowhere else
        id: app
        if: steps.cred.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: chart
          permission-contents: write

      # ADR-0981 / ADR-0984: the checkout of `yadgarhq/actions` in this job reads
      # the commit THIS workflow file runs at, never `main`. Read through
      # `fromJSON(toJSON(job))` because actionlint types `job` strictly; checked
      # here, fail-closed, before anything consumes it.
      - name: the actions commit this job runs (ADR-0981)
        id: own_sha
        env:
          OWN_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$OWN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a 40-hex commit SHA: '${OWN_SHA}'. There is no fallback to main (ADR-0981)."
            exit 1
          fi
          echo "sha=${OWN_SHA}" >> "$GITHUB_OUTPUT"
      # THE ONLY CHECKOUT THIS JOB WANTS IS THIS REPOSITORY'S. Nothing here reads
      # the caller's tree — the module's name and version arrive from `detect` as
      # outputs, and the parent's `Chart.yaml` arrives over the API — so the
      # `.ci-actions` idiom the `chart` job uses, with its copy-one-file-then-
      # `rm -rf` dance, buys nothing: that dance exists because `helm package`
      # works on the same workspace. Here the workspace IS the scripts.
      #
      # AT THE WORKFLOW'S OWN COMMIT FOR THE REASON THE OTHER SITES GIVE
      # (ADR-0981): `job.workflow_sha`, measured from a consumer, is the commit
      # of this file as the caller resolved it, so the script and the workflow
      # that calls it are one commit. `github.job_workflow_ref` is an OIDC claim,
      # not an expression.
      - if: steps.cred.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: yadgarhq/actions
          ref: ${{ steps.own_sha.outputs.sha }}

      # A SCRIPT RATHER THAN SHELL, which is this file's own instinct: the chart
      # visibility gate above gives the argument at length, and it is sharper
      # here. `ci-release.yaml` is tag-triggered, so the first execution of any
      # change to it is post-merge in a consumer against a real published chart
      # and a real parent — and what this step does is write to another
      # repository and cut a tag there. The concurrency behaviour, the retries
      # and every refusal are exercised offline by
      # `scripts/tests/test_parent_bump.py` against an argv-dispatching `gh` stub
      # that models the blob sha, so a lost pin is a red test rather than a
      # published parent claiming a set it does not carry.
      - name: pin this release in the parent chart and cut its version
        id: bump
        if: steps.cred.outputs.configured == 'true'
        env:
          # Through the environment, never `${{ }}` inside the script.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          MODULE: ${{ needs.detect.outputs.chartname }}
          VERSION: ${{ needs.detect.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/parent_bump.py

  # ADR-0820'S OTHER HALF: THE EXAMPLES THIS TAG SHIPS PIN SOMETHING PULLABLE.
  # The commit tagged `vN` has examples pinning `vN` (`scripts/example_pins.py`,
  # stamped by whichever job cut the tag), and `vN` does not exist until the
  # `chart` job above pushes it. So a check on the push to `main` can only SKIP
  # a pin newer than anything published — `yadgarhq/chart`'s suite does, with a
  # named reason — and this is where the skipped question is answered, once it
  # can pass: after the publish, anonymously, the way an adopter's Argo CD asks.
  #
  # `scripts/example_published.py` holds the check.
  #
  # `always()` FOR THE REASON `parent` GIVES: `image` is skipped in a chart-only
  # repository, and a skip two hops up drops a job whose `if:` has no status
  # function. In a repository without `example/*.yaml` the script asks the
  # registry nothing and passes.
  examples:
    needs: [detect, chart]
    if: >-
      always() && needs.chart.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ADR-0981 / ADR-0984: the checkout of `yadgarhq/actions` in this job reads
      # the commit THIS workflow file runs at, never `main`. Read through
      # `fromJSON(toJSON(job))` because actionlint types `job` strictly; checked
      # here, fail-closed, before anything consumes it.
      - name: the actions commit this job runs (ADR-0981)
        id: own_sha
        env:
          OWN_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$OWN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a 40-hex commit SHA: '${OWN_SHA}'. There is no fallback to main (ADR-0981)."
            exit 1
          fi
          echo "sha=${OWN_SHA}" >> "$GITHUB_OUTPUT"
      - if: github.repository != 'yadgarhq/actions'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: yadgarhq/actions
          ref: ${{ steps.own_sha.outputs.sha }}
          path: .ci-actions
      - name: every pin the tagged examples carry is anonymously pullable
        env:
          UNDER_RELEASE: ${{ github.repository }}
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$UNDER_RELEASE" = "yadgarhq/actions" ]; then
            dir=scripts
          else
            dir=.ci-actions/scripts
          fi
          python3 "$dir/example_published.py"
