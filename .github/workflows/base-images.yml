# Publishes the two base images of D63.
#
# TAGGED :latest AND :<version>, deliberately both. Module Containerfiles use
# :latest so a toolchain bump does not mean editing sixty-odd files — the same
# reasoning that makes workflow callers track @main. The versioned tag exists for
# anyone who needs to reproduce an old build, and costs nothing to publish
# alongside.
#
# What floats here is the build INPUT. The output is still pinned: D61 has the
# parent chart reference each service image by digest, so a release names exactly
# what runs regardless of which base produced it.
name: base-images

on:
  push:
    branches: [main]
    paths: [containers/**, .github/workflows/base-images.yml]
  # Rebuild weekly. The upstream bases receive security fixes, and an image
  # published once and never rebuilt accumulates every CVE fixed since.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [rust-build, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: version from the date
        id: v
        run: echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: containers/${{ matrix.image }}
          file: containers/${{ matrix.image }}/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.v.outputs.version }}

      # D61: signed with the workflow's own OIDC identity, so there is no key
      # material to hold or rotate.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}"

      # See ci-release.yml for why this exists: a new package is private by
      # default, no API can change it, and nothing else would report it.
      - name: verify an adopter can actually pull this
        run: |
          set -euo pipefail
          REF="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest"
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "Anonymous pull of \`$REF\` works." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Published, but NOT publicly pullable"
            echo ""
            echo "One-time manual step, no API exists:"
            echo "  https://github.com/orgs/${{ github.repository_owner }}/packages/container/${{ matrix.image }}/settings"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::${{ matrix.image }} is not publicly pullable. See the job summary."
          exit 1

      - name: summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo "- \`:latest\` and \`:${{ steps.v.outputs.version }}\`"
            echo "- digest \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
