# THE single entry point for non-release CI. A repository calls this and nothing
# else; what runs is decided here from the event rather than wired up per repo.
#
# Releases are a separate call, and that is a PERMISSIONS BOUNDARY rather than a
# style choice: publishing needs `packages: write` and `id-token: write`, and
# folding it in here would grant both on every pull request.
name: ci

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
    # BOTH OPTIONAL, and that is what makes the release tag INERT until somebody
    # switches it on. A reusable workflow cannot see a caller's secrets unless
    # the caller passes them, so a repository that has not been wired up hands
    # over two empty strings, the `version` job notices, and it reports exactly
    # as it did before. No repository turns red waiting for the App to exist.
    #
    # A private key rather than a token: `actions/create-github-app-token` mints
    # a short-lived installation token per run, so there is no long-lived
    # credential with write access to every tag sitting in an organisation
    # secret. Same argument D61 makes for signing with the workflow identity.
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false

# CONTENTS: READ STAYS, and the tagging step below does not contradict it. The
# App token is NOT `GITHUB_TOKEN`, so this block does not constrain it — which
# is the point rather than a loophole: a tag pushed with a `contents: write`
# `GITHUB_TOKEN` does not trigger another workflow, so the `release` job would
# never fire and the release would silently not happen.
permissions:
  contents: read

# WHAT RUNS WHEN, and the push case is the interesting one.
#
#   pull_request  everything. This is the gate.
#   push to main  the version job ONLY.
#
# Validation on push to main would re-run exactly what the pull request just
# passed, on code already merged, with nobody watching the result. The ruleset
# makes direct pushes impossible, so there is no drift for it to catch. The
# version report is different: it reads main's history since the last tag, which
# a pull request cannot see.
jobs:
  # ONE detection for every job below. It lived in two files before and that is
  # two places for the same logic to drift.
  #
  # DETECTION NARRATES what it found and skipped. Silent magic is
  # unmaintainable; a repository whose CI mysteriously does nothing is the
  # failure being guarded against.
  detect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      proto: ${{ steps.d.outputs.proto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - id: d
        run: |
          set -euo pipefail
          echo "## Detected" >> "$GITHUB_STEP_SUMMARY"
          for pair in "rust:Cargo.toml" "chart:chart" "image:Containerfile" "proto:PROTO_VERSION"; do
            k=${pair%%:*}; f=${pair#*:}
            if [ -e "$f" ]; then
              echo "$k=true" >> "$GITHUB_OUTPUT"
              echo "- **$k**: \`$f\` present" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$k=false" >> "$GITHUB_OUTPUT"
              echo "- $k: no \`$f\` → skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # A DETECTION THAT ANSWERS "no" IS A CHECK SWITCHED OFF, so the "no"
          # has to be true. `proto` is decided by PROTO_VERSION and by nothing
          # else, so deleting or renaming that one file switches the
          # vendored-drift check off while `passed` still reports green — and the
          # vendored copies stay in the tree, matched against nothing. No
          # repository here declares a buf hook, so that job is the whole of
          # D70's enforcement and its absence is visible nowhere.
          #
          # `proto/` IS THE FACT THAT DISCRIMINATES. A repository that genuinely
          # stops vendoring deletes the directory too and skips honestly; one
          # that keeps the directory and loses the pin is the failure above.
          # Swept across all 14 repositories on 2026-09-02: every `proto/` has a
          # PROTO_VERSION beside it, and yadgarhq/proto — the contract itself —
          # has neither, so this assertion needs no exemption list. Starting with
          # one is how a limit stops meaning anything.
          if [ -d proto ] && [ ! -e PROTO_VERSION ]; then
            echo "::error::proto/ is present and PROTO_VERSION is not, so the vendored-drift check would skip and prove nothing. Restore the pin, or delete proto/ if this repository no longer vendors the contract."
            exit 1
          fi

  # ONE definition of "is this repository clean": the hooks. CI installs what
  # they need and runs all of them.
  #
  # This replaced a SKIP list plus a job per tool — two mechanisms for the same
  # checks, kept in agreement by hand. Removing a job silently dropped coverage
  # while CI stayed green; adding a hook broke CI with "Executable not found",
  # which says nothing about the code. Both happened within an hour.
  #
  # It also makes D55's argument true one level up: what a developer runs is
  # exactly what CI runs, not something resembling it.
  precommit:
    needs: detect
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          # gitleaks scans history and `buf breaking` compares against a tag. At
          # the default depth there is neither, and the failure looks like a
          # leaked secret or a broken contract rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # The binary, not gitleaks-action: the action refuses to run for an
      # organisation without a paid licence key, while gitleaks itself is MIT.
      # Only the wrapper is commercial, and the error names the org rather than
      # the action, which makes it easy to misread.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: install hadolint
        env:
          HADOLINT_VERSION: 2.14.0
        run: |
          set -euo pipefail
          sudo curl -sSfL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      # THE actionlint HOOK RAN NOTHING UNTIL THIS STEP EXISTED, then could not
      # FAIL until its entry was fixed, then ran in ONE REPOSITORY until the hook
      # was published. Three defects, closed in that order; this comment has been
      # rewritten at each one and has been wrong twice, so what it claims now is
      # narrow on purpose.
      #
      # UNCONDITIONAL, unlike protoc or cargo-deny, and now consumed wherever it
      # is installed. Every repository has workflows, so there is nothing to
      # detect; and `actionlint` is published in .pre-commit-hooks.yaml, so a
      # repository referencing it gets its workflows linted by the binary this
      # step puts on PATH. Until that publication this install was a no-op in
      # fifteen of sixteen repositories (ledger 620).
      #
      # A CONSUMER IS NOT LINTED UNTIL IT REFERENCES THE HOOK. Publication makes
      # the check available at an immutable tag; it does not switch it on. Each
      # repository adds `- id: actionlint` under the yadgarhq/actions block in
      # its own .pre-commit-config.yaml, and until it does, this step still
      # installs a binary that repository does not run.
      - name: install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint

      # The helm-lint hook shells out to helm, and the precommit job runs every
      # hook with no SKIP list — so the tool has to be here or the hook fails for
      # the wrong reason.
      #
      # THE VERSION USED TO BE WHATEVER THE NETWORK ANSWERED WITH, and that was
      # measured rather than inferred: with no `version:` input this action asks
      # get.helm.sh for the latest release at run time and falls back to a
      # hardcoded v3.18.4 when the fetch fails. In yadgarhq/iam run 33968099875
      # it installed v4.2.4 for this job and v3.18.4 for `portability` — two helm
      # majors inside one CI run, so any check whose result depends on helm was
      # not reproducible. `--strict` was checked against BOTH majors on the
      # estate's charts, so the variance did not decide that hook's result. It
      # could have decided a future one.
      #
      # v3.18.4 IS ARGO'S HELM, and that is what picks the number rather than
      # "newest" or "whatever the fallback happens to be". The estate runs Argo
      # CD v3.1.8, whose hack/tool-versions.sh at that tag reads
      # helm3_version=3.18.4 — so this pin makes the linter and the renderer the
      # same program. The helm-lint hook exists to catch what Argo would reject,
      # and grading a chart with a helm the cluster never runs answers a
      # different question from the one being asked.
      #
      # MAINTENANCE TRIGGER, named so this does not quietly rot: when Argo CD's
      # bundled helm changes, this pin follows it. The explicit version also
      # removes the network from the decision — getLatestHelmVersion() is never
      # called, so neither the fetch nor its hardcoded fallback can apply.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      # protoc, for repositories that generate types from the contract (D16).
      # Gated on the same PROTO_VERSION detection as the drift check, so a repo
      # with no protos does not pay for it. Without this, build.rs fails with
      # "Could not find `protoc`" — which reads as a broken build rather than a
      # missing tool.
      - name: install protoc
        if: needs.detect.outputs.proto == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # BOTH packages. protobuf-compiler ships only /usr/bin/protoc;
          # libprotobuf-dev ships google/protobuf/*.proto under /usr/include —
          # the well-known types `buf export` deliberately omits because protoc
          # is expected to supply them. Verified in an ubuntu:24.04 container:
          # after protobuf-compiler alone, timestamp.proto is ABSENT.
          #
          # Without the second package the build fails with
          # "google/protobuf/timestamp.proto: File not found", which reads as a
          # broken contract rather than a missing package.
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: needs.detect.outputs.rust == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.detect.outputs.rust == 'true'

      - name: install cargo-deny
        if: needs.detect.outputs.rust == 'true'
        env:
          CARGO_DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/cargo-deny'

      # No SKIP. Every hook the repository declares runs here.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # NOT hook-covered, and that is the line: pre-commit owns what pre-commit can
  # define. These need a runner and network, so they are jobs.
  workflows:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
        run: |
          set -euo pipefail
          # The policy IS the decision, written where a tool checks it. A tag
          # somebody else owns can move without warning, so third-party actions
          # are hash-pinned; @main here is ours and gated, which is what lets one
          # fix reach every repository without editing each one.
          cat > /tmp/zizmor.yml <<'ZIZ'
          rules:
            unpinned-uses:
              config:
                policies:
                  "yadgarhq/*": ref-pin
                  "*": hash-pin
          ZIZ
          pipx run "zizmor==${ZIZMOR_VERSION}" \
            --no-online-audits --persona=regular --config /tmp/zizmor.yml .

  vulnerabilities:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # The template is checked, not suggested. A template nobody fills in is a
  # template that does not exist, and nothing else would notice.
  #
  # BOTS ARE EXEMPT and must be. Dependabot writes its own body and cannot be
  # taught this template; without the exemption every dependency update is
  # blocked forever by a check it is structurally unable to satisfy, which turns
  # the update mechanism off silently.
  template:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: the pull request body must follow the template
        env:
          # Through the environment, never interpolated into the script. A pull
          # request body is attacker-controlled text and `${{ }}` inside a run
          # block is a shell injection — the class zizmor audits for.
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          REQUIRED = ["What", "Why", "Changelog", "Verification", "Risk"]

          # Conventional Commits. The changelog bullets are what a version bump
          # will eventually be derived from, so the format is load-bearing rather
          # than cosmetic — a bullet nobody can parse is a release nobody can
          # version.
          TYPES = "build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test"
          BULLET = re.compile(
              rf"^\s*[-*]\s+(?P<type>{TYPES})(?P<scope>\([^)]+\))?(?P<bang>!)?:\s+(?P<desc>\S.*)$"
          )

          body = os.environ.get("BODY") or ""
          stripped = re.sub(r"<!--.*?-->", "", body, flags=re.S)

          sections, current = {}, None
          for line in stripped.splitlines():
              h = re.match(r"^\s*#{1,6}\s+(.+?)\s*$", line)
              if h:
                  current = h.group(1).strip()
                  sections[current] = []
              elif current:
                  sections[current].append(line)

          problems = []
          for h in REQUIRED:
              if h not in sections:
                  problems.append(f"missing section `## {h}`")
              elif not any(l.strip() for l in sections[h]):
                  problems.append(f"`## {h}` is empty (comments are not an answer)")

          if "Changelog" in sections and any(l.strip() for l in sections["Changelog"]):
              lines = [l for l in sections["Changelog"] if l.strip()]
              bad = [l.strip() for l in lines if not BULLET.match(l)]
              if bad:
                  problems.append(
                      "every Changelog line must be a Conventional Commits bullet, "
                      "e.g. `- fix: a metadata leak in the audit relay`. Offending: "
                      + "; ".join(f"`{b[:60]}`" for b in bad[:4])
                  )
              else:
                  bumps = []
                  for l in lines:
                      m = BULLET.match(l)
                      if m.group("bang"):
                          bumps.append("major")
                      elif m.group("type") == "feat":
                          bumps.append("minor")
                      else:
                          bumps.append("patch")
                  bump = "major" if "major" in bumps else "minor" if "minor" in bumps else "patch"
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                      fh.write(f"### Changelog parsed\n\n{len(lines)} entries, implying a **{bump}** bump.\n")

          if not problems:
              print("Pull request body follows the template.")
              sys.exit(0)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### Pull request body does not follow the template\n\n")
              for p in problems:
                  fh.write(f"- {p}\n")
              fh.write("\nThe template is in `.github/pull_request_template.md`.\n")
          print("::error::" + "; ".join(problems))
          sys.exit(1)
          PY

  # A REAL ENGINE, not a mock. D69's capability probe establishes what an engine
  # can do by executing against it, so a test suite with no engine cannot
  # exercise the one thing that can be wrong. A `-db` repo's tests without a
  # database pass in 0.00s and prove the logic around the gap, never the gap.
  #
  # The service runs for every Rust repo rather than only the ones that use it.
  # Detecting "does this repo need a database" means a signal each repo has to
  # set and keep correct, and the failure is silent: forget it, and the suite
  # goes back to passing without an engine. ~20 seconds on a repo that ignores
  # it is the cheaper side of that trade (D62 — the shared workflow detects what
  # a repo IS, and every Rust repo here is a candidate).
  #
  # Pinned by digest, never by tag (D61). 11.8 is the first LTS carrying the
  # VECTOR type the probe checks for.
  test:
    needs: detect
    if: github.event_name != 'push' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3 # 11.8
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=12
      # THE SHARED CACHE (D21), for the same reason MariaDB is here: a test that
      # can only run against a real server is a test that does not run.
      #
      # Unconditional, and NOT detected per repository. Detection is the signal
      # that goes stale silently — a repository that gains a Valkey-backed test
      # would go green having measured nothing until somebody remembered to
      # update the detection, which is the failure this job exists to catch. A
      # service container nobody connects to costs a couple of seconds and
      # nothing else.
      #
      # gateway is the first consumer: D74's token buckets are read-compute-write
      # against this cache, and the race they exist to prevent appears only under
      # concurrent callers against a real server. Its suite FAILS on a runner when
      # YADGAR_TEST_VALKEY is unset rather than skipping, so without this the one
      # defect that module exists to prevent has no automated coverage at all.
      valkey:
        image: valkey/valkey@sha256:a91d34ab33975b1054e26f1bd9995b268f7e0c507b5ded7f3d181a1a25521630 # 9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      YADGAR_TEST_DSN: mysql://root:ci@127.0.0.1:3306/ci
      YADGAR_TEST_VALKEY: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      # protoc, for repositories that generate types from the contract (D16).
      # Gated on the same PROTO_VERSION detection as the drift check, so a repo
      # with no protos does not pay for it. Without this, build.rs fails with
      # "Could not find `protoc`" — which reads as a broken build rather than a
      # missing tool.
      - name: install protoc
        if: needs.detect.outputs.proto == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # BOTH packages. protobuf-compiler ships only /usr/bin/protoc;
          # libprotobuf-dev ships google/protobuf/*.proto under /usr/include —
          # the well-known types `buf export` deliberately omits because protoc
          # is expected to supply them. Verified in an ubuntu:24.04 container:
          # after protobuf-compiler alone, timestamp.proto is ABSENT.
          #
          # Without the second package the build fails with
          # "google/protobuf/timestamp.proto: File not found", which reads as a
          # broken contract rather than a missing package.
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-features

      # THE OTHER HALF OF THE FEATURE SPACE. `--all-features` turns everything
      # on, so every feature-gated off-path is compiled by nothing — and the
      # `cargo-clippy` hook is `--all-targets --all-features` too, so no gate in
      # this estate looks at the off-build at all.
      #
      # THE FAILURE THIS EXISTS FOR IS CONCRETE, not a category. `yadgar-lifecycle`
      # gates its rotation watcher behind a default-on `rotate` feature, and
      # `iam-db` and `task-db` take `default-features = false` to shed the 38
      # crates that feature carries. A change making the UNGATED `src/drain.rs`
      # reach for `sha2` — a `rotate`-only dependency — passes `cargo test
      # --all-features` AND `cargo clippy --all-targets --all-features -- -D
      # warnings`, and breaks the first consumer that turns the watcher off.
      # Reproduced in a scratch checkout of that repository: both gates exit 0,
      # this step exits 101 with `error[E0432]: unresolved import `sha2``.
      #
      # `yadgar-telemetry` is the same hole pointing the other way. Its `grpc`
      # feature is off by default, so `--all-features` builds the one
      # configuration no plain consumer links and the DEFAULT build is the
      # untested one. `--no-default-features` is that build, so one command
      # covers both repositories.
      #
      # TWO COMMANDS ARE THE WHOLE POWERSET HERE rather than a corner of it:
      # both crates declare exactly one feature, so {} and {everything} is every
      # subset there is. `cargo hack --feature-powerset` would run these same two
      # builds after installing a tool to work that out.
      #
      # CONDITIONAL, AND THAT IS THE COST ARGUMENT. Eight of the ten Rust
      # repositories here declare no feature, where this recompiles nothing and
      # merely RE-RUNS the whole suite against the MariaDB and Valkey above —
      # runner minutes for no added coverage, and twice the flake surface.
      # Measured where it does run: 3.6s at `-j 4` on top of a warm
      # `--all-features` target. `cargo check --no-default-features
      # --all-targets` is NOT the cheaper choice — in the same position it costs
      # 19.5s of CPU against this step's 9.5s, because a check pipeline shares
      # no artifacts with the test build it follows.
      #
      # The predicate reads `cargo metadata`, never a list of repositories: one
      # that gains a feature is covered the day it gains it, with nothing to
      # remember. `--no-deps` resolves nothing and compiles nothing, so it costs
      # milliseconds and needs no network.
      - name: cargo test --no-default-features (the feature-off build)
        run: |
          set -euo pipefail
          # NOT `jq -e`. A jq that errors, a jq that is absent and a genuine
          # "no features" would all read as false, which builds a check that
          # cannot fail. `pipefail` plus `set -e` makes the first two abort
          # loudly and leaves the third as the only way to skip.
          feats=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].features | to_entries[]
                      | select(.key != "default" or (.value | length > 0))
                      | .key] | unique | join(", ")')
          if [ -z "$feats" ]; then
            echo "- no package declares a feature, so \`--no-default-features\` would rebuild exactly what \`--all-features\` just tested → skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- features declared (\`$feats\`) → running \`cargo test --no-default-features\`" >> "$GITHUB_STEP_SUMMARY"
          cargo test --no-default-features

  # D70: a consumer VENDORS the protos it needs at a pinned tag. Vendoring is
  # normally skew waiting to happen, and it is defensible here ONLY because of
  # this check — re-export at the pin, diff, fail. Delete it and D70 becomes the
  # bad idea it resembles.
  #
  # DRIFT ONLY, never breaking-change detection. `buf breaking` belongs in
  # yadgarhq/proto, gated against the previous tag (D16), and nowhere else: a
  # vendored subset has no meaningful previous tag of its own, and a second gate
  # in each of ~61 repositories would be weaker than the real one while looking
  # like a substitute for it. This job answers exactly one question — does the
  # vendored copy match the pin?
  proto:
    needs: detect
    if: needs.detect.outputs.proto == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - name: the vendored protos must match PROTO_VERSION
        run: |
          set -euo pipefail
          PIN=$(tr -d '[:space:]' < PROTO_VERSION)
          echo "Pinned at \`$PIN\`." >> "$GITHUB_STEP_SUMMARY"

          # --path arguments come from the repo, so a module vendors only what it
          # implements or calls. buf closes the import graph itself: exporting
          # yadgar/task/v1 also emits yadgar/common/v1, verified 2026-08-30.
          mapfile -t PATHS < <(grep -v '^\s*#' PROTO_PATHS | grep -v '^\s*$')
          ARGS=()
          for p in "${PATHS[@]}"; do ARGS+=(--path "$p"); done

          rm -rf /tmp/proto-expected
          buf export "https://github.com/yadgarhq/proto.git#tag=${PIN}" \
            "${ARGS[@]}" -o /tmp/proto-expected

          if diff -r proto /tmp/proto-expected; then
            echo "Vendored protos match the pin." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Vendored protos do not match \`$PIN\`"
            echo ""
            echo "Refresh them:"
            echo ""
            echo '```'
            echo "make proto"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::proto/ has drifted from PROTO_VERSION. See the job summary."
          exit 1

      # TASK 513. The step above asks "does the vendored copy match the pin"; it
      # cannot ask "is the pin still current", because the pin is its own
      # baseline. Nothing anywhere flagged that `task` sat on `v1.2.0` while
      # `proto` was tagged `v1.6.0`.
      #
      # REPORT ONLY, NEVER A FAILURE. Please read this before turning it into a
      # gate: being behind is a CHOICE until somebody bumps it — a newer tag
      # adding an RPC this module does not call is not a defect in this module —
      # and a hard failure would turn every repository here red the moment
      # `proto` is tagged. It also needs the network and a remote tag listing,
      # and a gate that fails when a third party is unreachable fails for reasons
      # unrelated to the change under review. Derive and REPORT — unlike the
      # version job below, which now writes the tag it derives.
      #
      # It compares CONTENTS, not version strings, and splits the answer three
      # ways. `buf export` follows the import graph, so a newer tag can reach a
      # file the pin's closure never had — `gateway/PROTO_PATHS` documents that
      # happening at v1.6.0, where `yadgar/iam/v1` began importing
      # `yadgar/telemetry/v1`. A flat `diff -r` calls that drift and reads
      # alarming. Only a file present in BOTH closures and differing is a change
      # to a contract this module already vendors.
      - name: is the proto pin still current?
        run: |
          python3 - <<'PP'
          import os, re, subprocess, sys, pathlib, filecmp, traceback

          # TASK 513: nothing flagged that a repository's PROTO_VERSION had fallen behind
          # the tag `proto` actually carries. The existing drift job answers "does the
          # vendored copy match the pin"; it cannot answer "is the pin still current",
          # because the pin is its own baseline.
          #
          # REPORT ONLY, NEVER A FAILURE, and that is deliberate rather than timid:
          #
          #   * Being behind is a CHOICE until somebody bumps it. A newer tag adding an
          #     RPC this module does not call is not a defect in this module, and failing
          #     on it would turn every repository here red the moment `proto` is tagged.
          #   * It needs the network and a remote tag listing. A hard gate that depends on
          #     a third party being reachable fails for reasons that have nothing to do
          #     with the change under review.
          #
          # The version job DERIVES AND WRITES now; this one still only reports,
          # and the difference is whose repository the answer is about. A version
          # is a statement about this repository, decided by this repository's
          # own merged history. A proto pin being behind is a statement about
          # `yadgarhq/proto`, and nothing here is entitled to act on that.
          # Please do not "fix" this into a hard failure without reading the above.
          #
          # "NEVER A FAILURE" IS MADE STRUCTURAL, not merely intended. Every enumerated
          # path exits 0, AND the whole body runs inside a try/except that turns an
          # unexpected exception into a report as well. Without that last part the promise
          # holds only for the failures somebody thought of — and a traceback here would
          # redden `proto`, and through it `passed`, in a repository whose change had
          # nothing to do with protos.

          PROTO_REPO = "https://github.com/yadgarhq/proto.git"
          out, warnings = [], []


          def w(line=""):
              out.append(line)


          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True)


          def semver(tag):
              m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(int(x) for x in m.groups()) if m else None


          def report():
              pin = pathlib.Path("PROTO_VERSION").read_text().strip()

              # A PIN THIS STEP CANNOT ORDER. `semver()` returns None for anything that is
              # not `vN.N.N` — a bare `1.6.0`, a branch name, a commit. Comparing None to
              # a tuple raises, and the traceback would redden a job that promises not to
              # fail. The drift check above still validates such a pin; only the
              # is-it-current question needs an ordering.
              if semver(pin) is None:
                  w(f"`PROTO_VERSION` is `{pin}`, which is not a `vN.N.N` tag.")
                  w()
                  w(
                      "This step orders tags to say whether the pin is behind, and it has "
                      "no ordering for that value. The drift check above still verifies "
                      "the vendored copy against it."
                  )
                  return

              r = sh("git", "ls-remote", "--tags", "--refs", PROTO_REPO, "v*")
              tags = [t for t in re.findall(r"refs/tags/(\S+)", r.stdout) if semver(t)]

              if r.returncode != 0 or not tags:
                  w(f"Could not list tags on `{PROTO_REPO}`, so there is nothing to compare.")
                  return

              latest = max(tags, key=semver)
              if latest == pin:
                  w(
                      f"`PROTO_VERSION` is `{pin}`, which is the newest tag on `proto`. "
                      f"Nothing to report."
                  )
                  return

              w(f"`PROTO_VERSION` is **`{pin}`**; `proto` is tagged **`{latest}`**.")
              w()

              if semver(latest) < semver(pin):
                  w("The pin is AHEAD of every tag this job can see, which is stranger")
                  w("than being behind: it names something `proto` has not published.")
                  warnings.append(f"PROTO_VERSION {pin} is ahead of the newest proto tag {latest}")
                  return

              paths = [
                  l.strip()
                  for l in pathlib.Path("PROTO_PATHS").read_text().splitlines()
                  if l.strip() and not l.strip().startswith("#")
              ]
              args = []
              for p in paths:
                  args += ["--path", p]

              for tag, dest in ((pin, "/tmp/pp-pin"), (latest, "/tmp/pp-latest")):
                  sh("rm", "-rf", dest)
                  e = sh("buf", "export", f"{PROTO_REPO}#tag={tag}", *args, "-o", dest)
                  if e.returncode != 0:
                      w(f"`buf export` at `{tag}` failed, so the contents were not compared:")
                      w()
                      w("```")
                      w(e.stderr.strip()[:800])
                      w("```")
                      return

              def tree(root):
                  base = pathlib.Path(root)
                  return {str(p.relative_to(base)) for p in base.rglob("*") if p.is_file()}

              a, b = tree("/tmp/pp-pin"), tree("/tmp/pp-latest")
              # THREE BUCKETS, because two of them are not drift. `buf export` follows the
              # import graph, so a newer tag can pull in a file the pin's closure never
              # had — gateway/PROTO_PATHS documents exactly that happening at v1.6.0,
              # where yadgar/iam/v1 began importing yadgar/telemetry/v1. A flat `diff -r`
              # reports that as drift and reads alarming. Only files present in BOTH and
              # differing are a change to a contract this module already vendors.
              changed = sorted(
                  f
                  for f in a & b
                  if not filecmp.cmp(f"/tmp/pp-pin/{f}", f"/tmp/pp-latest/{f}", shallow=False)
              )
              added, dropped = sorted(b - a), sorted(a - b)

              w("What the newer tag would change **in this module's own closure**:")
              w()
              w("| bucket | files | means |")
              w("| --- | --- | --- |")
              w(
                  f"| contract drift | {len(changed)} | a file this module already "
                  f"vendors, whose text differs |"
              )
              w(
                  f"| closure growth | {len(added)} | a file `buf export` reaches "
                  f"only at the newer tag, because an import was added upstream |"
              )
              w(
                  f"| closure shrink | {len(dropped)} | a file the newer closure no "
                  f"longer reaches |"
              )
              w()
              for label, files in (
                  ("Contract drift", changed),
                  ("Closure growth", added),
                  ("Closure shrink", dropped),
              ):
                  if files:
                      w(f"**{label}:** " + ", ".join(f"`{f}`" for f in files))
                      w()

              if changed:
                  warnings.append(
                      f"PROTO_VERSION is {pin} while proto is tagged {latest}, and "
                      f"{len(changed)} vendored file(s) differ between them: "
                      + ", ".join(changed)
                  )
                  w(
                      "**The pin being behind is not harmless here.** The files above "
                      "differ, so this module is built against an older text of a "
                      "contract that has since been changed. Read the diff, then bump "
                      "`PROTO_VERSION` and re-run `make proto`."
                  )
              else:
                  warnings.append(
                      f"PROTO_VERSION is {pin} while proto is tagged {latest}; no "
                      f"vendored file differs, so the pin is behind but harmless today"
                  )
                  w(
                      "**Behind, but harmless today** — no file this module vendors "
                      "differs between the two tags. That is a fact about these tags, "
                      "not a guarantee about the next one."
                  )
              w()


          w("## Proto pin (task 513) — reported, never enforced")
          w()
          try:
              report()
          except Exception:
              # The promise is structural, so an unhandled error is REPORTED rather than
              # raised. Loudly, because a step that quietly measures nothing is the
              # failure this whole change exists to argue against.
              w("This step hit an unexpected error and reported it instead of failing:")
              w()
              w("```")
              w(traceback.format_exc().strip()[:1500])
              w("```")
              warnings.append("the proto pin step errored; see the job summary")
          w()
          w("Nothing was bumped. This step reports; a human decides (D64).")

          summary = "\n".join(out)
          sp = os.environ.get("GITHUB_STEP_SUMMARY")
          if sp:
              with open(sp, "a") as fh:
                  fh.write(summary + "\n")
          print(summary)
          for m in warnings:
              print("::warning::" + m)
          sys.exit(0)
          PP

  # D80 IS AN INVARIANT, and until now it was held by review — the weak form,
  # which the decision record says out loud rather than claiming a gate it did
  # not have. An invariant enforced by attention decays exactly when attention is
  # scarce. This is the gate.
  #
  # WHAT IT ENFORCES, in one sentence: every resource a module chart renders that
  # needs a CRD can be switched off by a value.
  #
  # NOT "the defaults emit no CRDs". That formulation was drafted first and is
  # WRONG — it contradicts D80 in the same breath as enforcing it. D80's "what it
  # still permits" names Gateway API explicitly, because it is a specification
  # with several conformant implementations rather than a product, and D71 chose
  # it for exactly that reason. A gate failing `gateway` for rendering an
  # HTTPRoute would enforce a rule nobody wrote, and would force the reference
  # deployment's route off to satisfy it.
  #
  # The property that matters to an adopter is INSTALLABILITY ON A BARE CLUSTER,
  # not the absence of opinion. So the job renders the chart twice — once at its
  # defaults, once with every values key named `enabled` set to false — and
  # requires the second render to contain nothing outside the built-in Kubernetes
  # API groups. A real test with a real failure mode, rather than a substring
  # search that passes vacuously the moment somebody uses a name it was never
  # told about. This organisation already has two of those on record.
  #
  # An ALLOWLIST of built-in groups, never a denylist of CRD groups, for the same
  # reason: an unknown group is treated as CRD-bearing, so the unknown case fails
  # safe instead of passing silently.
  #
  # The job also says which resources the DEFAULTS ask an adopter to install, and
  # whether each name is a specification or a product, and why. A gate whose rule
  # nobody can reconstruct from its output is the vacuous kind again.
  #
  # IT DOES NOT CHECK the highest-severity class — whether a security control
  # rests on an undeclared environment default — and it says so in its own
  # output. No grep finds that. It is a question for a human and it is in the
  # pull request template's `## Risk` section.
  portability:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      # The same TWO pins the precommit job uses — the action's SHA and the helm
      # version it installs — rather than a second pair to keep in step with it.
      # This job renders every chart and reads the result, so it is the job the
      # version divergence hit: run 33968099875 gave it v3.18.4 while precommit
      # got v4.2.4. The reasoning for v3.18.4 is above the precommit copy.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # Rendered manifests are parsed rather than grepped, so a `kind:` inside a
      # string or a comment cannot be mistaken for a resource. PyYAML is not in
      # the standard library and is not guaranteed on the runner; the version is
      # pinned for the same reason every other tool here is.
      - name: install PyYAML
        run: pip install --disable-pip-version-check "pyyaml==6.0.3"
      # THE GATE IS A CHECKED-IN SCRIPT, and getting it onto the runner takes a
      # SECOND CHECKOUT in every repository but this one. `ci-pr.yaml` is a
      # reusable workflow: the checkout above is the CALLING repository, so
      # nothing from `yadgarhq/actions` is on disk.
      #
      # WHY `main` AND NOT THE REF THIS WORKFLOW WAS CALLED AT: there is no way
      # to ask. `github.job_workflow_ref` is documented as an OIDC token claim
      # and renders EMPTY as an expression — actionlint says the property does
      # not exist, and a run on this repository's own pull request confirmed it.
      # `@main` is what every consumer pins the workflow at, so the script and
      # the workflow that calls it move together.
      - if: github.repository != 'yadgarhq/actions'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: yadgarhq/actions
          ref: main
          path: .ci-actions

      - name: stage the gate, then restore the tree
        env:
          # Through the environment, never `${{ }}` inside the script.
          UNDER_REVIEW: ${{ github.repository }}
        run: |
          set -euo pipefail
          # THIS REPOSITORY REVIEWS ITSELF FROM ITS OWN CHECKOUT, which is what
          # `ci-self.yaml` exists for: a change to a shared workflow must be
          # tested by the version in the pull request. Taking the gate from
          # `main` here would test the merged copy and defeat that. The test is
          # the repository NAME rather than whether the file happens to be
          # present, so that no repository under review can supply its own gate.
          if [ "$UNDER_REVIEW" = "yadgarhq/actions" ]; then
            src=scripts/d80_portability.py
          else
            src=.ci-actions/scripts/d80_portability.py
          fi
          if [ ! -f "$src" ]; then
            echo "::error::the D80 gate is missing at $src"
            exit 1
          fi
          cp "$src" "$RUNNER_TEMP/d80_portability.py"
          # THE SECOND CHECKOUT IS DELETED BEFORE THE GATE RUNS. The gate walks
          # `.` for source-tree tripwires and `actions/checkout` can only write
          # inside the workspace, so leaving it there would scan THIS
          # repository's files as if they belonged to the one under review.
          rm -rf .ci-actions
          echo "D80 gate staged from \`$src\`." >> "$GITHUB_STEP_SUMMARY"

      - name: nothing shipped may depend on the environment it runs inside (D80)
        env:
          # Through the environment, never `${{ }}` inside the script — the
          # habit zizmor audits for, kept even where the value is trustworthy.
          D80_REPO: ${{ github.repository }}
        run: python3 "$RUNNER_TEMP/d80_portability.py"

  # PHASE 3 OF VERSIONING: derive the next version AND cut the tag for it.
  #
  # The squash-merge decision already did the hard half — the pull request body
  # becomes the commit message, so the Changelog bullets are in main's history,
  # one commit per change. There is no separate state to maintain: the history
  # IS the changelog.
  #
  # WHAT IS STILL NOT AUTOMATED, because D64's line is only half moved: nothing
  # here edits `Cargo.toml` or `Chart.yaml` and nothing opens a pull request.
  # The tag is the one write, and it is the write the `release` job keys on.
  #
  # WHY A TAG WRITTEN HERE RATHER THAN A MARKETPLACE ACTION. This organisation's
  # parser reads N Changelog bullets in ONE squash commit as N changes and takes
  # the highest. Every off-the-shelf Conventional Commits release tool reads one
  # commit as one change, from a subject line nothing in this file validates —
  # the pull request TITLE is checked nowhere. No configuration reconciles those
  # two readings, so a second parser would derive a version from data that has
  # passed no gate.
  #
  # WHY `gh api` RATHER THAN `git push`. Every checkout in this file sets
  # `persist-credentials: false`, so there is no credential in the local git
  # config to push with, and turning it back on to tag would defeat exactly what
  # that setting is there for.
  #
  # THE TAG IS PERMANENT AND THE RULESET MAKES IT SO. `release-tags` blocks
  # `deletion`, `update` and `non_fast_forward` on `refs/tags/v*` with no bypass
  # actors, and has no `creation` rule — so this needs no exception to write a
  # tag, and NOBODY can withdraw or move one it gets wrong. Swept 2026-09-03:
  # 13 of the 14 repositories carry it. `docs` is private on a plan where
  # rulesets are unavailable, so a mistake THERE is recoverable and nowhere else
  # is. Every guard below is built for the other thirteen: writing NO tag is
  # always the cheaper mistake, so each check refuses rather than guesses.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needs tags and history to know what has happened since the last one.
          fetch-depth: 0

      # THE DERIVATION, and its output is now a tag rather than a sentence, so
      # every path that cannot be certain writes an EMPTY `next` and the tagging
      # step below skips. There is no default and no best guess.
      - name: what the next version is
        id: v
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout.strip()

          TYPES = "build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test"
          BULLET = re.compile(
              rf"^\s*[-*]\s+(?P<type>{TYPES})(?P<scope>\([^)]+\))?(?P<bang>!)?:\s+(?P<desc>\S.*)$"
          )
          # A BASELINE THIS REFUSES TO COUNT FROM, rather than one it mangles.
          # `yadgarhq/yadgar` carries `v0.1.0a6` (ADR-0498's prerelease), and
          # `int("0a6")` raised — which merely reddened a report before and would
          # now stand between a merge and its release. Anything that is not a
          # plain `vMAJOR.MINOR.PATCH` yields no version at all.
          SEMVER = re.compile(r"^v([0-9]+)\.([0-9]+)\.([0-9]+)$")

          last = sh("git", "describe", "--tags", "--abbrev=0", "--match", "v*")
          rng = f"{last}..HEAD" if last else "HEAD"
          log = sh("git", "log", rng, "--format=%B%x00")

          entries, bumps = [], []
          for commit in [c for c in log.split("\0") if c.strip()]:
              for line in commit.splitlines():
                  m = BULLET.match(line)
                  if not m:
                      continue
                  entries.append(line.strip())
                  if m.group("bang"):
                      bumps.append("major")
                  elif m.group("type") == "feat":
                      bumps.append("minor")
                  else:
                      bumps.append("patch")

          base = SEMVER.match(last) if last else None
          nxt, note = "", ""
          out = ["## Next version", ""]
          if not last:
              out += ["No `v*` tag yet, so there is no baseline to compute from.",
                      "The first tag of a repository is cut by hand; every one",
                      "after it is derived from the Changelog."]
          elif not base:
              out += [f"`{last}` is not a plain `vMAJOR.MINOR.PATCH` tag, so there",
                      "is no baseline this can count from and nothing was tagged.",
                      "Cut a plain one by hand to start the sequence again."]
          elif not entries:
              out += [f"No parseable Changelog entries since `{last}`. Nothing to release."]
          else:
              bump = "major" if "major" in bumps else "minor" if "minor" in bumps else "patch"
              major, minor, patch = (int(g) for g in base.groups())

              # PRE-1.0 IS NOT THE SAME RULE, and getting it wrong publishes a
              # "compatible" version that is not. Under 0.x a breaking change
              # bumps MINOR and a feature bumps PATCH.
              if major == 0:
                  nxt = f"0.{minor + 1}.0" if bump == "major" else f"0.{minor}.{patch + 1}"
                  note = f"pre-1.0: a `{bump}` change bumps "
                  note += "minor" if bump == "major" else "patch"
              else:
                  nxt = {"major": f"{major + 1}.0.0",
                         "minor": f"{major}.{minor + 1}.0",
                         "patch": f"{major}.{minor}.{patch + 1}"}[bump]
                  note = f"{bump} bump"

              out += [f"`{last}` → **`v{nxt}`**  ({note})", "",
                      f"{len(entries)} entries since `{last}`:", ""]
              out += [f"- {e.lstrip('-* ')}" for e in entries[:25]]
              if len(entries) > 25:
                  out += [f"", f"...and {len(entries) - 25} more."]

          tmp = os.environ["RUNNER_TEMP"]
          if nxt:
              # THE TAG MESSAGE IS WRITTEN HERE because this is the only step
              # that knows what the number was derived FROM, and the ruleset
              # makes an annotated tag's message the permanent record of it.
              # Every entry, not the summary's first 25 — a truncated record of
              # a release cannot be un-truncated later.
              msg = [f"v{nxt}", "",
                     f"{note.replace('`', '')}, from {len(entries)} Changelog "
                     f"entries since {last}.", ""]
              msg += [f"- {e.lstrip('-* ')}" for e in entries]
              with open(f"{tmp}/tag_message.txt", "w") as fh:
                  fh.write("\n".join(msg) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"next={nxt}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")
          print("\n".join(out))
          PY

      # BELT AND BRACES rather than the primary defence. A HEAD that already
      # carries a tag also has an empty `last..HEAD`, so the step above would
      # already have produced no version — but a re-run of this job on a tagged
      # commit is exactly the shape that writes a wrong tag, and the ruleset
      # will not let one be withdrawn. Two independent reasons to skip is the
      # right price.
      #
      # NOT VACUOUS: the checkout above is `fetch-depth: 0`, which
      # `actions/checkout` fetches with `+refs/tags/*:refs/tags/*`, so the tags
      # are on disk. With a shallow clone this guard would silently pass for
      # every commit.
      - name: is HEAD already released
        id: g
        run: |
          set -euo pipefail
          if git describe --tags --exact-match --match 'v*' HEAD >/dev/null 2>&1; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "_HEAD already carries a tag; nothing to cut._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      # THE OFF SWITCH, and it has to be a step output rather than a condition
      # on the secret: the `secrets` context is not available in a step-level
      # `if:`. A repository whose caller passes nothing gets two empty strings
      # here, reports it, and skips — which is how this ships into every
      # repository before the App behind it exists.
      - name: is the release App configured here
        id: cred
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # BOTH OR NEITHER. An id without a key fails inside the minting action
          # instead of here, which is a red job in place of a skipped step.
          if [ -n "$CLIENT_ID" ] && [ -n "$APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "_No release App is configured for this repository, so nothing was tagged. See the version job in \`yadgarhq/actions\`._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # A SHORT-LIVED INSTALLATION TOKEN, minted per run and expiring in an
      # hour. Hash-pinned with the version in a comment because it is somebody
      # else's repository however first-party it is — the `"*": hash-pin` policy
      # the `workflows` job enforces.
      #
      # `client-id` RATHER THAN `app-id`: the action carries a deprecationMessage
      # on `app-id` at this pin, reading "Use 'client-id' instead."
      #
      # A CLIENT ID IS NOT SECRET and the action's own README passes it as a
      # repository VARIABLE. It travels as a secret here because a reusable
      # workflow has a passthrough for secrets and none for variables, so a
      # variable set on a caller would arrive empty and silently switch the tag
      # off. One mechanism for both values, and the guard above can then test
      # both the same way.
      - name: mint the token that cuts the tag
        id: app
        if: steps.cred.outputs.configured == 'true' && steps.g.outputs.tagged == 'false' && steps.v.outputs.next != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # NARROWED TO THE ONE PERMISSION A TAG NEEDS, rather than inheriting
          # whatever the installation happens to hold — zizmor's `github-app`
          # audit fails the blanket form, and it is right to. The App may later
          # be granted something else for another purpose; this token would pick
          # that up silently. Scoped to THIS repository by the action's default.
          permission-contents: write

      # TWO CALLS, NOT ONE. `POST /git/refs` on its own makes a LIGHTWEIGHT tag:
      # a name pointing at a commit, with no message, no tagger and no date of
      # its own. The tag object is created first so the permanent record of what
      # this version contains travels with the tag itself.
      - name: tag it
        if: steps.cred.outputs.configured == 'true' && steps.g.outputs.tagged == 'false' && steps.v.outputs.next != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.v.outputs.next }}
        run: |
          set -euo pipefail
          msg=$(cat "$RUNNER_TEMP/tag_message.txt")
          obj=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
                  -f tag="v${VERSION}" -f message="$msg" \
                  -f object="${GITHUB_SHA}" -f type=commit --jq .sha)
          # A LOST RACE IS NOT A FAILURE. Two merges landing together both reach
          # here; the second gets 422 `Reference already exists` ON STDERR —
          # confirmed against the live API rather than assumed — and the tag it
          # wanted is already there. Any OTHER error is real and reddens the job;
          # matching on the status code alone would swallow a rejected sha.
          #
          # THE LOSER'S ENTRIES ARE NOT LOST, BUT THEY DO WAIT. The second run's
          # range covered the first's bullets too, so the version it derived was
          # the more complete one and the tag that exists is the first run's.
          # The difference is picked up by the next merge.
          err="$RUNNER_TEMP/tag_ref_error.txt"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                 -f ref="refs/tags/v${VERSION}" -f sha="$obj" >/dev/null 2>"$err"; then
            grep -q "Reference already exists" "$err" || { cat "$err" >&2; exit 1; }
            echo "::notice::v${VERSION} already exists; another run won the race."
            echo "_\`v${VERSION}\` already existed; another run cut it first._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::notice::tagged v${VERSION}"
          echo "Tagged **\`v${VERSION}\`**. The \`release\` job runs from that tag." >> "$GITHUB_STEP_SUMMARY"

  # ONE check name for every repository to require in its ruleset, reporting
  # regardless of which stages ran. Without it a repository with no Cargo.toml
  # would have a required check that never reports and pull requests that block
  # forever.
  passed:
    if: always()
    needs:
      [
        detect,
        precommit,
        workflows,
        vulnerabilities,
        template,
        test,
        proto,
        portability,
      ]
    runs-on: ubuntu-latest
    steps:
      # DETECT IS CHECKED HERE AND NOT BELOW, because the step below reads
      # `skipped` as success and a skipped detect is the one skip that is never
      # benign. Every gating job either needs detect or reads its outputs, so a
      # detect that fails or is cancelled leaves precommit, test and proto all
      # reporting `skipped` — the result GitHub gives a job whose dependency did
      # not succeed — and the loop below waves all three through. That is a pull
      # request merging with no hooks, no tests and no proto check having run at
      # all, and detect was not in `needs` for any of it to be noticed.
      #
      # THE REQUIRED RESULT DEPENDS ON THE EVENT, and it has to. detect carries
      # `if: github.event_name != 'push'`, so on push to main it is MEANT not to
      # run; demanding success there would turn the post-merge run red in every
      # repository at once. Callers trigger on `pull_request` and `push` and
      # nothing else, so these two branches are the whole set rather than a case
      # and a default.
      - name: detect reached a conclusion of its own
        env:
          # Through the environment rather than interpolated into the script,
          # for the reason the template job gives at length.
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.detect.result }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then required=skipped; else required=success; fi
          if [ "$RESULT" != "$required" ]; then
            echo "::error::detect reported '$RESULT' on a '$EVENT' event, and '$required' is required. Every other stage keys off its outputs, so this run proved nothing about the change."
            exit 1
          fi
          echo "detect: $RESULT on $EVENT, as required."

      # AND EVERY OTHER STAGE, where `skipped` is a real answer now that the one
      # illegitimate skip is caught above. What remains, named rather than
      # assumed, because this step's message asserted a distinction it could not
      # make:
      #
      #   workflows, vulnerabilities, portability  skip on push and nowhere else.
      #   template                                 skips on push, and for a bot,
      #                                            which is the exemption it
      #                                            documents at length.
      #   test                                     skips when rust is false, which
      #                                            takes deleting Cargo.toml — and
      #                                            the cargo hooks match `.rs` and
      #                                            `.toml` files rather than that
      #                                            file, so they run anyway and
      #                                            fail precommit instead.
      #   proto                                    skips when proto is false, which
      #                                            detect now refuses to report
      #                                            while `proto/` is still there.
      - name: no upstream job failed
        run: |
          set -euo pipefail
          for r in "${{ needs.precommit.result }}" \
                   "${{ needs.workflows.result }}" \
                   "${{ needs.vulnerabilities.result }}" \
                   "${{ needs.template.result }}" \
                   "${{ needs.test.result }}" \
                   "${{ needs.proto.result }}" \
                   "${{ needs.portability.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "upstream job result: $r"; exit 1 ;;
            esac
          done
          echo "All stages passed or were legitimately skipped."
