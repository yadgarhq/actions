name: sweep

# YAADGAAR 442 (c). The other half of `fan-out.yaml`. The fan-out PROPOSES one
# `actions-adopt` pull request per consumer and never merges one (ADR-0982).
# This workflow finds those pull requests and merges one only when every
# condition in `scripts/sweep.py` holds, read from the GitHub API in this run.
# A pull request that is only BEHIND its base is refreshed instead: the branch
# moves in one ref write to a new commit on the base tip carrying the same
# file, so CI runs fresh. It never passes through the base tip: head == base
# closes the pull request (yaadgaar 466).
#
# DRY UNTIL ARMED. `sweep.py mode` says `live=true` only when `classes.json`
# has `"sweep": {"live": true}`, the ref is `main`, and the run is the schedule
# or a dispatch with `dry_run` false. `live` is true since yaadgaar 465. While
# it is false the `act` job never runs and no write token is minted;
# `evaluate` writes its verdict table to the step summary and nothing else.
#
# READS USE GITHUB_TOKEN. R1 admits only public repositories, and the listing
# asks for public ones only, so no read here needs the App. The App token is
# minted per `act` leg, scoped by `repositories:` to that leg's one repository.
# An ADOPTION leg (`app`) gets `contents: write` and nothing else: the squash
# merge and the branch rewrite (git data API blob, tree and commit, the ref
# moved by a GraphQL `updateRefs` compare-and-swap, a repository read for its
# node id, two commit reads, and a ref read after a failed swap) are the only
# calls made with it. A BOT merge leg (`app-bot`, ADR-1106) gets `contents`
# and `workflows: write`: the squash merge and the branch delete are the only
# calls made with it. A BOT refresh leg (`app-bot-refresh`, ADR-1119) adds
# `pull_requests: write`: the one update-branch is the only call made with it. A RERUN leg of either kind (`app-rerun`, V1r) gets
# `actions: write` only: the one rerun of the pull request's own ci run is
# the only call made with it.
#
# NOT THE FAN-OUT'S CONCURRENCY GROUP. A queued sweep must never cancel or delay
# a tag-push fan-out; `sweep.py` instead stops when a fan-out run is in progress
# or queued.
#
# DISPATCHED BY THE FAN-OUT, CRON AS THE BACKSTOP (ADR-1073, yaadgaar 468).
# GitHub drops most scheduled runs, so a live tag-push fan-out dispatches this
# workflow on main with `dry_run` false and a `wait_minutes` cap. `sweep.py
# wait` sleeps until the newest tag's T5 soak plus a margin for the consumers'
# CI (about 35 minutes from the tag), never longer than the cap, and only then
# does `evaluate` run. The wait is not a gate: T5 is still checked. A schedule
# run sends no input and waits nothing.
#
# THE WAIT HOLDS NO CONCURRENCY GROUP. It is its own job, `wait`, outside any
# group, so runs dispatched for several tags in an hour all wait at once, each
# for the newest tag it reads. Only `evaluate` holds the `sweep` group: GitHub
# keeps one running and one pending job per group and cancels an older pending
# one, which is harmless there, because what is cancelled is an evaluation the
# next one repeats. Each `act` leg holds a group per repository, so two runs
# never write to one repository at once.
#
# BOT PULL REQUESTS (ADR-1106). The same run also merges a dependabot or repin
# pull request in any public repository once `ci / passed` is green on its
# head and the head contains the base tip. A BEHIND one is never merged
# (ADR-1119, superseding ADR-1109): when it passes every other gate it is
# brought up to date with update-branch at the judged head, and a later hop
# (the follow-up) merges it once CI is green on the new head. Nothing asks
# dependabot to rebase: it ignores `@dependabot rebase` from the App. Such a
# leg carries `kind`. A merge leg's token is minted by `app-bot` with
# `contents` and `workflows: write`; a refresh leg's by `app-bot-refresh` with
# `contents`, `pull_requests` and `workflows: write`; an adoption leg's mint
# is unchanged.
# Merges made with the App token are pushes by the App, not by GITHUB_TOKEN,
# so the consumer's push workflows (version, tag, release) run as they do for
# a merge by hand. The squash commit's author is the pull request's author.
#
# A LOST CHECK (V1r, yaadgaar 518 item 4). When `ci / passed` is missing from
# the head's check runs but the job that posts it succeeded in the pull
# request's own ci run, still at attempt 1 and under a day old, `act` reruns
# that run once, and only once every gate that can still refuse the pull
# request has passed (yaadgaar 518 item 5 (c)). Evaluate hands the planned
# reruns on as `reruns`; after `act`, the follow-up job asks for the next run
# only for a rerun that took (its run is past attempt 1), so a refused one is
# not planned again every hop (item 5 (a)). A rerun still running when the
# next run looks is due again then (item 5 (b)).
#
# THE FOLLOW-UP (ADR-1108: bot merges within minutes, not at the next
# throttled cron). A live run whose evaluation left a pull request held back
# only by the bot soak (B10), refreshed (ADR-1119), by a rerun still running, or by its own plan
# (M4, M5) outputs `follow_up` minutes, and planned reruns as `reruns`; after
# `act`, the `follow-up` job runs `sweep.py follow-up`, which reads each
# rerun's run (GITHUB_TOKEN, public repositories) and gives the minutes left,
# then sleeps them and dispatches this
# workflow on main with `dry_run` false and `hop` + 1. GITHUB_TOKEN with
# `actions: write` can do that in this repository and no other, and a
# `workflow_dispatch` it sends does start a run. The dispatched run carries no
# pull request, repository or sha: it judges everything from scratch. `hop`
# stops the chain at `MAX_HOPS`, and a due time an hour or more away is left to
# the cron. ADR-1108 rules this bounded self-dispatch in, superseding ADR-1073
# on that one point; there is no cross-repository event trigger.
#
# ROLLBACK: set `sweep.live` false in classes.json, or disable this workflow.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "report only; merge nothing (live also needs main and sweep.live)"
        type: boolean
        default: true
      wait_minutes:
        description: "sleep until the newest tag's soak and CI should be done, at most this many minutes (0-60)"
        type: string
        default: "0"
      hop:
        description: "the follow-up chain's count, set by the follow-up job (0-6); a run at 6 dispatches nothing"
        type: string
        default: "0"

permissions: {}

jobs:
  # ADR-1073. Outside any concurrency group (yaadgaar 468 review): a waiting run
  # must not leave the next tag's run pending, where a cron would cancel it.
  # The input reaches the script through env only, and is checked there.
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 65 # 60 for the longest wait, 5 spare
    permissions:
      contents: read # the checkout of this repository, and its tags through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tool versions this job installs (versions.yaml)
        id: versions
        run: python3 scripts/tool_versions.py versions.yaml >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # `sweep.py` imports `ci_verdict`, which imports PyYAML.
      - name: install PyYAML
        env:
          PYYAML_VERSION: ${{ steps.versions.outputs.pyyaml }}
        run: pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"
      - name: wait for the soak and the consumers' CI
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: python3 scripts/sweep.py wait --owner "$OWNER"

  evaluate:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sweep
      cancel-in-progress: false
    permissions:
      contents: read # the checkout of this repository
      actions: read # whether a fan-out run is in progress or queued here
    outputs:
      live: ${{ steps.mode.outputs.live }}
      plan: ${{ steps.evaluate.outputs.plan }}
      follow_up: ${{ steps.evaluate.outputs.follow_up }}
      reruns: ${{ steps.evaluate.outputs.reruns }}
      next_hop: ${{ steps.evaluate.outputs.next_hop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tool versions this job installs (versions.yaml)
        id: versions
        run: python3 scripts/tool_versions.py versions.yaml >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # `ci_verdict.parsed_agrees` parses the consumer's config with PyYAML.
      - name: install PyYAML
        env:
          PYYAML_VERSION: ${{ steps.versions.outputs.pyyaml }}
        run: pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"
      - name: live or dry
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: python3 scripts/sweep.py mode
      # The plan is empty unless live. The table goes to the step summary only.
      - name: evaluate every open adoption pull request
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ steps.mode.outputs.live }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          HOP: ${{ inputs.hop }}
        run: |
          set -euo pipefail
          args=(evaluate --owner "$OWNER")
          if [ "$LIVE" = true ]; then
            args+=(--live)
          fi
          python3 scripts/sweep.py "${args[@]}"

  # ONE LEG PER PULL REQUEST, and each one evaluates again from scratch before
  # it writes (M1): the plan is a list of candidates, never a licence.
  act:
    needs: evaluate
    if: needs.evaluate.outputs.live == 'true' && needs.evaluate.outputs.plan != '[]' && needs.evaluate.outputs.plan != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One writer per repository across runs: `evaluate` no longer holds the
    # group while a run acts, so a later run's leg for the same repository
    # waits for this one.
    concurrency:
      group: sweep-act-${{ matrix.repo }}
      cancel-in-progress: false
    permissions:
      contents: read # the checkout of this repository
      actions: read # whether a fan-out started since evaluate (yaadgaar 470)
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.evaluate.outputs.plan) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tool versions this job installs (versions.yaml)
        id: versions
        run: python3 scripts/tool_versions.py versions.yaml >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: install PyYAML
        env:
          PYYAML_VERSION: ${{ steps.versions.outputs.pyyaml }}
        run: pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"
      # An empty `repositories:` beside `owner:` mints for EVERY repository, so
      # the leg's name is checked before the mint ever sees it.
      - name: the leg names exactly one repository
        id: leg
        env:
          REPO: ${{ matrix.repo }}
        run: python3 scripts/sweep.py check-name -- "$REPO"
      # An adoption leg has no `kind` and mints `contents: write` only, as it
      # always did. A rerun leg of either kind mints only `app-rerun`.
      - name: mint the write token for this one repository
        id: app
        if: ${{ !matrix.kind && matrix.action != 'rerun' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
      # ADR-1106. A bot leg also needs `workflows: write`, without which
      # GitHub refuses an App's write that touches `.github/workflows/`
      # (dependabot's github-actions bumps do, and so can a rust-bump, ADR-1120).
      # The squash merge and the branch delete need `contents: write` only, as
      # an adoption merge proves. Still one repository. A kind that is none of
      # the three mints nothing, and `act` then reds on the missing token.
      - name: mint the bot write token for this one repository
        id: app-bot
        if: ${{ (matrix.kind == 'dependabot' || matrix.kind == 'repin' || matrix.kind == 'rust') && matrix.action == 'merge' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-workflows: write
      # ADR-1119. A behind bot pull request is brought up to date: the pull
      # request's update-branch, with `expected_head_sha`. GitHub's App
      # permission table lists that call under `pull_requests: write`, and its
      # endpoint page asks an App for write on the head repository's contents.
      # `workflows: write` as for `app-bot`: the merge commit brings the base's
      # `.github/workflows/` changes onto the branch (unmeasured for
      # update-branch). The update-branch is the only call made with it.
      - name: mint the bot refresh token for this one repository
        id: app-bot-refresh
        if: ${{ (matrix.kind == 'dependabot' || matrix.kind == 'repin' || matrix.kind == 'rust') && matrix.action == 'refresh' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # V1r (yaadgaar 518 item 4). A leg whose `ci / passed` check GitHub lost
      # reruns that pull request's own ci run once: POST
      # .../actions/runs/{id}/rerun, which needs `actions: write` on that one
      # repository and nothing else. No contents, no workflows.
      - name: mint the rerun token for this one repository
        id: app-rerun
        if: ${{ matrix.action == 'rerun' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-actions: write
      - name: merge or refresh
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP_WRITE_TOKEN: ${{ steps.app.outputs.token || steps.app-bot.outputs.token || steps.app-bot-refresh.outputs.token || steps.app-rerun.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          REPO: ${{ matrix.repo }}
          NUMBER: ${{ matrix.n }}
          HEAD: ${{ matrix.head }}
          ACTION: ${{ matrix.action }}
          KIND: ${{ matrix.kind }}
        run: >-
          python3 scripts/sweep.py act --owner "$OWNER" --repo "$REPO"
          --n "$NUMBER" --head "$HEAD" --action "$ACTION" --kind "$KIND"

  # THE NEXT RUN, WHEN A PULL REQUEST IS DUE. `follow_up` is set only by a live
  # evaluate, and only to an integer from 1 to 59 that `sweep.py` checked;
  # `next_hop` only to 1-6, and whenever `follow_up` or `reruns` is set.
  # `sweep.py follow-up` checks all three again and outputs `minutes` only
  # when a pull request is still due after `act`: a planned rerun counts only
  # if its run is now past attempt 1 (yaadgaar 518 item 5 (a)). Every value
  # reaches the shell through env, never `${{ }}`. After `act`, whatever it
  # did: a merge is what makes an M5 sibling due.
  follow-up:
    needs: [evaluate, act]
    if: ${{ !cancelled() && needs.evaluate.outputs.live == 'true' && needs.evaluate.outputs.next_hop != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70 # 59 for the longest sleep, the setup and the reads, the rest spare
    permissions:
      actions: write # POST .../actions/workflows/sweep.yaml/dispatches in this repository, nothing else
      contents: read # the checkout of this repository, for `sweep.py follow-up`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tool versions this job installs (versions.yaml)
        id: versions
        run: python3 scripts/tool_versions.py versions.yaml >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # `sweep.py` imports `ci_verdict`, which imports PyYAML.
      - name: install PyYAML
        env:
          PYYAML_VERSION: ${{ steps.versions.outputs.pyyaml }}
        run: pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"
      - name: which pull requests are still due after act
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          FOLLOW_UP: ${{ needs.evaluate.outputs.follow_up }}
          RERUNS: ${{ needs.evaluate.outputs.reruns }}
          NEXT_HOP: ${{ needs.evaluate.outputs.next_hop }}
        run: python3 scripts/sweep.py follow-up --owner "$OWNER"
      - name: sleep until the soonest pull request is due, then dispatch the next sweep
        if: steps.decide.outputs.minutes != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MINUTES: ${{ steps.decide.outputs.minutes }}
          HOP: ${{ needs.evaluate.outputs.next_hop }}
        run: |
          set -euo pipefail
          sleep "$((MINUTES * 60))"
          gh api -X POST "repos/${REPO}/actions/workflows/sweep.yaml/dispatches" \
            -f ref=main -f "inputs[dry_run]=false" -f "inputs[hop]=${HOP}"
