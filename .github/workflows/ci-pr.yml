# What a pull request runs: validation, then tests.
#
# It CALLS ci-validation rather than repeating it (D62). A pull request needs
# both linting and tests, so two independent workflows would be two definitions
# of "is this repository clean" — and the one that drifts is whichever is edited
# second.
name: ci-pr

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validation:
    uses: yadgarhq/actions/.github/workflows/ci-validation.yml@main
    with:
      ref: ${{ inputs.ref }}

  # The template is checked, not suggested. A template nobody fills in is a
  # template that does not exist, and this is the only mechanism that notices.
  #
  # BOTS ARE EXEMPT, and must be. Dependabot writes its own body — a changelog
  # and a compatibility score — and cannot be taught this template. Without the
  # exemption every dependency update is blocked forever by a required check it
  # is structurally unable to satisfy, which turns the whole update mechanism
  # off silently. Checked on `user.type` rather than a login, so it covers the
  # next bot too.
  template:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: the pull request body must follow the template
        env:
          # Through the environment, never interpolated into the script. A PR
          # body is attacker-controlled text and `${{ }}` inside a run block is
          # a shell injection — the exact class zizmor audits for.
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          REQUIRED = ["What", "Why", "Verification", "Risk"]
          body = os.environ.get("BODY") or ""

          # HTML comments are the template's own guidance. Content that is only
          # guidance is an unfilled section, so they are stripped before the
          # emptiness test rather than counted as an answer.
          stripped = re.sub(r"<!--.*?-->", "", body, flags=re.S)

          sections, current = {}, None
          for line in stripped.splitlines():
              heading = re.match(r"^\s*#{1,6}\s+(.+?)\s*$", line)
              if heading:
                  current = heading.group(1).strip()
                  sections[current] = []
              elif current:
                  sections[current].append(line)

          missing = [h for h in REQUIRED if h not in sections]
          empty = [
              h for h in REQUIRED
              if h in sections and not any(l.strip() for l in sections[h])
          ]

          if not missing and not empty:
              print("Pull request body follows the template.")
              sys.exit(0)

          out = ["### Pull request body does not follow the template", ""]
          if missing:
              out += ["Missing sections:", ""] + [f"- `## {h}`" for h in missing] + [""]
          if empty:
              out += ["Present but empty (comments do not count as an answer):", ""] \
                     + [f"- `## {h}`" for h in empty] + [""]
          out += ["The template is in `.github/pull_request_template.md`."]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")
          print("::error::" + "; ".join(
              [f"missing: {', '.join(missing)}"] if missing else []
              + [f"empty: {', '.join(empty)}"] if empty else []
          ))
          sys.exit(1)
          PY

  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the checkout credential has no reason to
          # persist in .git afterwards where a later step could read it.
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - id: d
        run: |
          set -euo pipefail
          if [ -e Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "- **rust**: \`Cargo.toml\` present → running tests" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "- rust: no \`Cargo.toml\` → no tests to run" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the checkout credential has no reason to
          # persist in .git afterwards where a later step could read it.
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-features

  # A single check name for every repository to require in its ruleset, so the
  # ruleset never has to know which stages a given repository actually runs.
  # Without it, a repo with no Cargo.toml would have a required check that never
  # reports, and its pull requests would block forever.
  ci-pr:
    if: always()
    needs: [validation, test, template]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no upstream job failed
        run: |
          set -euo pipefail
          for r in "${{ needs.validation.result }}" "${{ needs.test.result }}" "${{ needs.template.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "upstream job result: $r"; exit 1 ;;
            esac
          done
          echo "All required stages passed or were legitimately skipped."
