# Is this repository clean? One definition, called by ci-pr and usable alone.
#
# DETECTS what the repository is rather than being told (D62). The repositories
# are not uniform — most are Rust services, but proto has no cargo at all, docs
# is prose, deploy and argocd are manifests — and a flag per repository kind
# would be a second configuration surface that drifts from the first.
name: validation

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      buf: ${{ steps.d.outputs.buf }}
      chart: ${{ steps.d.outputs.chart }}
      image: ${{ steps.d.outputs.image }}
      precommit: ${{ steps.d.outputs.precommit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the checkout credential has no reason to
          # persist in .git afterwards where a later step could read it.
          persist-credentials: false
          ref: ${{ inputs.ref }}

      # Detection NARRATES. Silent magic is unmaintainable; a repository whose
      # CI mysteriously does nothing is the failure this design guards against,
      # so every run says what it found and what it therefore skipped.
      - id: d
        name: Detect what this repository is
        run: |
          set -euo pipefail
          detect() {
            if [ -e "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "- **$1**: \`$2\` present → running $1 stages" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "- $1: no \`$2\` → skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          echo "## Detected" >> "$GITHUB_STEP_SUMMARY"
          detect rust      Cargo.toml
          detect buf       buf.yaml
          detect chart     chart
          detect image     Containerfile
          detect precommit .pre-commit-config.yaml

  # ONE definition of "is this repository clean": the hooks. CI installs what
  # they need and runs all of them.
  #
  # This replaced a design with a SKIP list and a dedicated job per tool, which
  # meant two mechanisms for the same checks that had to be kept in agreement by
  # hand. Removing a job silently dropped coverage while CI stayed green;
  # adding a hook broke CI with "Executable not found", which says nothing about
  # the code. Both happened.
  #
  # It also makes D55's argument true one level up: what a developer runs is
  # exactly what CI runs, rather than something that resembles it.
  #
  # The hooks self-filter on `files:`, so a repository with no Rust runs no
  # cargo hooks. Detection is only used to skip INSTALLING a tool nothing will
  # call.
  precommit:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans history and `buf breaking` compares against a tag.
          # At the default depth there is neither, and the failure looks like a
          # leaked secret or a broken contract rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          # The binary, not gitleaks-action: the action refuses to run for an
          # organisation without a paid licence key, while gitleaks itself is
          # MIT. Only the wrapper is commercial.
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: hadolint
        env:
          HADOLINT_VERSION: 2.14.0
        run: |
          set -euo pipefail
          sudo curl -sSfL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: needs.detect.outputs.rust == 'true'
        with: { toolchain: stable, components: "rustfmt, clippy" }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.detect.outputs.rust == 'true'

      - name: cargo-deny
        if: needs.detect.outputs.rust == 'true'
        env:
          CARGO_DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/cargo-deny'

      # No SKIP. Every hook the repository declares runs here.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # NOT hook-covered, and that is the line: pre-commit owns what pre-commit can
  # define. These two need a runner and network, so they are jobs.

  # Workflows are code, and these run in every repository with packages: write
  # and an OIDC identity. zizmor finds the injection and permission mistakes
  # that only surface when somebody exploits them.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
        run: |
          set -euo pipefail

          # The policy IS the decision, written where a tool checks it. A tag
          # somebody else owns can move without warning, so third-party actions
          # are hash-pinned; @main here is ours and gated, which is what lets one
          # fix reach every repository without editing each one.
          cat > /tmp/zizmor.yml <<'ZIZ'
          rules:
            unpinned-uses:
              config:
                policies:
                  "yadgarhq/*": ref-pin
                  "*": hash-pin
          ZIZ
          pipx run "zizmor==${ZIZMOR_VERSION}" \
            --no-online-audits --persona=regular \
            --config /tmp/zizmor.yml .

  # Dependency CVEs, misconfiguration and secrets across the tree, before
  # anything is built. The IMAGE is scanned at release (ci-release.yml), which is
  # when the artifact an adopter runs actually exists.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
