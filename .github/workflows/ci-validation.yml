# Is this repository clean? One definition, called by ci-pr and usable alone.
#
# DETECTS what the repository is rather than being told (D62). The repositories
# are not uniform — most are Rust services, but proto has no cargo at all, docs
# is prose, deploy and argocd are manifests — and a flag per repository kind
# would be a second configuration surface that drifts from the first.
name: validation

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      buf: ${{ steps.d.outputs.buf }}
      chart: ${{ steps.d.outputs.chart }}
      image: ${{ steps.d.outputs.image }}
      precommit: ${{ steps.d.outputs.precommit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Detection NARRATES. Silent magic is unmaintainable; a repository whose
      # CI mysteriously does nothing is the failure this design guards against,
      # so every run says what it found and what it therefore skipped.
      - id: d
        name: Detect what this repository is
        run: |
          set -euo pipefail
          detect() {
            if [ -e "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "- **$1**: \`$2\` present → running $1 stages" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "- $1: no \`$2\` → skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          echo "## Detected" >> "$GITHUB_STEP_SUMMARY"
          detect rust      Cargo.toml
          detect buf       buf.yaml
          detect chart     chart
          detect image     Containerfile
          detect precommit .pre-commit-config.yaml

  # Server-side half of D59. The hooks make the check fast; this makes it true —
  # it catches what a skipped local hook let through, which the no-bypass rule
  # otherwise relies on goodwill for.
  pre-commit:
    needs: detect
    if: needs.detect.outputs.precommit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.x" }
      # SKIP the `language: system` hooks. They call a tool the DEVELOPER has —
      # that is the point of them locally — and a runner has neither gitleaks
      # nor nix nor cargo-deny. Each has its own job below or above, which
      # installs the tool properly, so skipping here loses no coverage and
      # removes a class of failure that says nothing about the code.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: gitleaks,cargo-fmt,cargo-clippy,cargo-deny,hadolint

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # Pinned by SHA like everything else, which means the toolchain can no
      # longer come from the ref name — it has to be passed.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # D24 requires a permissive stack stay viable; O10 requires the audit be
  # re-run before adding a dependency. Enforced rather than remembered.
  licences:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check }

  # D16's gate: additive-only evolution enforced structurally rather than by
  # discipline, which is the reason protobuf was chosen over HTTP/JSON.
  buf:
    needs: detect
    if: needs.detect.outputs.buf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # buf breaking compares against a tag, so history and tags must exist.
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with: { version: 1.72.0 }
      - run: buf lint
      - run: buf build -o /dev/null
      - run: buf format --diff --exit-code
      - name: breaking (against the major's FIRST tag)
        run: |
          set -euo pipefail
          # Against the first tag of the major, not the latest. D15 makes changes
          # additive-only WITHIN a major, so v1 must stay compatible with v1.0.0
          # forever — comparing against the newest tag would let the contract
          # drift away from it one compatible step at a time.
          BASE=$(git tag --list 'v1.*' --sort=v:refname | head -n1)
          if [ -z "$BASE" ]; then
            echo "No v1 tag yet — nothing to compare against." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Comparing against \`$BASE\`" >> "$GITHUB_STEP_SUMMARY"
          buf breaking --against ".git#tag=$BASE"

  # D62's detection already looks for a Containerfile in order to publish an image.
  # Without this it would build one that nothing had linted.
  dockerfile:
    needs: detect
    if: needs.detect.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          # Containerfile, not Dockerfile — see the note in ci-release.yml.
          dockerfile: Containerfile

  # gitleaks properly, with the tool installed, rather than through a hook that
  # assumes it is already present.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # gitleaks scans history, not just the tip.
          fetch-depth: 0
      # The BINARY, not gitleaks-action. The action refuses to run for an
      # organisation without a paid licence key —
      #   "[org] is an organization. License key is required."
      # — while gitleaks itself is MIT and free. Only the wrapper is commercial,
      # which is easy to miss because the failure names the org rather than the
      # action.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .

  # Workflows are code, and these run in every repository with packages: write
  # and an OIDC identity. zizmor finds the injection and permission mistakes
  # that only show up when somebody exploits them.
  workflows:
    runs-on: ubuntu-latest
    # NO job-level permissions block. A called workflow cannot grant more than
    # its caller, and callers grant `contents: read` — asking for
    # security-events: write here fails the whole run at STARTUP, before any job
    # logs anything, which is a genuinely confusing way to break.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The CLI rather than the action, for the same reason as gitleaks: fewer
      # moving parts and the output is visible in the log. Uploading SARIF would
      # need security-events: write, which a called workflow cannot request.
      - name: zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
        run: |
          set -euo pipefail

          # The policy IS the decision, written where a tool can check it rather
          # than only in prose. Third-party actions must be hash-pinned: those
          # tags belong to somebody else and can move without warning. Our own
          # workflows may be referenced by ref, because @main here is gated —
          # this repository tests its own workflows and protects main — and a
          # moving reference is what lets one fix reach every repository without
          # editing each one.
          #
          # Written inline rather than as a file in every repository: the policy
          # is organisation-wide, so it belongs in the organisation-wide
          # workflow. Sixty copies of a policy is sixty things to drift.
          cat > /tmp/zizmor.yml <<'ZIZ'
          rules:
            unpinned-uses:
              config:
                policies:
                  "yadgarhq/*": ref-pin
                  "*": hash-pin
          ZIZ
          pipx run "zizmor==${ZIZMOR_VERSION}" \
            --no-online-audits --persona=regular \
            --config /tmp/zizmor.yml .

  # Filesystem scan: dependency CVEs, misconfiguration and secrets, before
  # anything is built. The image itself is scanned at release (ci-release.yml),
  # because that is when the artifact an adopter runs actually exists.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    needs: detect
    if: needs.detect.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint chart
      - run: helm template chart >/dev/null
