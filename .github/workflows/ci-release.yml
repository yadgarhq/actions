# Cutting a release. The stage order is forced by D61, not chosen: the chart
# pins the image by DIGEST, so the digest must exist before the chart can be
# packaged. Build, push, capture digest, package chart against it, push, sign.
name: ci-release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, without a leading v."
        type: string
        required: true

permissions:
  contents: read
  packages: write
  # Signing uses the workflow's own OIDC identity, so there is no key material
  # to hold or rotate (D61).
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.d.outputs.image }}
      chart: ${{ steps.d.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "## Release ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          for pair in "image:Containerfile" "chart:chart"; do
            k=${pair%%:*}; f=${pair#*:}
            if [ -e "$f" ]; then
              echo "$k=true" >> "$GITHUB_OUTPUT"
              echo "- **$k**: \`$f\` present → publishing" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$k=false" >> "$GITHUB_OUTPUT"
              echo "- $k: no \`$f\` → nothing to publish" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  image:
    needs: detect
    if: needs.detect.outputs.image == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Containerfile is podman's native name and is understood by buildkit
          # too, but buildkit defaults to Dockerfile, so it has to be named.
          # This project builds with podman locally; using two names for one
          # file to satisfy two builders would be the drift, not the fix.
          file: Containerfile
          push: true
          # Images at the top level; charts under charts/. They share a
          # namespace and would otherwise collide — `helm push` would claim
          # exactly the path the image wants (D61).
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Scan the ARTIFACT, not the source tree. ci-validation scans the
      # filesystem before anything is built; this is the thing an adopter
      # actually runs, including whatever the base image contributed.
      #
      # ignore-unfixed: an unfixable CVE in a base is not something this build
      # can act on, and a gate nobody can satisfy gets disabled rather than
      # fixed. The weekly base rebuild is what picks up fixes when they land.
      - name: scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # D63: lean and secure are measured, not asserted. A claim about an
      # image's contents that nothing verifies is a claim about the
      # Containerfile.
      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: "${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          upload-artifact: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        env:
          # Through env, never interpolated into the script. zizmor's
          # template-injection audit is right even where the value looks
          # trustworthy: the habit is what protects the one case that is not.
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"

      # A published package is PRIVATE by default, even from a public
      # repository, and there is no API to change that — visibility lives on the
      # package's own settings page and nowhere else. Publishing therefore
      # succeeds, this workflow goes green, and only an adopter discovers the
      # problem, as `unauthorized` rendered by most clients as "not found".
      #
      # So the workflow checks what an adopter experiences rather than what it
      # just did. Same instinct as the detection step narrating what it skipped:
      # a silent wrong state is worse than a red build.
      - name: verify an adopter can actually pull this
        env:
          REF: ${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "Anonymous pull of $REF works." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Published, but NOT publicly pullable"
            echo ""
            echo "\`$REF\` was pushed and signed, but an anonymous pull is refused."
            echo "A new GitHub package is private by default and **no API can change it** —"
            echo "it is a one-time manual step per package:"
            echo ""
            echo "  https://github.com/orgs/${OWNER}/packages/container/$(basename "$REPO")/settings"
            echo ""
            echo "Danger Zone -> Change visibility -> Public."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Package is not publicly pullable. See the job summary."
          exit 1

  chart:
    needs: [detect, image]
    # always(): a repository may ship a chart and no image. Without this the
    # chart would be skipped whenever the image job did not run.
    if: always() && needs.detect.outputs.chart == 'true' && needs.image.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Pin the image by digest
        if: needs.image.result == 'success'
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # A tag is a pointer and can be moved; a digest is the artifact. The
          # Valkey chart pinned 6.2.13 while running :latest, so the pin
          # described the packaging and not what ran (D61).
          echo "digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          yq -i ".image.digest = \"$DIGEST\"" chart/values.yaml
      - name: package and push
        env:
          VERSION: ${{ inputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package chart --version "$VERSION" --app-version "$VERSION"
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin
          helm push ./*-"$VERSION".tgz "oci://${REGISTRY}/${OWNER}/charts"
