# Cutting a release. The stage order is forced by D61, not chosen: the chart
# pins the image by DIGEST, so the digest must exist before the chart can be
# packaged. Build, push, capture digest, package chart against it, push, sign.
name: ci-release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, without a leading v."
        type: string
        required: true

permissions:
  contents: read
  packages: write
  # Signing uses the workflow's own OIDC identity, so there is no key material
  # to hold or rotate (D61).
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.d.outputs.image }}
      chart: ${{ steps.d.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          set -euo pipefail
          echo "## Release ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          for pair in "image:Dockerfile" "chart:chart"; do
            k=${pair%%:*}; f=${pair#*:}
            if [ -e "$f" ]; then
              echo "$k=true" >> "$GITHUB_OUTPUT"
              echo "- **$k**: \`$f\` present → publishing" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$k=false" >> "$GITHUB_OUTPUT"
              echo "- $k: no \`$f\` → nothing to publish" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  image:
    needs: detect
    if: needs.detect.outputs.image == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Images at the top level; charts under charts/. They share a
          # namespace and would otherwise collide — `helm push` would claim
          # exactly the path the image wants (D61).
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}"

  chart:
    needs: [detect, image]
    # always(): a repository may ship a chart and no image. Without this the
    # chart would be skipped whenever the image job did not run.
    if: always() && needs.detect.outputs.chart == 'true' && needs.image.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Pin the image by digest
        if: needs.image.result == 'success'
        run: |
          set -euo pipefail
          # A tag is a pointer and can be moved; a digest is the artifact. The
          # Valkey chart pinned 6.2.13 while running :latest, so the pin
          # described the packaging and not what ran (D61).
          echo "digest: ${{ needs.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          yq -i '.image.digest = "${{ needs.image.outputs.digest }}"' chart/values.yaml
      - name: package and push
        run: |
          set -euo pipefail
          helm package chart --version "${{ inputs.version }}" --app-version "${{ inputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm push ./*-${{ inputs.version }}.tgz \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
