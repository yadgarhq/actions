# Publishes the two base images of D63.
#
# TAGGED :latest AND :<version>, deliberately both. Module Containerfiles use
# :latest so a toolchain bump does not mean editing sixty-odd files — the same
# reasoning that makes workflow callers track @main. The versioned tag exists for
# anyone who needs to reproduce an old build, and costs nothing to publish
# alongside.
#
# What floats here is the build INPUT. The output is still pinned: D61 has the
# parent chart reference each service image by digest, so a release names exactly
# what runs regardless of which base produced it.
name: base-images

on:
  push:
    branches: [main]
    paths: [containers/**, .github/workflows/base-images.yaml]
  # Rebuild weekly. The upstream bases receive security fixes, and an image
  # published once and never rebuilt accumulates every CVE fixed since.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# A SECOND REGISTRY WRITE NEEDS A LOCK. Promoting `:latest` below is a write
# that FOLLOWS the push, so two overlapping runs — the Monday cron and a `main`
# push, say — can interleave one run's promotion with another run's push and
# leave the consumed tag pointing at a digest neither run signed. The window is
# small and it did not exist before the promotion did.
#
# `cancel-in-progress: false`, DELIBERATELY. Cancelling a run mid-flight
# reintroduces exactly the failure the `fail-fast: false` comment below
# describes: a leg killed between `push` and `sign` leaves a published, unsigned
# image. A lock that queues is the point; a lock that kills is the defect.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # ONE LEG'S FAILURE MUST NOT CANCEL THE OTHERS. The default is
      # `fail-fast: true`, so a sibling failing its scan cancels this leg at
      # whatever step it has reached.
      #
      # THE ORIGINAL REASON IS GONE AND THE SETTING STAYS. It was added when
      # `push` ran BEFORE `scan`, where a cancellation could land between
      # publishing a moving `:latest` and signing it. That window closed in two
      # steps rather than one: `push` moved after the gate, and `:latest` now
      # moves only after `sign`. What a cancelled leg can still leave behind is
      # the DATED tag, published and unsigned — smaller, because nothing
      # consumes that tag by default, and not zero. Measured on PR #46, where a
      # third matrix entry could not pass the scan gate; on 2026-09-05 `runtime`
      # completed for exactly this reason while `rust-build` failed.
      fail-fast: false
      matrix:
        image: [rust-build, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: version from the date
        id: v
        run: echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BUILT LOCALLY FIRST, NOT PUSHED, so the scan below can refuse before
      # anything reaches the registry. This used to push here and scan
      # afterwards, and on 2026-09-05 that ordering did exactly what it always
      # could: `rust-build` picked up a new libssh2 CVE from a refreshed
      # vulnerability database, published `:latest` and the dated tag, and THEN
      # went red. The moving tag every service does `FROM` on had already moved,
      # unsigned and with no SBOM.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: containers/${{ matrix.image }}
          file: containers/${{ matrix.image }}/Containerfile
          push: false
          load: true
          tags: ${{ matrix.image }}:candidate

      # D61: signed with the workflow's own OIDC identity, so there is no key
      # material to hold or rotate.
      # The base images are scanned hardest, because every service inherits
      # whatever they carry. A CVE here is a CVE in sixty-one images.
      # SKIPPING THE CARGO REGISTRY IS NOT LOWERING THE BAR — it is excluding
      # files that are not part of any build.
      #
      # `cargo install cargo-chef` extracts crate SOURCES into the registry
      # cache, and a published crate ships its own `Cargo.lock` — the one its
      # maintainers resolved for their own CI. Trivy reads each of those as a
      # dependency manifest, so it reported HIGH findings against, for example,
      # `globwalk-0.8.1/Cargo.lock` pinning `regex 1.4.2`.
      #
      # Nothing here ever resolves those lockfiles. Cargo resolves from the
      # WORKSPACE lockfile of whatever is being built; a dependency's bundled
      # lock is inert data sitting in a download cache. The finding is real about
      # the file and says nothing about the image.
      #
      # What still gets scanned: the Debian layer, and the compiled binaries —
      # including cargo-chef itself, whose real dependency set trivy reads from
      # the binary. And the dependency set of anything we actually ship is gated
      # twice over: `cargo deny` at commit time (D59) and trivy in each service
      # repository's own pipeline.
      #
      # Suppressing the individual CVEs instead would have been wrong twice: it
      # accepts findings that were never about us, and the list rots as the
      # toolchain moves.
      - name: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:candidate
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: /usr/local/cargo/registry

      # ONLY NOW. The layers are in the build cache, so this reuses them.
      #
      # THE DATED TAG ALONE. `:latest` is the tag every module does `FROM` on,
      # and it is not written here: it is promoted further down, after the
      # equality below has been asserted and the digest has been signed. Nothing
      # consumes the dated tag by default, so publishing it first is what gives
      # the assertion something to refuse.
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: containers/${{ matrix.image }}
          file: containers/${{ matrix.image }}/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.v.outputs.version }}

      # THE EQUALITY THE GATE RESTS ON, ASSERTED RATHER THAN OBSERVED ONCE
      # (ADR-0587). The scan above reads `${{ matrix.image }}:candidate` out of
      # the runner's local daemon; what reaches the registry is a SECOND build.
      # They agree today because the `FROM` is digest-pinned and the push leg
      # reuses the buildx cache the build leg filled inside this same job, so
      # neither leg can re-resolve a moving tag. That is a property of the
      # current arrangement, not a claim this workflow makes — an evicted cache
      # or an inserted step would publish an UNSCANNED image and report success.
      #
      # IT RUNS BEFORE THE PROMOTION, WHICH IS WHAT MAKES IT A GATE. A mismatch
      # found here refuses to move `:latest`; the same check after the promotion
      # would only report one, which is the shape ADR-0581 exists to forbid.
      #
      # SHAPE-AGNOSTIC, and that is not defensive coding. `push: true` attaches
      # a provenance attestation, so what lands is an OCI index whose sole child
      # carrying no `vnd.docker.reference.type` annotation is the scanned
      # digest. Written for the index case ALONE it returns an empty child list
      # against a plain manifest and reds every run — and `estate-runner`, which
      # shares this shape, has never published through its workflow, so nobody
      # can say which of the two its first success produces.
      #
      # AUTHENTICATED, via the `docker/login-action` above. The anonymous flow
      # would red here on a private package, which is a real fact that the
      # anonymous-pull check further down already reports with its own message.
      #
      # THREE CAUSES, THREE MESSAGES (ADR-0578). A missing digest, an
      # unreachable registry and a genuine mismatch are three different facts,
      # and only the third says anything about what was published.
      #
      # THE DIGESTS ARE FORMAT-CHECKED FIRST, and the right-hand side of `=~`
      # STAYS UNQUOTED — quoting turns the pattern into a literal string and
      # rejects every valid digest. An empty digest is not hypothetical: it
      # reaches the SBOM and cosign as a reference ending in `@`, which they
      # refuse by luck rather than by design, and it reaches the step summary,
      # which prints a line with no digest and exits 0.
      - name: the published manifest must commit to the scanned candidate
        env:
          REF: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          BUILT: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          for pair in "build:$BUILT" "push:$PUSHED"; do
            step=${pair%%:*}
            digest=${pair#*:}
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the ${step} step produced no usable digest: '${digest}'"
              exit 1
            fi
          done

          if ! raw=$(docker buildx imagetools inspect --raw "${REF}@${PUSHED}"); then
            echo "::error::could not read back the manifest just pushed at ${PUSHED}."
            echo "::error::That is a registry or credential fault and says NOTHING about whether the scanned image is the published one."
            exit 1
          fi

          if printf '%s' "$raw" | jq -e 'has("manifests")' >/dev/null; then
            children=$(printf '%s' "$raw" | jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] == null) | .digest')
          else
            children=$PUSHED
          fi

          if ! printf '%s\n' "$children" | grep -Fqx "$BUILT"; then
            echo "::error::the published manifest does not commit to the scanned candidate."
            echo "::error::scanned ${BUILT}; published ${PUSHED} carries [${children//$'\n'/ }]."
            echo "::error::latest is NOT promoted, and the dated tag now holds bytes nothing scanned."
            exit 1
          fi
          echo "the published manifest commits to the scanned candidate: ${BUILT}"

      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}"
          upload-artifact: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"

      # THE PROMOTION, AND THE ONLY STEP THAT MOVES THE TAG EVERY MODULE DOES
      # `FROM` ON. It follows `sign`, so `:latest` moves to a digest that has
      # been scanned, asserted AND signed — which closes the sign-after-push
      # window for the consumed tag as a side effect of asserting the equality.
      #
      # THE READ-BACK IS NOT DECORATION. `imagetools create` from a single
      # source is documented as a copy, but nothing in this estate has measured
      # whether it copies the index byte for byte or re-serialises it, and a
      # re-serialised index is a NEW digest that the `cosign sign` above did not
      # sign. The content would still be the scanned bytes; the signature would
      # simply not cover the tag, silently. An invariant a guarantee rests on is
      # asserted, never assumed (ADR-0587).
      - name: promote :latest to the signed digest
        env:
          REF: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${REF}:latest" "${REF}@${PUSHED}"

          # COMPARED AS RAW BYTES, BY THE SAME COMMAND ON BOTH SIDES, which is
          # what makes this checkable at all. A manifest digest is a content
          # address over these exact bytes, so byte equality IS digest
          # equality — and reading both sides with one flag of one binary
          # means any quirk of that reader cancels out instead of being a
          # third thing to trust. Asking for the digest through a `--format`
          # template would put an unverified field name on the failure path,
          # where a typo and a real mismatch look identical.
          if ! signed_raw=$(docker buildx imagetools inspect --raw "${REF}@${PUSHED}"); then
            echo "::error::could not read back the signed manifest at ${PUSHED}."
            echo "::error::That is a registry or credential fault. The tag has already been promoted; whether the signature covers it is UNKNOWN, not disproved."
            exit 1
          fi
          if ! promoted_raw=$(docker buildx imagetools inspect --raw "${REF}:latest"); then
            echo "::error::could not read back the latest tag just promoted."
            echo "::error::That is a registry or credential fault. The tag has already been promoted; whether the signature covers it is UNKNOWN, not disproved."
            exit 1
          fi
          if [ "$promoted_raw" != "$signed_raw" ]; then
            echo "::error::the latest tag does not resolve to the bytes that were signed."
            echo "::error::imagetools re-serialised the manifest rather than copying it, so the tag has MOVED to a digest cosign did not sign."
            exit 1
          fi
          echo "latest -> ${PUSHED}"

      # See ci-release.yaml for why this exists: a new package is private by
      # default, no API can change it, and nothing else would report it.
      # ANONYMOUSLY, which is the whole point and is what this check got wrong.
      #
      # It used `docker manifest inspect`, which runs AFTER docker/login-action
      # in this same job — so it inspected as an authenticated org member and
      # succeeded against a private package. A check that cannot fail for the
      # reason it exists is worse than no check: this one reported "anonymous
      # pull works" for two images that were private, and the first real user of
      # those images would have found out instead.
      #
      # GHCR issues a pull token to an anonymous client only for a public
      # package, so requesting one with no credentials is the honest test. The
      # manifest is then fetched with that token, because a token alone does not
      # prove the manifest is readable.
      - name: verify an adopter can actually pull this, anonymously
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -uo pipefail
          REPO="${OWNER}/${IMAGE_NAME}"
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io" \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)

          CODE=000
          if [ -n "$TOKEN" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${REPO}/manifests/latest")
          fi

          if [ "$CODE" = "200" ]; then
            echo "Anonymous pull of \`ghcr.io/${REPO}:latest\` works." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Published, but NOT publicly pullable"
            echo ""
            echo "Anonymous manifest fetch returned \`${CODE}\` (000 = GHCR refused an anonymous token)."
            echo ""
            echo "One-time manual step — D61 records that no API exists for this;"
            echo "\`PATCH /orgs/{org}/packages/container/{name}\` returns 404:"
            echo ""
            echo "  https://github.com/orgs/${OWNER}/packages/container/${IMAGE_NAME}/settings"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::${IMAGE_NAME} is not publicly pullable. See the job summary."
          exit 1

      - name: summary
        env:
          IMAGE_NAME: ${{ matrix.image }}
          VERSION: ${{ steps.v.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE_NAME}"
            echo "- \`:latest\` and \`:${VERSION}\`"
            echo "- digest \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
