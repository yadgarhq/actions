name: ci-self

# This repository tests its own workflows, by LOCAL PATH rather than @main. A
# change to a shared workflow must be tested by the version in the pull request,
# not the one already merged — otherwise the old copy is tested and the new one
# merges unexamined, for a repository whose contents run everywhere else.
#
# It is a separate file because a workflow cannot call itself. The job is named
# `ci` so the reported check is `ci / passed`, identical to every other
# repository, which is what lets one ruleset serve all of them.
# `edited` IS THE HALF OF LEDGER 630 THAT LIVES IN THE CALLER, and it cannot
# live anywhere else. `ci-pr.yaml` is `workflow_call` only, so the activity types
# are declared here and in each consumer's own `ci.yaml`; no change to the shared
# workflow can add one to a repository that has not asked for it.
#
# WITHOUT IT THE BODY IS VALIDATED ONCE AND THEN FREELY MUTABLE. `on:
# pull_request` with no `types:` subscribes to `opened`, `synchronize` and
# `reopened`. A body edited after `ci / passed` went green retriggers nothing, so
# the text that becomes the squash commit message — and the release — is not the
# text any check read. `gh run rerun` does not close it either: a re-run replays
# the ORIGINAL event payload, so it re-reads the stale body and reports the
# stale verdict.
#
# THE VERDICT IS RE-EVALUATED, which is what makes this a gate rather than a
# report. The `edited` run creates a new `ci / passed` check run on the same head
# sha, the ruleset requires that context, and GitHub gates on the latest one.
#
# ITS RESIDUAL, named rather than left to be discovered: between the edit and the
# new check run appearing as pending there are a few seconds in which the stale
# green still satisfies the gate. An edit-then-merge fast enough to fit inside
# that window is caught after the fact by the `version` job's assertion, on the
# message that actually landed.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# TWO CALLS RATHER THAN ONE, and the split is the whole security argument.
# `ci-pr.yaml` serves both events, so a single job calling it for both handed the
# release App's private key to every pull-request run — a run that builds and
# tests the branch's own code, and these are branch pull requests rather than
# fork ones, so GitHub does pass secrets to them. This repository is the one the
# App can do the most damage from, because everything else in the organisation
# runs what lands here.
#
# THE PULL REQUEST HAS NO USE FOR THE CREDENTIAL. `version` is the only job that
# reads it, and its own condition is `github.event_name == 'push' && github.ref
# == 'refs/heads/main'`. So the split costs nothing and removes the exposure.
#
# THE NAME `ci` IS LOAD-BEARING. The ruleset on `main` requires the check
# `ci / passed`, which is `<caller job id> / <called job id>`, and one ruleset
# serves every repository. Renaming this job breaks the merge gate rather than
# reporting anything.
jobs:
  # LEDGER 686. `scripts/tests/` exercises `pr_body.py` and `scan_delta.py`, and
  # nothing ran it anywhere before this job: `grep` across `.github/`,
  # `.pre-commit-config.yaml` and `hooks/` for pytest/unittest/scripts/tests
  # returned zero hits. That was tolerable while `scan_delta.py` was the only
  # subject. PR #49 made `pr_body.py` the shared contract behind the `version`
  # job's post-merge assertion above, which runs on push to `main` in
  # seventeen consumer repositories plus this one, because the seventeen pin
  # the shared workflows at `@main` — this repository does not; the header
  # above already says it tests `ci-pr.yaml` by local path instead. A
  # regression here reds the estate, and it was guarded by a suite nobody made
  # run.
  #
  # HERE, NOT `ci-pr.yaml`. `scripts/tests/` belongs to this repository's own
  # meta-tooling — `pr_body.py` and `scan_delta.py` are gates THIS repository
  # ships, not a capability a consumer opts into the way `actionlint` is
  # published for one. No consumer has a `scripts/tests/` directory and none
  # ever will, unlike `rust`/`proto` in `ci-pr.yaml`'s `detect` job, which are
  # genuine per-repo capabilities. Putting this in the shared workflow would add
  # a step every one of the seventeen consumers pays for on every pull request,
  # for a check only this repository can ever exercise.
  #
  # VISIBILITY, NOT ENFORCEMENT — said plainly rather than implied as a second
  # gate. `scripts/tests/` also runs inside `precommit` (`ci-pr.yaml`) through
  # an `always_run: true`, `language: python` hook in this repository's own
  # `.pre-commit-config.yaml` — self-provisioned, so it adds no step to that
  # shared job either — and `precommit` already feeds the required
  # `ci / passed` context. THAT hook is what stops a merge; THIS job only
  # catches the regression and shows it as a plainly-named `pytest` check,
  # independent of `.pre-commit-config.yaml` staying correctly wired —
  # refactor the hook, change its `files:` pattern, or break venv
  # provisioning, and this job still runs and still reports. It is
  # deliberately NOT wired via `needs:` into the `ci` job below, for two
  # reasons: a red suite would skip `zizmor`, `trivy`, `gitleaks`, `template`
  # and `portability` entirely, inverting the cheapest repository-local check
  # ahead of the security scans; and with `ci` skipped, `ci-pr.yaml`'s
  # `passed` job never runs either, so `ci / passed` would never report at
  # all — with `bypass_actors: []` on the ruleset, that leaves the pull
  # request blocked on a check stuck PENDING forever rather than one that
  # failed and can be read.
  #
  # IT DOES NOT GATE `ci / passed` ITSELF, and cannot: this is a plain job in
  # this file, not a job inside the reusable `ci-pr.yaml`, so GitHub cannot
  # compose it into the `<caller>/<callee>` context name that comes from a
  # reusable workflow's own jobs. The ruleset on `main` requires only that one
  # context (`repos/yadgarhq/actions/rulesets`, checked 2026-09-06) — this job
  # reports under its own name, `pytest`, and gating already happens through the
  # hook above.
  pytest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # scripts/tests/ imports nothing beyond the standard library and pytest
      # itself. Pinned to the version this suite is verified against, and kept
      # in step with the `pytest-scripts` hook's own pin in
      # `.pre-commit-config.yaml` — if the two ever disagree, that is a drift
      # to fix, not a discrepancy to explain away.
      - name: install pytest
        run: pip install --disable-pip-version-check "pytest==9.1.1"
      - run: python3 -m pytest scripts/tests/ -q

  ci:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci-pr.yaml

  # THE PASSTHROUGH EVERY OTHER REPOSITORY NEEDS TOO, written here first because
  # this repository is a caller like any other. A reusable workflow cannot read a
  # caller's secrets unless the caller hands them over, and an organisation
  # secret reaches the CALLER only.
  #
  # NAMED RATHER THAN `secrets: inherit`, and this repository is where that was
  # settled empirically. `inherit` was tried across the estate on the argument
  # that the callee is the same organisation under the same control; the
  # `workflows` job in `ci-pr.yaml` runs zizmor, whose `secrets-inherit` audit
  # fails the blanket form at High confidence, so every repository went red at
  # once. The audit is right about why: inherit passes every organisation and
  # repository secret the caller can see rather than the two the callee
  # declares, and it grows silently as secrets are added. Naming the two is the
  # fix the audit asks for; an ignore comment would have been a suppression.
  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-pr.yaml
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
