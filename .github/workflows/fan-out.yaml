name: fan-out

# LEDGER 1756 S5, ADR-0982, ADR-0983. An `actions` release, proposed to every
# consumer: one adoption pull request per repository, each moving that
# repository's `yadgarhq/actions` hook block to the new tag as its class
# defines it (`classes.json`). It PROPOSES AND NEVER MERGES (ADR-0690).
#
# CONSUMERS ARE FOUND BY TOPIC, NEVER BY A LIST. A repository is a consumer when
# it carries exactly one `yadgar-class-<name>` topic. Zero or two is an error
# row in the report, and that repository is not touched. Archived repositories
# are skipped; `actions` itself is exempt in `classes.json`.
#
# THE TAG THAT STARTS THIS IS CUT BY THE APP, AND THAT IS WHY IT STARTS AT ALL.
# A tag pushed with `GITHUB_TOKEN` fires no workflow. The `version` job in
# `ci-pr.yaml` creates release tags through the REST API with a `yadgarhq-bot`
# installation token, and an App-created tag does fire `push: tags`. Measured:
# `yadgarhq/task` run 39494744474 (`ci`, event `push`, ref `v0.7.7`, triggering
# actor `yadgarhq-bot[bot]`), whose tag object carries the bot as tagger. The
# `actions` tags carry the same tagger (`v1.35.0`, 2026-10-21T13:10:33Z).
#
# THE FILTER IS A PLAIN vX.Y.Z. A moving tag such as `v1` must never become a
# consumer's pin; `fan_out.py` re-checks the tag and refuses anything else.
#
# DRY BY DEFAULT ON DISPATCH, AND THE TOKEN FOLLOWS THE MODE. `fan_out.py mode`
# says `live=true` only for a tag push, or for a dispatch from `main` with
# `dry_run` false. Anything else is a dry run: the script writes nothing, and
# the token minted for it holds `contents: read` and `pull_requests: read`
# only, so a bug in the script still cannot write. The dry run still needs a
# token: `docs` and `argocd-verify` are private.
#
# TWO TOKENS. The consumer set is whatever carries a class topic when the run
# starts, and a list here would be the hardcoded list ADR-0982 refuses. So a
# metadata-only token lists the organisation, and the token that reads and
# writes consumers is scoped by `repositories:` to what that listing found,
# and by permission to contents and pull requests (the `repin.yaml` pattern),
# which also drops the installation's `administration: write` (plan S5).
#
# ROLLBACK: disable this workflow and close the open `actions-adopt/*` pull
# requests. Consumers keep their old rev; nothing was merged.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "report and diff only; write nothing (live needs main)"
        type: boolean
        default: true
      tag:
        description: "the actions tag to adopt (default: the greatest vX.Y.Z)"
        type: string
        default: ""

permissions: {}

# One fan-out at a time. A second tag cut while the first is still running
# waits rather than racing it on the same consumer branches.
concurrency:
  group: fan-out
  cancel-in-progress: false

jobs:
  fan-out:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # ALL TAGS, because the hook manifest is read at the target tag from this
      # checkout: the write token below is not scoped to `actions` itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: live or dry
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: python3 scripts/fan_out.py mode

      # BOTH OR NEITHER, and red when absent: this workflow has no other job to
      # do, so a missing credential is a failure, not a skip.
      - name: is the release App configured here
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY must both be set"
            exit 1
          fi

      # TOKEN ONE: METADATA, READ, EVERY REPOSITORY. Finding consumers by topic
      # means seeing every repository, private ones included (`docs`,
      # `argocd-verify`), and `GITHUB_TOKEN` sees none of those. So this one
      # token is owner-wide, and it can read repository metadata and nothing
      # else: no contents, no pull requests, no write of any kind.
      #
      # THE ONE ZIZMOR IGNORE, AND ADR-0987 IS ITS AUTHORITY. zizmor's
      # `github-app` audit fails every `owner:` mint without `repositories:`,
      # whatever the permissions, and topic enumeration of private repositories
      # cannot be done any other way; the alternative, a consumer list held as
      # data, is the hardcoded list ADR-0982 refuses. ADR-0987 accepts this one
      # owner-wide token on two conditions, both pinned by
      # `scripts/tests/test_fan_out.py`: it holds `permission-metadata: read`
      # and nothing else (adding any permission reds the suite), and every
      # token that reads contents or writes is scoped by `repositories:`.
      - name: mint the token that lists the repositories
        id: lister
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-metadata: read

      - name: which repositories are consumers
        id: enumerate
        env:
          GH_TOKEN: ${{ steps.lister.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/fan_out.py enumerate --owner "$OWNER" --out "$RUNNER_TEMP/repos.json"

      # TOKEN TWO: THE CONSUMERS AND NOTHING ELSE. Scoped by `repositories:` to
      # the names the step above found, so it cannot reach `actions` itself or
      # any repository without a class topic. `read` unless the mode said live.
      # `enumerate` refuses an empty list: an empty `repositories:` beside
      # `owner:` would mint for every repository.
      - name: mint the token for the consumers
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.enumerate.outputs.repos }}
          permission-contents: ${{ steps.mode.outputs.live == 'true' && 'write' || 'read' }}
          permission-pull-requests: ${{ steps.mode.outputs.live == 'true' && 'write' || 'read' }}

      # On a tag push the tag is the ref that fired this; on dispatch it is the
      # input, or the greatest plain tag. The hook manifest is read at that tag
      # from this checkout (a tag that does not exist fails `git show`). The
      # report goes to the job summary.
      - name: fan out
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LIVE: ${{ steps.mode.outputs.live }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            tag=$(git tag -l 'v*' | python3 scripts/fan_out.py greatest)
          fi
          # Untrusted until this passes: strict ^vN.N.N$, before git, a path or
          # an argument sees it. A live run also needs the tag on main.
          python3 scripts/fan_out.py check-tag -- "$tag"
          if [ "$LIVE" = true ]; then
            python3 scripts/fan_out.py on-main --tag "$tag"
          fi
          git show "refs/tags/${tag}:.pre-commit-hooks.yaml" > "$RUNNER_TEMP/manifest.yaml"
          args=(run --owner "$OWNER" --tag "$tag" --repos "$RUNNER_TEMP/repos.json"
                --manifest "$RUNNER_TEMP/manifest.yaml")
          if [ "$LIVE" = true ]; then
            args+=(--live)
          fi
          python3 scripts/fan_out.py "${args[@]}"
