# This repository is workflows and hook definitions — YAML and nothing else.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        args: [--allow-multiple-documents]
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect secrets and credentials
        language: system
        entry: gitleaks git --pre-commit --staged --verbose
        pass_filenames: false
      # Workflows reaching every repository deserve a linter. actionlint catches
      # the expression and context errors that otherwise surface as a failed run
      # in somebody else's repository.
      #
      # THIS HOOK COULD NOT FAIL, THREE TIMES OVER, and the entry below is the
      # third correction. Generation one was the binary being installed nowhere,
      # so the hook reported Passed having linted nothing. Generation two was
      # `command -v actionlint >/dev/null && actionlint || echo "..."`, where
      # `A && B || C` runs C when B FAILS just as readily as when A does, so a
      # real finding printed its error, printed the skip message, and exited 0.
      # Generation three is the `if`/`else` that replaced it: it failed for
      # anyone who HAD actionlint, and still exited 0 for anyone who did not.
      #
      # THE SKIP IS GONE, and it is publication that removes it rather than a
      # new fact about this repository. The same hook is now published in
      # .pre-commit-hooks.yaml for all sixteen repositories (ledger 620), and a
      # named check that sixteen repositories reference has to mean one thing.
      # "Passed, having checked nothing" is not a thing it can mean. A
      # contributor without actionlint gets "Executable `actionlint` not found"
      # instead of a green tick.
      #
      # A FOURTH WAY IT COULD NOT FAIL, one level down: actionlint silently
      # disables its whole shellcheck rule class when that binary is absent, so
      # the same green tick meant either "clean" or "clean apart from a rule
      # class nobody ran". The entry is now a script that refuses in that case.
      # The reasoning, the measurement and why the guard asks actionlint rather
      # than $PATH are all in .pre-commit-hooks.yaml above the published twin.
      #
      # THIS ENTRY IS KEPT BYTE-IDENTICAL TO THE PUBLISHED ONE, for the reason
      # the prettier entry below records: this repository cannot reference its
      # own rev before that rev is tagged, so the hook is declared twice and the
      # two must not drift. If they ever disagree, this file is the one that is
      # wrong. Divergence here would make yadgarhq/actions the single repository
      # in the estate where actionlint can still no-op — the exact inverse of
      # the defect being closed.
      - id: actionlint
        name: actionlint
        language: script
        entry: hooks/actionlint.sh
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      # THE HOOK ABOVE CANNOT RUN AT ALL ABOVE A CERTAIN SIZE, so the size is
      # checked too. actionlint pipes every `run:` block to shellcheck and does
      # not drain the pipe while it writes; above 8192 bytes the write never
      # returns, actionlint hangs and the job burns its whole timeout. Measured
      # rather than guessed — the numbers are in the script.
      #
      # Local to this repository: a consumer's workflow is a twenty-line caller
      # with nothing to measure, and publishing this would put a check in every
      # repository for a mistake only this one can make.
      - id: run-block-size
        name: a run block must stay small enough to lint
        language: system
        entry: python3 hooks/run_block_size.py
        files: ^\.github/workflows/.*\.ya?ml$
      # Defined locally rather than pulled from this repository's own published
      # hooks: a repository referencing its own rev cannot validate a change
      # before that change is tagged. The version is kept identical to
      # .pre-commit-hooks.yaml on purpose — if the two ever disagree, this file
      # is the one that is wrong.
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.9.6"]
        entry: prettier --write --ignore-unknown
        types_or: [markdown, json, yaml]
      # LEDGER 686. Nothing ran scripts/tests/ anywhere before this hook — not
      # in CI, not here. `language: python` rather than `system`, so this
      # provisions its own venv and needs no binary already on the machine or
      # CI runner. That is the failure class the actionlint hook above exists
      # to catch for a compiled binary; a self-provisioned interpreter hook
      # cannot have it. This is the mechanism that actually gates — see the
      # `pytest` job's comment in `ci-self.yaml` for why that job is visibility
      # only and this hook is the enforcement.
      #
      # `always_run: true`, and `files:` is kept only as documentation of what
      # this hook is about. `pass_filenames: false` does NOT exempt a hook from
      # `files:` filtering — measured against pre-commit 4.5.1: without
      # `always_run`, `pre-commit run --files other.txt` against this exact
      # block reports `pytest scripts/tests......(no files to check)Skipped`,
      # exit 0. `pre-commit/action`'s `--all-files` default masks that in CI
      # today because `scripts/` is populated, but a pull request that moves
      # `pr_body.py`/`scan_delta.py` to, say, `tools/` would make `^scripts/`
      # match nothing — Skipped-green, `precommit` green, `ci / passed` green,
      # and with `required_approving_review_count: 0` that merges past a
      # visible red `pytest` job with no human required to look at it. The
      # change most likely to break this guard is the one most likely to
      # silently disarm it, so this hook does not get to skip.
      #
      # PYTEST VERSION KEPT IN STEP WITH `ci-self.yaml`'S `pytest` JOB, the way
      # the actionlint and prettier entries above stay in step with their own
      # published/CI twins: if the two ever disagree, that is a drift to fix,
      # not a discrepancy to explain away.
      #
      # PYYAML IS HERE FOR THE SUBJECT, NOT FOR THE SUITE. `scripts/tests/`
      # imports nothing beyond the standard library and pytest, but it runs
      # `helm_pin_agrees.py` as a SUBPROCESS of `sys.executable` — which inside
      # this hook is the hook's own venv — and that gate parses YAML. Without it
      # all twelve of its cases fail with `ModuleNotFoundError: No module named
      # 'yaml'`, a red that blames the suite for a missing dependency of the
      # thing it is testing. Measured, not predicted: that is exactly how they
      # failed on the first run of this hook.
      #
      # `d80_portability.py` parses YAML too, and ledger 731 gave it the test
      # this comment used to say it lacked — so it is now a second reason for
      # this line rather than a future one. Its suite spawns the gate AND a stub
      # `helm` written in the same interpreter, which parses YAML as well.
      # Pinned to the same 6.0.3 the `portability` job installs in `ci-pr.yaml`.
      - id: pytest-scripts
        name: pytest scripts/tests
        language: python
        additional_dependencies: ["pytest==9.1.1", "pyyaml==6.0.3"]
        entry: pytest scripts/tests/ -q
        pass_filenames: false
        always_run: true
        files: ^scripts/
      # LEDGER 649. The helm the estate renders with is ONE constant with three
      # copies — `precommit` and `portability` in `ci-pr.yaml`, `chart` in
      # `ci-release.yaml` — and until this hook nothing compared them. Ledger 635
      # set all three; nothing kept them set, and the divergence it exists to
      # stop was already measured: `yadgarhq/iam` run 33968099875 installed helm
      # v4.2.4 for one job and v3.18.4 for another, two majors inside one run.
      #
      # LOCAL AND NOT PUBLISHED in `.pre-commit-hooks.yaml`, unlike the hooks
      # above it. This is a rule about THIS repository's own workflows rather
      # than one the estate shares — no consumer repository installs helm, they
      # call `ci-pr.yaml` and get these steps — which is the same reasoning
      # `yadgarhq/config` records above its own local `one-source-per-knob`.
      #
      # `always_run` with `pass_filenames: false`, for the reason that gate
      # gives too: a disagreement is a property of several files TOGETHER, so a
      # hook that saw only the changed one would miss half of every divergence
      # it exists to find.
      #
      # `language: python` rather than `system`, so pre-commit provisions the
      # interpreter and PyYAML rather than trusting a bare CI runner to carry
      # them — the failure class the actionlint entry above documents at length.
      - id: helm-pin-agrees
        name: every azure/setup-helm step installs the same helm
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        entry: python scripts/helm_pin_agrees.py
        pass_filenames: false
        always_run: true
      # LEDGER 715. `containers/rust-build/Containerfile` runs `apt-get upgrade
      # -y`, and that line is the whole of the weekly security refresh — the
      # `FROM` is digest-pinned, so a rebuild on its own moves nothing. It works
      # only because the `RUN` re-executes on every build. A `cache-from` /
      # `cache-to` pair, the obvious speed-up, turns it into a permanent cache
      # hit and freezes libexpat1, libpcre2 and libssh2, with nothing anywhere
      # reporting it: the findings are MEDIUM and UNKNOWN while the scan gate is
      # CRITICAL,HIGH, and a cached image is internally consistent and merely
      # old. The gate's own header argues that down against the two alternatives
      # — asserting the installed versions at build time, and cache-busting the
      # layer from inside the Containerfile.
      #
      # LOCAL AND NOT PUBLISHED in `.pre-commit-hooks.yaml`, the same reasoning
      # as `helm-pin-agrees` above: no consumer repository builds an image of
      # its own — they call `ci-release.yaml` and get its build step, which this
      # gate already reads from here.
      #
      # `always_run` with `pass_filenames: false`, because the subject is every
      # build step in the directory rather than the file somebody touched.
      - id: no-build-cache
        name: no docker/build-push-action step declares a layer cache
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        entry: python scripts/no_build_cache.py
        pass_filenames: false
        always_run: true
