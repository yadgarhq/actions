# This repository is workflows and hook definitions — YAML and nothing else.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        args: [--allow-multiple-documents]
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect secrets and credentials
        language: system
        entry: gitleaks git --pre-commit --staged --verbose
        pass_filenames: false
      # Workflows reaching every repository deserve a linter. actionlint catches
      # the expression and context errors that otherwise surface as a failed run
      # in somebody else's repository.
      #
      # THIS HOOK COULD NOT FAIL, THREE TIMES OVER, and the entry below is the
      # third correction. Generation one was the binary being installed nowhere,
      # so the hook reported Passed having linted nothing. Generation two was
      # `command -v actionlint >/dev/null && actionlint || echo "..."`, where
      # `A && B || C` runs C when B FAILS just as readily as when A does, so a
      # real finding printed its error, printed the skip message, and exited 0.
      # Generation three is the `if`/`else` that replaced it: it failed for
      # anyone who HAD actionlint, and still exited 0 for anyone who did not.
      #
      # THE SKIP IS GONE, and it is publication that removes it rather than a
      # new fact about this repository. The same hook is now published in
      # .pre-commit-hooks.yaml for all sixteen repositories (ledger 620), and a
      # named check that sixteen repositories reference has to mean one thing.
      # "Passed, having checked nothing" is not a thing it can mean. The
      # published entry is bare, every other published system hook is bare, and
      # a contributor without actionlint now gets pre-commit's own
      # "Executable `actionlint` not found" instead of a green tick.
      #
      # THIS ENTRY IS KEPT BYTE-IDENTICAL TO THE PUBLISHED ONE, for the reason
      # the prettier entry below records: this repository cannot reference its
      # own rev before that rev is tagged, so the hook is declared twice and the
      # two must not drift. If they ever disagree, this file is the one that is
      # wrong. Divergence here would make yadgarhq/actions the single repository
      # in the estate where actionlint can still no-op — the exact inverse of
      # the defect being closed.
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      # THE HOOK ABOVE CANNOT RUN AT ALL ABOVE A CERTAIN SIZE, so the size is
      # checked too. actionlint pipes every `run:` block to shellcheck and does
      # not drain the pipe while it writes; above 8192 bytes the write never
      # returns, actionlint hangs and the job burns its whole timeout. Measured
      # rather than guessed — the numbers are in the script.
      #
      # Local to this repository: a consumer's workflow is a twenty-line caller
      # with nothing to measure, and publishing this would put a check in every
      # repository for a mistake only this one can make.
      - id: run-block-size
        name: a run block must stay small enough to lint
        language: system
        entry: python3 hooks/run_block_size.py
        files: ^\.github/workflows/.*\.ya?ml$
      # Defined locally rather than pulled from this repository's own published
      # hooks: a repository referencing its own rev cannot validate a change
      # before that change is tagged. The version is kept identical to
      # .pre-commit-hooks.yaml on purpose — if the two ever disagree, this file
      # is the one that is wrong.
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.9.6"]
        entry: prettier --write --ignore-unknown
        types_or: [markdown, json, yaml]
