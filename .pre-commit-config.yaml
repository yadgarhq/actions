# This repository is workflows and hook definitions — YAML and nothing else.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        args: [--allow-multiple-documents]
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect secrets and credentials
        language: system
        entry: gitleaks git --pre-commit --staged --verbose
        pass_filenames: false
      # Workflows reaching every repository deserve a linter. actionlint catches
      # the expression and context errors that otherwise surface as a failed run
      # in somebody else's repository.
      - id: actionlint
        name: actionlint
        language: system
        entry: bash -c 'command -v actionlint >/dev/null && actionlint || echo "actionlint not installed — skipping (CI enforces)"'
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

  # JSON, YAML and Markdown. `proseWrap: preserve` in .prettierrc is doing real
  # work: without it prettier reflows prose and every future diff to a
  # hand-wrapped document becomes unreadable. With it, prose line breaks are left
  # exactly as written and only markup is normalised — measured at 15% of lines
  # on the largest document here, all of it emphasis characters and table
  # alignment.
  #
  # pre-commit/mirrors-prettier is archived; rbubley's is the maintained fork.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml]
