# This repository is workflows and hook definitions — YAML and nothing else.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        args: [--allow-multiple-documents]
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect secrets and credentials
        language: system
        entry: gitleaks git --pre-commit --staged --verbose
        pass_filenames: false
      # Workflows reaching every repository deserve a linter. actionlint catches
      # the expression and context errors that otherwise surface as a failed run
      # in somebody else's repository.
      #
      # THIS HOOK COULD NOT FAIL, TWICE OVER, and the second time is why the
      # entry below is shaped the way it is. It read
      # `command -v actionlint >/dev/null && actionlint || echo "..."`, and
      # `A && B || C` runs C when B FAILS just as readily as when A does. So a
      # real finding printed its error, printed the skip message, and exited 0.
      # Reproduced with a stub binary that exits 1. The first generation of the
      # same defect was the binary being installed nowhere; the sentence
      # excusing the skip was false in both, and was rewritten once already.
      #
      # WHAT IS TRUE NOW, in three parts, because the claim that was wrong twice
      # was wrong by being vague:
      #
      #   1. THE HOOK FAILS FOR ANYONE WHO HAS actionlint. `if/else` guards the
      #      absent binary and nothing else, and actionlint is the last command
      #      of the taken branch, so its exit status is the hook's. Verified
      #      against all three states — absent, present and clean, present and
      #      failing — rather than read off the shape.
      #   2. IT FAILS IN CI ON EVERY PULL REQUEST. `ci / precommit` installs
      #      actionlint unconditionally, runs every hook with no SKIP list, and
      #      is in the `needs` of `passed` — and `ci / passed` is the required
      #      check. So local and CI enforcement now come from this one line.
      #   3. IT COVERS THIS REPOSITORY AND NO OTHER. The hook is declared here
      #      and is NOT published in .pre-commit-hooks.yaml, so no other
      #      repository in the organisation declares it and none has its
      #      workflows linted by actionlint anywhere. Publishing it is the
      #      follow-up, not this change (ledger 618).
      #
      # THE SKIP STAYS on purpose: a contributor without the binary should still
      # be able to commit. Point 1 is now the whole of what it excuses.
      - id: actionlint
        name: actionlint
        language: system
        entry: bash -c 'if command -v actionlint >/dev/null; then actionlint; else echo "actionlint not installed, so this hook checked nothing — ci / precommit lints this repository on every pull request"; fi'
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      # THE HOOK ABOVE CANNOT RUN AT ALL ABOVE A CERTAIN SIZE, so the size is
      # checked too. actionlint pipes every `run:` block to shellcheck and does
      # not drain the pipe while it writes; above 8192 bytes the write never
      # returns, actionlint hangs and the job burns its whole timeout. Measured
      # rather than guessed — the numbers are in the script.
      #
      # Local to this repository: a consumer's workflow is a twenty-line caller
      # with nothing to measure, and publishing this would put a check in every
      # repository for a mistake only this one can make.
      - id: run-block-size
        name: a run block must stay small enough to lint
        language: system
        entry: python3 hooks/run_block_size.py
        files: ^\.github/workflows/.*\.ya?ml$
      # Defined locally rather than pulled from this repository's own published
      # hooks: a repository referencing its own rev cannot validate a change
      # before that change is tagged. The version is kept identical to
      # .pre-commit-hooks.yaml on purpose — if the two ever disagree, this file
      # is the one that is wrong.
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.9.6"]
        entry: prettier --write --ignore-unknown
        types_or: [markdown, json, yaml]
