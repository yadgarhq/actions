# The canonical version of every tool this repository pins.
#
# THE WORKFLOWS READ THIS FILE (ledger 1756 S2b, ADR-0981). `scripts/tool_versions.py`
# turns it into step outputs, read at the commit of yadgarhq/actions that is
# running, and every install step takes its version from those outputs. A
# workflow that names a version of its own fails `scripts/versions_parity.py`.
#
# `scripts/versions_parity.py` (run by `scripts/tests/test_versions_parity.py`)
# finds each PINNED tool by key pattern in the workflows, the pre-commit files, the gate
# scripts, the hook scripts and the Containerfiles. In a workflow each site must READ
# its tool's output; anywhere else it must equal `version` here. It fails when the
# number of sites differs from `sites`.
#
# TO MOVE A PIN: change `version` here (and `sha256`, if present) and every literal
# copy outside the workflows in the same pull request. That is the whole rule for
# every tool EXCEPT the four the hooks assert.
#
# GITLEAKS, HADOLINT, ACTIONLINT AND CARGO-DENY MOVE IN TWO STEPS (ledger 1756 S3,
# ADR-0983). `hooks/tool_version.py` refuses a local binary unless it is `version`
# or listed in `accept`, read from this file at the `rev` a repository pins. CI
# installs `version` from this file on main. A one-step move on main would red
# every repository whose `rev` does not yet accept the new version.
#   1. Accept: add the new version to the tool's `accept` list, e.g.
#      `gitleaks: { version: "8.30.1", ..., accept: ["8.31.0"] }`. Release, and let
#      the ADR-0982 fan-out land that tag in every repository.
#   2. Move: only after every adoption pull request has merged, change `version`
#      (and `sha256`) to the new version and delete it from `accept`.
# `ci / hook_tools_adopted` (`scripts/hook_tools_adopted.py`, yaadgaar 231) refuses
# step 2 while any consumer's rev does not accept the new version; a private
# consumer is judged from its rev in `classes.json` `private_consumers`.
# `accept` on any other tool is refused by `scripts/versions_parity.py`.
# TO ADD OR DELETE A SITE: change `sites` in the same pull request.
#
# ONE LINE PER TOOL, as a flow mapping. `tool_versions.py` runs before setup-python,
# on the standard library only, and reads that shape and no other.
#
# `sha256` is the sum of the linux x86_64 artefact the workflows download, taken from
# the upstream checksum file at that version (URLs in
# scripts/tests/test_versions_parity.py). The install step refuses any other sum.
#
# `rust-toolchain` is the toolchain CI installs: `stable` resolved to 1.99.1 when it was pinned
# (2026-10-21). `rust-image` is the toolchain the build images carry. They differ
# today; moving either is its own change.
#
# `python` is a minor, which `actions/setup-python` resolves to its newest patch.
#
# `prettier-ignore` keeps prettier from folding a long line into block style,
# which `tool_versions.py` refuses.
# prettier-ignore
tools:
  gitleaks: { version: "8.30.1", sites: 2, sha256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" }
  hadolint: { version: "2.14.0", sites: 1, sha256: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47" }
